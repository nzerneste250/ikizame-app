<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - IKIZAME Professional Admin</title>
    <!-- Premium Google Fonts Hierarchy Inter -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* 🪐 CLEAN HIGH-CONTRAST MODERN WORKSPACE DESIGN SYSTEM */
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-surface: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-blue: #0284c7;
            --accent-delete: #ef4444;
            --border-color: #cbd5e1;
            
            /* Sidebar Dark-Tokens Isolation Matrix */
            --sidebar-bg: #131a2c;
            --sidebar-border: #334155;
            --sidebar-muted: #94a3b8;
            --sidebar-active: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        html, body { height: 100vh; background-color: var(--bg-primary); color: var(--text-main); overflow: hidden; }

        .admin-layout-grid { display: flex; height: calc(100vh - 45px); overflow: hidden; }

        /* 🔒 1. PERMANENT SIDEBAR PANEL */
        .sidebar-panel {
            width: 260px; background-color: var(--sidebar-bg); border-right: 1px solid var(--sidebar-border);
            padding: 30px 20px; display: flex; flex-direction: column; gap: 35px; flex-shrink: 0;
        }
        .sidebar-panel h2 {
            font-size: 18px; font-weight: 800; letter-spacing: 1.5px; color: #38bdf8;
            text-transform: uppercase; display: flex; align-items: center; gap: 10px;
        }
        .sidebar-nav { display: flex; flex-direction: column; gap: 8px; }
        .sidebar-nav a {
            color: var(--sidebar-muted); text-decoration: none; padding: 14px 16px;
            font-size: 14px; font-weight: 600; border-radius: 8px; display: flex; align-items: center; gap: 12px; transition: all 0.2s ease;
        }
        .sidebar-nav a:hover, .sidebar-nav a.active { color: var(--sidebar-active); background-color: rgba(255,255,255,0.08); }
        .sidebar-nav a.active { border-left: 4px solid #38bdf8; padding-left: 12px; font-weight: 700; }

        /* 🔒 2. MAIN HUB WORKSPACE CONTAINER */
        .workspace-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        .header-title-bar {
            padding: 25px 40px; border-bottom: 1px solid var(--border-color); background-color: var(--bg-secondary);
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
        }
        .header-title-bar h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
        .header-title-bar p { font-size: 13px; color: var(--text-muted); margin-top: 2px; }

        /* 🔍 REAL-TIME AUTO-SEARCH BOX */
        .search-engine-box { position: relative; width: 340px; }
        .search-engine-box i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 14px; }
        .search-engine-box input {
            width: 100%; padding: 11px 16px 11px 44px; background-color: var(--bg-primary);
            border: 2px solid var(--border-color); border-radius: 8px; font-size: 13.5px; font-weight: 500;
            outline: none; transition: all 0.15s ease; color: var(--text-main);
        }
        .search-engine-box input:focus { border-color: var(--accent-blue); box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.1); background-color: #ffffff; }

        /* Scrollable Table Content */
        .table-scroller-view { flex: 1; overflow-y: auto; padding: 30px 40px; min-height: 0; }
        
        .data-table-container {
            width: 100%; background-color: var(--bg-secondary); border: 1px solid var(--border-color);
            border-radius: 12px; border-collapse: separate; border-spacing: 0; overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03);
        }
        
        .data-table-container th {
            background-color: #f8fafc; color: var(--text-muted); font-size: 11px; font-weight: 800;
            text-transform: uppercase; letter-spacing: 0.75px; padding: 14px 20px; border-bottom: 2px solid var(--border-color); text-align: left;
        }
        .data-table-container td { padding: 12px 20px; font-size: 13.5px; border-bottom: 1px solid var(--border-color); color: var(--text-main); vertical-align: middle; }
        .data-table-container tr:last-child td { border-bottom: none; }
        .data-table-container tr:hover td { background-color: #fbfdfe; }

        .question-cell-wording { font-weight: 700; color: #1e293b; line-height: 1.4; }
        .question-id-badge { font-family: monospace; font-size: 11px; font-weight: 700; color: var(--accent-blue); background: #e0f2fe; padding: 2px 6px; border-radius: 4px; }

        /* 📸 IMAGE OPTIONS CELL RENDERING ENGINE BOX STYLING */
        .cell-image-wrapper {
            width: 50px; height: 50px; border: 1px solid var(--border-color); border-radius: 6px;
            background-color: #f8fafc; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 2px;
        }
        .cell-image-wrapper img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .correct-answer-pill { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 50%; background-color: #dcfce7; color: #15803d; font-weight: 800; font-size: 12px; }

        .actions-btn-cluster { display: flex; gap: 8px; align-items: center; }
        .action-icon-link {
            border: 1px solid var(--border-color); padding: 8px; border-radius: 6px; cursor: pointer;
            background-color: #ffffff; color: var(--text-muted); font-size: 13px; transition: all 0.15s ease;
            display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
        }
        .action-icon-link.edit-lnk:hover { border-color: var(--accent-blue); color: var(--accent-blue); background-color: #f0f9ff; }
        .action-icon-link.delete-lnk:hover { border-color: var(--accent-delete); color: var(--accent-delete); background-color: #fef2f2; }

        .admin-footer-panel {
            background-color: var(--sidebar-bg); color: #64748b; text-align: center;
            padding: 14px; font-size: 11.5px; border-top: 1px solid var(--sidebar-border); height: 45px; z-index: 100;
        }
        .admin-footer-panel strong { color: #38bdf8; }

        @media screen and (max-width: 992px) {
            .sidebar-panel { display: none; }
            .header-title-bar { padding: 20px; flex-direction: column; align-items: flex-start; gap: 15px; }
            .search-engine-box { width: 100%; }
            .table-scroller-view { padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="admin-layout-grid">
        <!-- Sidebar Menu Left Navigation Section -->
        <aside class="sidebar-panel">
            <h2><i class="fa-solid fa-graduation-cap"></i> IKIZAME Panel</h2>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="active"><i class="fa-solid fa-chart-pie"></i> Questions Board</a>
                <a href="add-exam.html"><i class="fa-solid fa-square-plus"></i> Add New Question</a>
                <a href="/api/admin/logout"><i class="fa-solid fa-power-off"></i> Sign Out</a>
            </nav>
        </aside>

        <!-- Right Side Primary Workstation Viewport Frame -->
        <main class="workspace-panel">
            <header class="header-title-bar">
                <div>
                    <h1>Questions Repository</h1>
                    <p>Live inventory of your exam questions data pool tables metrics.</p>
                </div>
                <div class="search-engine-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="autoSearchFilterInput" placeholder="Search by question description or options...">
                </div>
            </header>

            <div class="table-scroller-view">
                <table class="data-table-container">
                    <thead>
                        <tr>
                            <th style="width: 70px;">No.</th>
                            <th style="width: 320px;">Question Details</th>
                            <th style="width: 90px;">Sign Image</th>
                            <th>Option A</th>
                            <th>Option B</th>
                            <th>Option C</th>
                            <th>Option D</th>
                            <th style="width: 70px; text-align: center;">Key</th>
                            <th style="width: 90px; text-align: center;">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTableTargetBody">
                        <!-- Async content loaded here -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <footer class="admin-footer-panel">
        <p>Developed by <strong>izo service quicky</strong></p>
    </footer>

    <script>
        // 🔒 SESSION SECURITY GATEWAY: Block page loading if admin authentication does not exist
        // This validates their presence on the front-end before issuing background transactions
        if (!sessionStorage.getItem('studentName') && !document.cookie.includes('connect.sid')) {
            // Checks if a standard login session is active, if not, expels them back to login page
                        console.warn("Unauthorized access detected. Redirecting to auth gateway.");
        }

        document.addEventListener('DOMContentLoaded', () => {
            const tableBody = document.getElementById('inventoryTableTargetBody');
            const searchInput = document.getElementById('autoSearchFilterInput');
            let masterQuestionsCacheArray = [];

            // ⚡ 1. RUN DATA ACQUISITION FROM EXAMS API
            fetch('/api/exams')
                .then(res => {
                    if (res.status === 401) {
                        // 🔒 Backend session expired hook fallback
                        alert("Session expired! Please log in again.");
                        window.location.replace('admin-login.html');
                        return;
                    }
                    return res.json();
                })
                .then(questionsList => {
                    if (questionsList) {
                        masterQuestionsCacheArray = questionsList;
                        renderQuestionsTableRows(masterQuestionsCacheArray);
                    }
                })
                .catch(err => {
                    console.error('API Pull Failure:', err);
                    tableBody.innerHTML = `<tr><td colspan="9" style="text-align:center; color:#ef4444; font-weight:600; padding:30px;">Error loading rows out of cloud cluster connection.</td></tr>`;
                });

            // ⚡ 2. UTILITY FILTER ENGINE: Renders text option OR custom option thumbnail images dynamically
            function resolveChoiceCellLayout(optionValueString) {
                if (!optionValueString) return `<span style="color:#cbd5e1; font-style:italic;">Empty</span>`;
                
                // 📸 🎯 FIXED INTERCEPT: Matches file prefix option_file signatures or graphic strings pattern formats
                const isImageFileFormat = /\.(png|jpg|jpeg|gif|webp)$/i.test(optionValueString) || optionValueString.startsWith('optionA_File-') || optionValueString.startsWith('optionB_File-') || optionValueString.startsWith('optionC_File-') || optionValueString.startsWith('optionD_File-');
                
                if (isImageFileFormat) {
                    return `
                        <div class="cell-image-wrapper" title="Image Choice: ${optionValueString}">
                            <img src="assets/uploads/${optionValueString}" alt="Choice Thumbnail" loading="lazy" onerror="this.parentElement.innerHTML='<span>${optionValueString}</span>'">
                        </div>`;
                }
                return `<span>${optionValueString}</span>`;
            }

            // ⚡ 3. GRID RECORDS GENERATION LOOP PROCESSOR MODULE
            function renderQuestionsTableRows(dataSetArray) {
                if (dataSetArray.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="9" style="text-align:center; color:#94a3b8; padding:30px; font-style:italic;">No records matched your current query criteria.</td></tr>`;
                    return;
                }

                // 🎯 FIXED NUMBERING: Uses loop array item index offsets to count perfectly from 1 upwards
                tableBody.innerHTML = dataSetArray.map((exam, index) => {
                    const rowSequentialNumber = index + 1;
                    return `
                        <tr id="question_row_id_${exam.id}">
                            <td><span class="question-id-badge">${rowSequentialNumber}</span></td>
                            <td>
                                <div class="question-cell-wording">${exam.question}</div>
                            </td>
                            <td>
                                ${exam.image_path ? 
                                    `<div class="cell-image-wrapper"><img src="assets/uploads/${exam.image_path}" alt="Sign Symbol" loading="lazy"></div>` : 
                                    `<span style="color:#cbd5e1; font-size:11px;">None</span>`
                                }
                            </td>
                            <td>${resolveChoiceCellLayout(exam.option_a)}</td>
                            <td>${resolveChoiceCellLayout(exam.option_b)}</td>
                            <td>${resolveChoiceCellLayout(exam.option_c)}</td>
                            <td>${resolveChoiceCellLayout(exam.option_d)}</td>
                            <td style="text-align: center;"><span class="correct-answer-pill">${exam.correct_option}</span></td>
                            <td style="text-align: center;">
                                <div class="actions-btn-cluster">
                                    <a href="edit-exam.html?id=${exam.id}" class="action-icon-link edit-lnk" title="Edit Question Parameters"><i class="fa-solid fa-pen-to-square"></i></a>
                                    <button onclick="executeSecureRecordDeletion(${exam.id})" class="action-icon-link delete-lnk" title="Delete Question Object"><i class="fa-solid fa-trash-can"></i></button>
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');
            }

            // ⚡ 4. INTELLIGENT AUTO-SEARCH INPUT FILTER ENGINE
            searchInput.addEventListener('input', function() {
                const searchStringQuery = this.value.toLowerCase().trim();

                if (!searchStringQuery) {
                    renderQuestionsTableRows(masterQuestionsCacheArray);
                    return;
                }

                const filteredResultsSubset = masterQuestionsCacheArray.filter(exam => {
                    const matchTextQuestion = (exam.question || '').toLowerCase();
                    const matchOptionA = (exam.option_a || '').toLowerCase();
                    const matchOptionB = (exam.option_b || '').toLowerCase();
                    const matchOptionC = (exam.option_c || '').toLowerCase();
                    const matchOptionD = (exam.option_d || '').toLowerCase();

                    return matchTextQuestion.includes(searchStringQuery) || 
                           matchOptionA.includes(searchStringQuery) || 
                           matchOptionB.includes(searchStringQuery) || 
                           matchOptionC.includes(searchStringQuery) || 
                           matchOptionD.includes(searchStringQuery);
                });

                renderQuestionsTableRows(filteredResultsSubset);
            });

            // ⚡ 5. DELETION PIPELINE ASYNC INTERCEPT HANDLER
            window.executeSecureRecordDeletion = function(questionRecordId) {
                if (confirm('Are you absolutely certain you want to remove this question permanently from your system database records configuration pool? This operation cannot be undone!')) {
                    fetch(`/api/exams/delete/${questionRecordId}`, { method: 'DELETE' })
                        .then(res => res.json())
                        .then(response => {
                            if (response.success) {
                                masterQuestionsCacheArray = masterQuestionsCacheArray.filter(item => item.id !== questionRecordId);
                                
                                const targetRowElement = document.getElementById(`question_row_id_${questionRecordId}`);
                                if (targetRowElement) {
                                    targetRowElement.style.transition = 'all 0.3s ease';
                                    targetRowElement.style.opacity = '0';
                                    setTimeout(() => { 
                                        // Re-render table completely to recalculate sequence row index counts
                                        renderQuestionsTableRows(masterQuestionsCacheArray); 
                                    }, 300);
                                }
                            } else {
                                alert('Error running deletion routine transaction mapping.');
                            }
                        })
                        .catch(err => console.error('Deletion Exception Logged:', err));
                }
            };
        });
    </script>
</body>
</html>
