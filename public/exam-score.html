<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <!-- 🎯 BRANDING HEADER: LINKS DIRECTLY TO YOUR LOGO IN THE UPLOADS FOLDER -->
    <link rel="icon" type="image/png" href="assets/uploads/logo.png">
    <title>IKIZAMINI | Amanota Yawe - Ikizamini cya Provisoire mu Rwanda | Practice Driving Theory Exam</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/design-system.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            min-height: 100vh;
            background: #eef6f8;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* ── HEADER, matches index page brand color ── */
        .header {
            min-height: 68px;
            padding: 0 24px;
            background: linear-gradient(110deg, #073b4c, #0b698b 58%, #0e7490);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            box-shadow: 0 8px 24px rgba(7,59,76,.16);
        }
        .header-brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-family: 'Black Han Sans', sans-serif;
            font-size: 1.5rem;
            color: #ffffff;
            letter-spacing: 2px;
        }
        .header-brand img { width:34px; height:34px; border-radius:9px; object-fit:contain; background:#fff; padding:3px; }
        .header-context { color:#bae6fd; font-size:.76rem; font-weight:700; letter-spacing:.3px; }

        /* ── MAIN ── */
        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 52px 20px 72px;
            background: radial-gradient(circle at 15% 15%, rgba(56,189,248,.15), transparent 30%), radial-gradient(circle at 85% 85%, rgba(16,185,129,.12), transparent 30%);
        }

        .card {
            background: #ffffff;
            border: 1px solid #d9e8ec;
            border-radius: 24px;
            padding: 34px 42px 38px;
            width: 100%;
            max-width: 540px;
            text-align: center;
            box-shadow: 0 24px 70px rgba(7,59,76,.14), 0 4px 14px rgba(7,59,76,.06);
            animation: cardIn 0.45s cubic-bezier(0.16,1,0.3,1) both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: none; }
        }

        /* ── ICON CIRCLE ── */
        .icon-circle {
            width: 94px;
            height: 94px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            box-shadow: 0 12px 26px rgba(22,163,74,.22);
            animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) 0.2s both;
        }
        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }
        .icon-circle svg { width: 44px; height: 44px; }

        .circle-pass { background: #16a34a; }
        .circle-fail { background: #ef4444; }

        .result-kicker { color:#64748b; font-size:.72rem; font-weight:800; letter-spacing:1.4px; text-transform:uppercase; margin-bottom:8px; }

        /* ── SCORE TEXT ── */
        .score-line {
            font-size: 2rem;
            font-weight: 800;
            color: #111827;
            margin-bottom: 14px;
            line-height: 1.2;
        }

        .score-panel { background:#f8fbfc; border:1px solid #e2eef1; border-radius:16px; padding:16px 18px 14px; margin:0 auto 18px; max-width:360px; }
        .score-panel-top { display:flex; justify-content:space-between; align-items:center; gap:12px; font-size:.72rem; font-weight:700; color:#64748b; }
        .score-panel-top strong { color:#0b698b; font-size:.82rem; }
        .score-track { height:10px; margin-top:11px; border-radius:99px; background:#dbeafe; overflow:hidden; }
        .score-fill { height:100%; width:0; border-radius:inherit; background:linear-gradient(90deg,#0b698b,#16a34a); transition:width 1s cubic-bezier(.16,1,.3,1); }
        .score-fill.fail { background:linear-gradient(90deg,#f59e0b,#ef4444); }

        /* ── VERDICT ── */
        .verdict {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 2rem;
            letter-spacing: 1px;
            margin-bottom: 22px;
            animation: fadeUp 0.4s ease 0.35s both;
        }
        .verdict-pass { color: #16a34a; }
        .verdict-fail { color: #ef4444; }
        .result-note { color:#64748b; font-size:.78rem; line-height:1.5; margin:0 auto 24px; max-width:360px; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: none; }
        }

        /* ── BUTTONS ── */
        .btn-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeUp 0.4s ease 0.45s both;
        }
        .btn {
            padding: 11px 26px;
            border-radius: 10px;
            font-size: 0.92rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn:active { transform: scale(0.97); }

        .btn-review {
            background: #0b698b;
            color: #ffffff;
            border: none;
            box-shadow: 0 2px 8px rgba(11,105,139,0.3);
            min-width:170px;
        }
        .btn-review:hover { background: #08536e; }

        .btn-home {
            background: #ffffff;
            color: #374151;
            border: 1px solid #d1d5db;
            min-width:140px;
        }
        .btn-home:hover { background: #f3f4f6; }

        /* ── FOOTER, matched to index page style ── */
        .footer {
            min-height: 40px;
            padding: 7px 16px;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            color: #64748b;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1100;
            flex-wrap: wrap;
            gap: 6px;
        }
        @media (max-width: 900px) {
            .footer { position: static !important; margin-top: 24px; }
            .main { padding-bottom: 60px; }
        }
        .footer strong { color: #38bdf8; }

        /* Confetti for pass */
        .confetti-piece {
            position: fixed; top: -10px; pointer-events: none; z-index: 999;
            border-radius: 2px;
            animation: confettiFall linear forwards;
        }
        @keyframes confettiFall {
            0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
            85%  { opacity: 1; }
            100% { transform: translateY(105vh) rotate(600deg); opacity: 0; }
        }

        @media (max-width: 480px) {
            .header { padding:0 16px; }
            .header-context { font-size:.68rem; }
            .card { padding: 30px 18px 28px; border-radius:20px; }
            .score-line { font-size: 1.7rem; }
            .verdict { font-size: 1.7rem; }
            .btn { width:100%; justify-content:center; padding:12px 20px; font-size: 0.88rem; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="header-brand"><img src="assets/uploads/logo.png" alt="IKIZAME logo"> IKIZAME</div>
        <div class="header-context"><i class="fa-solid fa-chart-simple"></i> Amanota Yawe</div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main">
        <div class="card">

            <div class="result-kicker">Ibisubizo by'ikizamini</div>

            <!-- Icon -->
            <div class="icon-circle" id="iconCircle">
                <!-- pass: checkmark / fail: X, set by JS -->
            </div>

            <!-- Score: always out of 20, skipped = 0 -->
            <div class="score-line" id="scoreLine">Amanota wagize: 0/20</div>

            <div class="score-panel">
                <div class="score-panel-top"><span>Urwego rw'amanota</span><strong id="scorePercent">0%</strong></div>
                <div class="score-track"><div class="score-fill" id="scoreFill"></div></div>
            </div>

            <!-- Verdict -->
            <div class="verdict" id="verdictText"></div>
            <p class="result-note" id="resultNote"></p>

            <!-- Buttons -->
            <div class="btn-row">
                <button class="btn btn-review" onclick="window.location.href='/exam-result'">
                    Reba ibisubizo
                </button>
                <button class="btn btn-home" onclick="clearSessionAndGoHome()">
                    Jya Ahabanza
                </button>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <div style="display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:center; text-align:center;">
            <span style="font-size:0.7rem;">© 2026 IKIZAME Empowering Learners Across Rwanda</span>
            <span style="color:rgba(255,255,255,0.3);">|</span>
            <span style="font-size:0.7rem;">Developed by <strong style="color:#38bdf8;">Dotado Stationery Store Ltd</strong></span>
            <span style="color:rgba(255,255,255,0.3);">|</span>
            <a href="/about" style="color:#a78bfa; text-decoration:none; font-weight:700; font-size:0.7rem;">About</a>
            <a href="/terms" style="color:#a78bfa; text-decoration:none; font-weight:700; font-size:0.7rem;">Terms &amp; Conditions</a>
        </div>
    </footer>

<script>
    /* ── Constants ── */
    const TOTAL    = 20;   /* Always out of 20, skipped questions count as 0 */
    const PASS_MIN = 12;

    /* ── Read score; redirect if missing ── */
    const raw   = sessionStorage.getItem('latestScore');
    if (raw === null) { window.location.replace('/'); }

    /* Clamp to valid range: 0–20. Skipped questions already give 0 from exam logic. */
    const score  = Math.min(TOTAL, Math.max(0, parseInt(raw, 10) || 0));
    const passed = score >= PASS_MIN;

    /* ── Icon circle ── */
    const circle = document.getElementById('iconCircle');
    circle.classList.add(passed ? 'circle-pass' : 'circle-fail');
    circle.innerHTML = passed
        ? `<svg viewBox="0 0 24 24" fill="none">
               <path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="2.8"
                     stroke-linecap="round" stroke-linejoin="round"/>
           </svg>`
        : `<svg viewBox="0 0 24 24" fill="none">
               <path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="2.8"
                     stroke-linecap="round"/>
           </svg>`;

    /* ── Score line, denominator always 20 ── */
    document.getElementById('scoreLine').textContent =
        `Amanota wagize: ${score} / ${TOTAL}`;
    const percentage = Math.round((score / TOTAL) * 100);
    document.getElementById('scorePercent').textContent = `${percentage}%`;
    document.getElementById('scoreFill').classList.toggle('fail', !passed);
    setTimeout(() => { document.getElementById('scoreFill').style.width = `${percentage}%`; }, 180);

    /* ── Verdict ── */
    const verdict = document.getElementById('verdictText');
    verdict.textContent = passed ? 'WATSINZE' : 'WATSINZWE';
    verdict.classList.add(passed ? 'verdict-pass' : 'verdict-fail');
    document.getElementById('resultNote').textContent = passed
        ? `Wageze ku manota ${PASS_MIN}/20 asabwa gutsinda. Komereza aho!`
        : `Ukeneye nibura manota ${PASS_MIN}/20 kugira ngo utsinde. Ongera witoze ugerageze nanone.`;

    /* ── Confetti on pass ── */
    if (passed) {
        const colors = ['#16a34a','#4ade80','#0b698b','#38bdf8','#fbbf24','#f472b6','#a78bfa'];
        for (let i = 0; i < 55; i++) {
            const el = document.createElement('div');
            el.className = 'confetti-piece';
            el.style.left              = Math.random() * 100 + 'vw';
            el.style.background        = colors[Math.floor(Math.random() * colors.length)];
            el.style.width             = (6 + Math.random() * 5) + 'px';
            el.style.height            = (10 + Math.random() * 8) + 'px';
            el.style.animationDuration = (1.6 + Math.random() * 2) + 's';
            el.style.animationDelay    = (Math.random() * 1) + 's';
            el.style.transform         = `rotate(${Math.random() * 360}deg)`;
            document.body.appendChild(el);
            el.addEventListener('animationend', () => el.remove());
        }
    }

    /* ── Home button ── */
    function clearSessionAndGoHome() {
        fetch('/api/clear-session', { method: 'POST' })
            .finally(() => { window.location.replace('/'); });
    }
</script>
</body>
</html>
