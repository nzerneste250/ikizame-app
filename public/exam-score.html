<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IKIZAME - Ibisubizo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            min-height: 100vh;
            background: #f9fafb;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* ── HEADER ── */
        .header {
            height: 60px;
            background: #ffffff;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            flex-shrink: 0;
        }
        .header-brand {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 1.5rem;
            color: #0b698b;
            letter-spacing: 1px;
        }

        /* ── MAIN ── */
        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 48px 36px 40px;
            width: 100%;
            max-width: 460px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            animation: cardIn 0.45s cubic-bezier(0.16,1,0.3,1) both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: none; }
        }

        /* ── ICON CIRCLE ── */
        .icon-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 28px;
            animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) 0.2s both;
        }
        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }
        .icon-circle svg { width: 44px; height: 44px; }

        .circle-pass { background: #16a34a; }
        .circle-fail { background: #1a56db; }

        /* ── SCORE TEXT ── */
        .score-line {
            font-size: 1.6rem;
            font-weight: 800;
            color: #111827;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        /* ── VERDICT ── */
        .verdict {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 2rem;
            letter-spacing: 1px;
            margin-bottom: 32px;
            animation: fadeUp 0.4s ease 0.35s both;
        }
        .verdict-pass { color: #16a34a; }
        .verdict-fail { color: #ef4444; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: none; }
        }

        /* ── BUTTONS ── */
        .btn-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeUp 0.4s ease 0.45s both;
        }
        .btn {
            padding: 11px 26px;
            border-radius: 8px;
            font-size: 0.92rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn:active { transform: scale(0.97); }

        .btn-review {
            background: #1a56db;
            color: #ffffff;
            border: none;
            box-shadow: 0 2px 8px rgba(26,86,219,0.25);
        }
        .btn-review:hover { background: #1240a8; }

        .btn-home {
            background: #ffffff;
            color: #374151;
            border: 1px solid #d1d5db;
        }
        .btn-home:hover { background: #f3f4f6; }

        /* ── FOOTER ── */
        .footer {
            height: 44px;
            background: #ffffff;
            border-top: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.72rem;
            color: #9ca3af;
            flex-shrink: 0;
        }
        .footer strong { color: #6b7280; }

        /* Confetti for pass */
        .confetti-piece {
            position: fixed; top: -10px; pointer-events: none; z-index: 999;
            border-radius: 2px;
            animation: confettiFall linear forwards;
        }
        @keyframes confettiFall {
            0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
            85%  { opacity: 1; }
            100% { transform: translateY(105vh) rotate(600deg); opacity: 0; }
        }

        @media (max-width: 480px) {
            .card { padding: 36px 20px 32px; }
            .score-line { font-size: 1.35rem; }
            .verdict { font-size: 1.7rem; }
            .btn { padding: 11px 20px; font-size: 0.88rem; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="header-brand">IKIZAME</div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main">
        <div class="card">

            <!-- Icon -->
            <div class="icon-circle" id="iconCircle">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M12 4v9" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/>
                    <circle cx="12" cy="17.5" r="1.4" fill="#fff"/>
                </svg>
            </div>

            <!-- Score -->
            <div class="score-line" id="scoreLine">Wagerageje ku manota: 0/20</div>

            <!-- Verdict -->
            <div class="verdict" id="verdictText"></div>

            <!-- Buttons -->
            <div class="btn-row">
                <button class="btn btn-review" onclick="window.location.href='/exam-result'">
                    Reba ibisubizo
                </button>
                <button class="btn btn-home" onclick="clearSessionAndGoHome()">
                    Jya Ahabanza
                </button>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        &copy; 2026 IKIZAME &nbsp;&mdash;&nbsp; <strong>izo service quicky</strong>
    </footer>

<script>
    const score    = parseInt(sessionStorage.getItem('latestScore') ?? '0', 10);
    const total    = parseInt(sessionStorage.getItem('latestTotal') ?? '20', 10);
    const PASS_MIN = 12;

    if (!sessionStorage.getItem('latestScore')) {
        window.location.replace('/');
    }

    const passed = score >= PASS_MIN;

    // Icon circle color: green for pass, blue for fail (matching screenshot style)
    const circle = document.getElementById('iconCircle');
    circle.classList.add(passed ? 'circle-pass' : 'circle-fail');

    // Score line
    document.getElementById('scoreLine').textContent = `Wagerageje ku manota: ${score}/${total}`;

    // Verdict
    const verdict = document.getElementById('verdictText');
    verdict.textContent = passed ? 'WATSINZE' : 'WATSINZWE';
    verdict.classList.add(passed ? 'verdict-pass' : 'verdict-fail');

    // Confetti for pass
    if (passed) {
        const colors = ['#16a34a','#4ade80','#1a56db','#60a5fa','#fbbf24','#f472b6','#a78bfa'];
        for (let i = 0; i < 55; i++) {
            const el = document.createElement('div');
            el.className = 'confetti-piece';
            el.style.left              = Math.random() * 100 + 'vw';
            el.style.background        = colors[Math.floor(Math.random() * colors.length)];
            el.style.width             = (6 + Math.random() * 5) + 'px';
            el.style.height            = (10 + Math.random() * 8) + 'px';
            el.style.animationDuration = (1.6 + Math.random() * 2) + 's';
            el.style.animationDelay    = (Math.random() * 1) + 's';
            el.style.transform         = `rotate(${Math.random()*360}deg)`;
            document.body.appendChild(el);
            el.addEventListener('animationend', () => el.remove());
        }
    }

    function clearSessionAndGoHome() {
        fetch('/api/clear-session', { method: 'POST' })
            .finally(() => { window.location.replace('/'); });
    }
</script>
</body>
</html>
