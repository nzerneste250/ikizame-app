<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IKIZAME - Ibisubizo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body {
            min-height: 100vh;
            background: #f9fafb;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
        }

        /* ── HEADER — matches index page brand color ── */
        .header {
            height: 60px;
            background: #0b698b;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .header-brand {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 1.5rem;
            color: #ffffff;
            letter-spacing: 2px;
        }

        /* ── MAIN ── */
        .main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 48px 36px 40px;
            width: 100%;
            max-width: 460px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            animation: cardIn 0.45s cubic-bezier(0.16,1,0.3,1) both;
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: none; }
        }

        /* ── ICON CIRCLE ── */
        .icon-circle {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 28px;
            animation: popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) 0.2s both;
        }
        @keyframes popIn {
            from { transform: scale(0); opacity: 0; }
            to   { transform: scale(1); opacity: 1; }
        }
        .icon-circle svg { width: 44px; height: 44px; }

        .circle-pass { background: #16a34a; }
        .circle-fail { background: #ef4444; }

        /* ── SCORE TEXT ── */
        .score-line {
            font-size: 1.6rem;
            font-weight: 800;
            color: #111827;
            margin-bottom: 10px;
            line-height: 1.2;
        }

        /* ── VERDICT ── */
        .verdict {
            font-family: 'Black Han Sans', sans-serif;
            font-size: 2rem;
            letter-spacing: 1px;
            margin-bottom: 32px;
            animation: fadeUp 0.4s ease 0.35s both;
        }
        .verdict-pass { color: #16a34a; }
        .verdict-fail { color: #ef4444; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: none; }
        }

        /* ── BUTTONS ── */
        .btn-row {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeUp 0.4s ease 0.45s both;
        }
        .btn {
            padding: 11px 26px;
            border-radius: 8px;
            font-size: 0.92rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn:active { transform: scale(0.97); }

        .btn-review {
            background: #0b698b;
            color: #ffffff;
            border: none;
            box-shadow: 0 2px 8px rgba(11,105,139,0.3);
        }
        .btn-review:hover { background: #08536e; }

        .btn-home {
            background: #ffffff;
            color: #374151;
            border: 1px solid #d1d5db;
        }
        .btn-home:hover { background: #f3f4f6; }

        /* ── FOOTER — matches header brand color ── */
        .footer {
            height: 44px;
            background: #0b698b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.72rem;
            color: rgba(255,255,255,0.65);
            flex-shrink: 0;
        }
        .footer strong { color: rgba(255,255,255,0.9); }

        /* Confetti for pass */
        .confetti-piece {
            position: fixed; top: -10px; pointer-events: none; z-index: 999;
            border-radius: 2px;
            animation: confettiFall linear forwards;
        }
        @keyframes confettiFall {
            0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
            85%  { opacity: 1; }
            100% { transform: translateY(105vh) rotate(600deg); opacity: 0; }
        }

        @media (max-width: 480px) {
            .card { padding: 36px 20px 32px; }
            .score-line { font-size: 1.35rem; }
            .verdict { font-size: 1.7rem; }
            .btn { padding: 11px 20px; font-size: 0.88rem; }
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="header-brand">IKIZAME</div>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main">
        <div class="card">

            <!-- Icon -->
            <div class="icon-circle" id="iconCircle">
                <!-- pass: checkmark / fail: X — set by JS -->
            </div>

            <!-- Score: always out of 20, skipped = 0 -->
            <div class="score-line" id="scoreLine">Wagerageje ku manota: 0/20</div>

            <!-- Verdict -->
            <div class="verdict" id="verdictText"></div>

            <!-- Buttons -->
            <div class="btn-row">
                <button class="btn btn-review" onclick="window.location.href='/exam-result'">
                    Reba ibisubizo
                </button>
                <button class="btn btn-home" onclick="clearSessionAndGoHome()">
                    Jya Ahabanza
                </button>
            </div>

        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        &copy; 2026 IKIZAME &nbsp;&mdash;&nbsp; <strong>izo service quicky</strong>
    </footer>

<script>
    /* ── Constants ── */
    const TOTAL    = 20;   /* Always out of 20 — skipped questions count as 0 */
    const PASS_MIN = 12;

    /* ── Read score; redirect if missing ── */
    const raw   = sessionStorage.getItem('latestScore');
    if (raw === null) { window.location.replace('/'); }

    /* Clamp to valid range: 0–20. Skipped questions already give 0 from exam logic. */
    const score  = Math.min(TOTAL, Math.max(0, parseInt(raw, 10) || 0));
    const passed = score >= PASS_MIN;

    /* ── Icon circle ── */
    const circle = document.getElementById('iconCircle');
    circle.classList.add(passed ? 'circle-pass' : 'circle-fail');
    circle.innerHTML = passed
        ? `<svg viewBox="0 0 24 24" fill="none">
               <path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="2.8"
                     stroke-linecap="round" stroke-linejoin="round"/>
           </svg>`
        : `<svg viewBox="0 0 24 24" fill="none">
               <path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="2.8"
                     stroke-linecap="round"/>
           </svg>`;

    /* ── Score line — denominator always 20 ── */
    document.getElementById('scoreLine').textContent =
        `Wagerageje ku manota: ${score} / ${TOTAL}`;

    /* ── Verdict ── */
    const verdict = document.getElementById('verdictText');
    verdict.textContent = passed ? 'WATSINZE' : 'WATSINZWE';
    verdict.classList.add(passed ? 'verdict-pass' : 'verdict-fail');

    /* ── Confetti on pass ── */
    if (passed) {
        const colors = ['#16a34a','#4ade80','#0b698b','#38bdf8','#fbbf24','#f472b6','#a78bfa'];
        for (let i = 0; i < 55; i++) {
            const el = document.createElement('div');
            el.className = 'confetti-piece';
            el.style.left              = Math.random() * 100 + 'vw';
            el.style.background        = colors[Math.floor(Math.random() * colors.length)];
            el.style.width             = (6 + Math.random() * 5) + 'px';
            el.style.height            = (10 + Math.random() * 8) + 'px';
            el.style.animationDuration = (1.6 + Math.random() * 2) + 's';
            el.style.animationDelay    = (Math.random() * 1) + 's';
            el.style.transform         = `rotate(${Math.random() * 360}deg)`;
            document.body.appendChild(el);
            el.addEventListener('animationend', () => el.remove());
        }
    }

    /* ── Home button ── */
    function clearSessionAndGoHome() {
        fetch('/api/clear-session', { method: 'POST' })
            .finally(() => { window.location.replace('/'); });
    }
</script>
</body>
</html>
