<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- 🎯 BRANDING HEADER ICON BINDING -->
    <link rel="icon" type="image/png" href="assets/uploads/logo.png">
    <title>Imfashanyigisho — IKIZAME</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root { 
            --brand: #0b698b; 
            --brand-dark: #08536e; 
            --bg-dark: #0d1b2a; 
            --border-color: rgba(255,255,255,0.1); 
            --text-muted: #64748b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body { 
            height: 100vh; width: 100vw; 
            font-family: 'Inter', sans-serif; 
            background-color: #0d1b2a; color: #ffffff; 
            display: flex; flex-direction: column; overflow: hidden; 
        }
        
        /* ===== 🎯 FIXED GLOBAL BRAND NAVIGATION LAYOUT MATRIX ===== */
        .navbar { 
            position: fixed; top: 0; left: 0; right: 0; z-index: 5000; height: 60px; 
            background: #ffffff; display: flex; align-items: center; justify-content: space-between; 
            padding: 0 4%; border-bottom: 1px solid #e2e8f0; box-shadow: 0 1px 10px rgba(15, 23, 42, 0.03); 
            width: 100vw; box-sizing: border-box;
        }
        .navbar-brand-wrap { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .navbar-brand-wrap img { width: 32px; height: 32px; object-fit: contain; }
        .navbar-brand { font-family: 'Inter', sans-serif; font-size: 1.65rem; font-weight: 800; color: #0b698b; letter-spacing: -0.5px; text-transform: uppercase; line-height: 1; }
        .navbar-links { display: flex; list-style: none; gap: 22px; align-items: center; margin: 0; padding: 0; }
        .navbar-links a { font-family: 'Inter', sans-serif; font-size: 0.84rem; font-weight: 700; color: #475569; text-decoration: none; padding: 20px 0 18px; position: relative; transition: color 0.15s ease; white-space: nowrap; display: inline-block; }
        .navbar-links a:hover { color: #0b698b; }
        .navbar-links a.active { color: #0b698b; font-weight: 800; }
        .navbar-links a.active::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 2px; background: #0b698b; border-radius: 2px 2px 0 0; }
        .lang-badge { display: flex; align-items: center; gap: 8px; font-family: 'Inter', sans-serif; font-size: 0.8rem; font-weight: 700; color: #1e293b; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 5px 12px; user-select: none; }
        .rw-flag-svg { width: 20px; height: 14px; border-radius: 2px; border: 1px solid #e2e8f0; flex-shrink: 0; }

        /* ===== MAIN WORKSPACE CONTROLLER ===== */
        .workspace-scroll-container { 
            flex: 1; margin-top: 60px; margin-bottom: 32px; padding: 16px 4%; 
            display: flex; align-items: center; justify-content: center; width: 100%; overflow: hidden;
        }
        .workspace-inner { 
            width: 100%; max-width: 1240px; height: 100%; 
            display: grid; grid-template-columns: 325px 1fr; gap: 20px; align-items: stretch; 
            transition: grid-template-columns 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        }
        
        .workspace-inner.sidebar-hidden { grid-template-columns: 0px 1fr; gap: 0px; }

        /* Left Sidebar Catalog Panel */
        .documents-sidebar-list { 
            background: rgba(255,255,255,0.02); border: 1px solid var(--border-color); 
            border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; height: 100%; overflow-y: auto;
            transition: opacity 0.25s, visibility 0.25s;
        }
        .workspace-inner.sidebar-hidden .documents-sidebar-list { opacity: 0; visibility: hidden; pointer-events: none; padding: 0; }
        
        .sidebar-title { font-size: 0.95rem; font-weight: 800; text-transform: uppercase; color: #38bdf8; letter-spacing: 0.5px; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 8px; }
        
        .document-item-btn { 
            background: rgba(255,255,255,0.01); border: 1px solid var(--border-color); 
            border-radius: 8px; padding: 12px; text-align: left; cursor: pointer; color: #ffffff; 
            display: flex; align-items: center; gap: 12px; transition: all 0.15s ease; font-family: inherit; width: 100%;
        }
        .document-item-btn:hover { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2); }
        .document-item-btn.active { background: var(--brand); border-color: var(--brand); box-shadow: 0 4px 12px rgba(11,105,139,0.3); }
        
        .doc-icon-box { width: 34px; height: 34px; border-radius: 6px; background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
        .document-item-btn.active .doc-icon-box { background: rgba(255,255,255,0.15); }
        .doc-meta { display: flex; flex-direction: column; min-width: 0; flex: 1; }
        .doc-meta h4 { font-size: 0.85rem; font-weight: 700; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .doc-meta span { font-size: 0.72rem; color: #94a3b8; font-weight: 500; text-transform: uppercase; }
        .document-item-btn.active .doc-meta span { color: #e0f2fe; }

        /* Right Column Preview Frame Panel */
        .preview-viewer-chamber { 
            background: rgba(255,255,255,0.01); border: 1px solid var(--border-color); 
            border-radius: 12px; height: 100%; overflow: hidden; position: relative; display: flex; flex-direction: column;
        }
        .viewer-toolbar-header { background: rgba(0,0,0,0.2); padding: 10px 16px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        
        .btn-sidebar-toggle-trigger { background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: #ffffff; padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all 0.15s; }
        .btn-sidebar-toggle-trigger:hover { background: rgba(255,255,255,0.15); color: #38bdf8; }

        .viewer-title-wrap { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
        .viewer-toolbar-header h3 { font-size: 0.9rem; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .btn-download-fallback { background: #10b981; border: none; padding: 8px 16px; border-radius: 6px; font-size: 0.82rem; font-weight: 700; color: #fff; text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: background 0.15s; font-family: inherit; }
        .btn-download-fallback:hover { background: #059669; }
        .btn-download-fallback.disabled { background: #334155 !important; color: #94a3b8 !important; cursor: not-allowed !important; pointer-events: none; opacity: 0.5; }

        /* ── 🎯 SOLID HEIGHT MASKING VIEWPORT CHASSIS (CROPS NATIVE TOOLBARS) ── */
        .iframe-masking-viewport-chassis { 
            width: 100%; flex: 1; overflow: hidden; position: relative; background: #ffffff; 
        }
        
        /* ── 🎯 SHIFTS IFRAME BOX UPWARD BY 56PX TO EXCLUDE BLACK MENUS ON DESKTOP ── */
        .embedded-frame-iframe { 
            position: absolute; top: -56px; left: 0; width: 100%; height: calc(100% + 56px); border: none; background: #ffffff; display: block;
        }
        .embedded-frame-iframe.no-offset { top: 0px !important; height: 100% !important; position: relative !important; }
        
        .empty-placeholder-view { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; flex: 1; gap: 12px; color: #64748b; text-align: center; padding: 24px; }
        .empty-placeholder-view i { font-size: 3rem; color: rgba(255,255,255,0.05); }

        /* ── 📱 MOBILES OVERRIDES FOR OPTIMIZED COMFORT SCALING ── */
        @media (max-width: 900px) {
            html, body { height: auto; overflow-y: auto; }
            .workspace-scroll-container { margin-top: 105px; height: auto; overflow: visible; padding: 10px 4%; }
            .workspace-inner { grid-template-columns: 1fr !important; height: auto; gap: 16px; }
            .workspace-inner.sidebar-hidden { grid-template-columns: 1fr !important; gap: 16px; }
            .navbar { flex-direction: column !important; height: auto !important; padding: 10px 4% 8px !important; gap: 6px !important; }
            .navbar-links { gap: 12px 16px !important; width: 100% !important; justify-content: center !important; flex-wrap: wrap !important; }
            .navbar-links a { font-size: 0.78rem !important; padding: 6px 0 !important; }
            .navbar-links a.active::after { bottom: -2px !important; }
            .preview-viewer-chamber { height: 80vh; }
            .btn-sidebar-toggle-trigger { display: none !important; }
            
            /* ── 🎯 MOBILE FIX: REMOVES THE VERTICAL OFFSET TO ENABLE PERFECT TOUCH SCROLLING ── */
            .iframe-masking-viewport-chassis { overflow-y: auto !important; overflow-x: hidden !important; -webkit-overflow-scrolling: touch; }
            .embedded-frame-iframe { position: relative !important; top: 0px !important; height: 100% !important; width: 100% !important; }
        }
    </style>
</head>
<body>
        <header class="navbar">
        <a href="/" class="navbar-brand-wrap">
            <img src="assets/uploads/logo.png" alt="IKIZAME Logo">
            <div class="navbar-brand">IKIZAME</div>
        </a>
        <nav>
            <ul class="navbar-links">
                <li><a href="/">Ahabanza</a></li>
                <li><a href="ubufasha">Ubufasha</a></li>
                <li><a href="ifashanyigisho" class="active">Ifashanyigisho</a></li>
                <li><a href="ibiciro">Ibiciro</a></li>
                <li><a href="school-auth">Amashuri (School Portal)</a></li>
                <li><a href="amanota">Amanota</a></li>
            </ul>
        </nav>
        <div class="lang-badge">
            <svg class="rw-flag-svg" viewBox="0 0 4 3"><rect width="4" height="1.1" y="0" fill="#1EB5E5"/><rect width="4" height="0.9" y="1.1" fill="#FAD201"/><rect width="4" height="0.9" y="2" fill="#20603D"/><circle cx="3.1" cy="0.55" r="0.28" fill="#FAD201"/></svg>
            <span>Kinyarwanda</span>
        </div>
    </header>

    <div class="workspace-scroll-container">
        <main class="workspace-inner" id="masterWorkspaceSplitLayoutInnerGrid">
            
            <!-- LEFT COLUMN: AVAILABLE DOCUMENTS SIDEBAR -->
            <div class="documents-sidebar-list">
                <div class="sidebar-title">Imfashanyigisho zihari</div>
                <div id="dynamicDocumentsListContainerTarget" style="display:flex; flex-direction:column; gap:10px;">
                </div>
            </div>

            <!-- RIGHT COLUMN: INTERACTIVE DOC PREVIEWER FRAME CHAMBER -->
            <div class="preview-viewer-chamber" id="mainDocumentPreviewerContainerFrameBox">
                <div class="empty-placeholder-view" id="emptyPlaceholderStateBox">
                    <i class="fa-solid fa-file-pdf"></i>
                    <p style="font-size:0.88rem; font-weight:600;">Hitamo imfashanyigisho ku rutonde ngo uyisome hano</p>
                </div>
            </div>

        </main>
    </div>

    <footer class="footer" style="height:32px; background:#0f172a; display:flex; align-items:center; justify-content:center; font-size:10px; color:#64748b; position:fixed; bottom:0; left:0; right:0; border-top:1px solid rgba(255,255,255,0.05); z-index:10;">&copy; 2026 IKIZAME Developed by <strong>&nbsp;Dotado Stationery Store Ltd</strong></footer>

    <script>
        let globalLoadedDocumentsArray = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadActivePublicDocumentsDatabaseRows();
        });

        function loadActivePublicDocumentsDatabaseRows() {
            const listTarget = document.getElementById('dynamicDocumentsListContainerTarget');
            listTarget.innerHTML = `<div style="text-align:center; padding:20px; font-size:13px; color:var(--text-muted);"><i class="fa-solid fa-spinner fa-spin"></i> Irimo gushaka...</div>`;

            fetch('/api/public/documents')
                .then(res => res.json())
                .then(documents => {
                    listTarget.innerHTML = '';
                    if(!documents || documents.length === 0) {
                        listTarget.innerHTML = `<div style="text-align:center; padding:16px; font-size:12px; color:var(--text-muted);">Nta mfashanyigisho zanditswe ziri ku muryango.</div>`;
                        return;
                    }

                    globalLoadedDocumentsArray = documents;

                    documents.forEach((doc, idx) => {
                        const filePathStr = doc.file_path || '';
                        const fileExtension = filePathStr.split('.').pop().toLowerCase();
                        
                        let iconClass = "fa-file-pdf";
                        let iconColor = "#ef4444"; 

                        if (['doc', 'docx'].includes(fileExtension)) {
                            iconClass = "fa-file-word";
                            iconColor = "#0284c7"; 
                        }

                        listTarget.innerHTML += `
                            <button class="document-item-btn" id="docBtnItem-${doc.id}" onclick="executeAdaptiveDocumentFramePreview(${idx}, ${doc.id})">
                                <div class="doc-icon-box"><i class="fa-solid ${iconClass}" style="color: ${iconColor};"></i></div>
                                <div class="doc-meta">
                                    <h4>${doc.title}</h4>
                                    <span>${fileExtension.toUpperCase()} Imfashanyigisho</span>
                                </div>
                            </button>
                        `;
                    });
                })
                .catch(() => {
                    listTarget.innerHTML = `<div style="text-align:center; padding:16px; font-size:12px; color:#ef4444; font-weight:600;">Gushaka imfashanyigisho byanze.</div>`;
                });
        }

        window.toggleSidebarDisplayChassisGrid = function() {
            const layoutGrid = document.getElementById('masterWorkspaceSplitLayoutInnerGrid');
            const toggleBtn = document.getElementById('sidebarToggleActionButtonLabel');
            
            if(layoutGrid.classList.contains('sidebar-hidden')) {
                layoutGrid.classList.remove('sidebar-hidden');
                if(toggleBtn) toggleBtn.innerHTML = `<i class="fa-solid fa-angles-left"></i> Hisha `;
            } else {
                layoutGrid.classList.add('sidebar-hidden');
                if(toggleBtn) toggleBtn.innerHTML = `<i class="fa-solid fa-angles-right"></i> >>`;
            }
        };

        function executeAdaptiveDocumentFramePreview(arrayIndexValue, targetId) {
            const viewerChamber = document.getElementById('mainDocumentPreviewerContainerFrameBox');
            
            document.querySelectorAll('.document-item-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`docBtnItem-${targetId}`);
            if(activeBtn) activeBtn.classList.add('active');

            const doc = globalLoadedDocumentsArray[arrayIndexValue];
            if (!doc) return;

            const filePath = doc.file_path;
            const documentTitle = doc.title;
            const allowDownloadFlag = doc.allow_download;

            const fileExtensionString = filePath.split('.').pop().toLowerCase();
            const fullyQualifiedFileUrl = window.location.protocol + "//" + window.location.host + "/" + filePath + "#view=FitH&toolbar=0";
            
            let downloadActionElement = "";
            if (allowDownloadFlag === 1) {
                downloadActionElement = `<a href="/${filePath}" download class="btn-download-fallback"><i class="fa-solid fa-download"></i> Gukura Hano (Download)</a>`;
            } else {
                downloadActionElement = `<button class="btn-download-fallback disabled" disabled><i class="fa-solid fa-lock"></i> Blocked</button>`;
            }

            console.log(`[UI Engine] Processing secure file preview layer: ${fileExtensionString}`);

            let toolbarHeaderLayout = `
                <div class="viewer-toolbar-header">
                    <div class="viewer-title-wrap">
                        <button class="btn-sidebar-toggle-trigger" id="sidebarToggleActionButtonLabel" onclick="toggleSidebarDisplayChassisGrid()"><i class="fa-solid fa-angles-left"></i> Hisha </button>
                        <h3>Soma: ${documentTitle}</h3>
                    </div>
                    ${downloadActionElement}
                </div>
            `;

            if (['doc', 'docx'].includes(fileExtensionString)) {
                if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
                    viewerChamber.innerHTML = `
                        ${toolbarHeaderLayout}
                        <div class="iframe-masking-viewport-chassis">
                            <div class="empty-placeholder-view" style="color:#ffffff; padding:40px; height:100%;">
                                <i class="fa-solid fa-file-word" style="color:#0284c7; font-size:3.5rem; margin-bottom:12px;"></i>
                                <h4 style="margin-bottom:6px; font-size:1.1rem;">Urugero rwa Word Document</h4>
                                <p style="font-size:0.85rem; color:#94a3b8; max-width:400px; margin-bottom:16px;">Kubera ko ukorera kuri Localhost, Microsoft cloud viewer ntishobora gusoma iyi file. Umunyeshuri ugiye kuyisoma kuri internet yo izahita yifungura neza hano.</p>
                                <a href="/${filePath}" download class="btn-download-fallback" style="background:var(--brand);"><i class="fa-solid fa-file-arrow-down"></i> Fungura Ubu (Open File)</a>
                            </div>
                        </div>
                    `;
                } else {
                    const secureCloudViewerPath = `https://live.com{encodeURIComponent(fullyQualifiedFileUrl)}`;
                    viewerChamber.innerHTML = `
                        ${toolbarHeaderLayout}
                        <div class="iframe-masking-viewport-chassis">
                            <iframe src="${secureCloudViewerPath}" class="embedded-frame-iframe"></iframe>
                        </div>
                    `;
                }
            } else {
                viewerChamber.innerHTML = `
                    ${toolbarHeaderLayout}
                    <div class="iframe-masking-viewport-chassis">
                        <iframe src="${fullyQualifiedFileUrl}" class="embedded-frame-iframe"></iframe>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
