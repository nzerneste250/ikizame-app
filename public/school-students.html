<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="assets/uploads/logo.png">
    <title>Students | IKIZAME School Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { --brand:#0b698b; --brand-dark:#08536e; --bg:linear-gradient(135deg,#0d1b2a 0%,#111827 100%); --panel:rgba(255,255,255,0.04); --border:rgba(255,255,255,0.12); --text:#f8fafc; --muted:#94a3b8; }
        * { box-sizing:border-box; margin:0; padding:0; }
        body { font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; }
        .navbar { position:sticky; top:0; z-index:20; display:flex; justify-content:space-between; align-items:center; padding:14px 20px; background:#fff; color:#0f172a; border-bottom:1px solid #e2e8f0; }
        .navbar-brand { display:flex; align-items:center; gap:10px; font-weight:800; color:var(--brand); text-decoration:none; }
        .navbar-brand img { width:32px; height:32px; }
        .nav-links { display:flex; gap:16px; align-items:center; list-style:none; }
        .nav-links a { text-decoration:none; color:#475569; font-weight:700; font-size:0.9rem; }
        .nav-links a.active { color:var(--brand); }
        .nav-links a.logout { color:#ef4444; }
        .page { max-width:1100px; margin:0 auto; padding:24px 16px 80px; }
        .card { background:var(--panel); border:1px solid var(--border); border-radius:18px; padding:20px; box-shadow:0 16px 34px rgba(2,8,23,0.12); }
        .hero { display:flex; flex-wrap:wrap; justify-content:space-between; gap:18px; align-items:center; margin-bottom:18px; }
        .hero h1 { font-size:1.4rem; font-weight:800; margin-bottom:6px; }
        .hero p { color:var(--muted); font-size:0.95rem; }
        .form-grid { display:grid; gap:16px; grid-template-columns:1fr 1fr; margin-top:10px; }
        .field { display:flex; flex-direction:column; gap:6px; }
        .field label { font-size:0.8rem; font-weight:700; color:#cbd5e1; text-transform:uppercase; }
        .field input, .field select { width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(255,255,255,0.16); background:rgba(255,255,255,0.03); color:#fff; }
        .btn { border:none; border-radius:999px; padding:12px 16px; font-weight:800; cursor:pointer; }
        .btn-primary { background:linear-gradient(135deg,var(--brand) 0%,#0ea5e9 100%); color:#fff; }
        .table-wrap { margin-top:16px; overflow:auto; }
        table { width:100%; border-collapse:collapse; min-width:600px; }
        th, td { padding:12px 10px; border-bottom:1px solid rgba(255,255,255,0.08); text-align:left; font-size:0.9rem; }
        th { color:#94a3b8; text-transform:uppercase; font-size:0.74rem; }
        .pill { display:inline-block; padding:4px 8px; border-radius:999px; font-size:0.72rem; font-weight:700; background:rgba(16,185,129,0.15); color:#10b981; }
        .muted { color:var(--muted); }
        @media (max-width:760px){ .form-grid{grid-template-columns:1fr;} .navbar{flex-wrap:wrap; gap:8px;} }
    </style>
</head>
<body>
<header class="navbar">
    <a class="navbar-brand" href="/school-dashboard"><img src="assets/uploads/logo.png" alt="IKIZAME logo"> <span>IKIZAME</span></a>
    <ul class="nav-links">
        <li><a href="/school-dashboard">Dashboard</a></li>
        <li><a href="/school-students" class="active">Students</a></li>
        <li><a href="/school-performance">Performance</a></li>
        <li><a href="/school-profile">Profile</a></li>
        <li><a href="#" class="logout" onclick="handleSchoolLogout(event)">Logout</a></li>
    </ul>
</header>
<div class="page">
    <section class="card">
        <div class="hero">
            <div>
                <h1>Register Students & Assign Exams</h1>
                <p>Andikisha abanyeshuri bawe, ubahaye ibizamini, kandi ubike ibiciro by'ibizamini mu dashboard ya ishuri.</p>
            </div>
            <div class="muted"><i class="fa-solid fa-circle-info"></i> 1 package = 200 exams = 10,000 Frw</div>
        </div>
        <form id="studentForm" onsubmit="submitStudent(event)">
            <div class="form-grid">
                <div class="field">
                    <label>Amazina y’umunyeshuri</label>
                    <input id="studentName" required placeholder="e.g. Aline Uwase">
                </div>
                <div class="field">
                    <label>Telephone</label>
                    <input id="studentPhone" required placeholder="0788000000">
                </div>
                <div class="field">
                    <label>Ibizamini byahawe</label>
                    <input id="examCount" type="number" min="1" value="1" required>
                </div>
                <div class="field">
                    <label>&nbsp;</label>
                    <button class="btn btn-primary" type="submit"><i class="fa-solid fa-user-plus"></i> Andikisha & Tanga ibizamini</button>
                </div>
            </div>
        </form>
        <div id="formMessage" class="muted" style="margin-top:12px;"></div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>Amazina</th><th>Telephone</th><th>Ibizamini byahawe</th><th>Status</th><th>Itariki</th></tr>
                </thead>
                <tbody id="studentsTableBody"></tbody>
            </table>
        </div>
    </section>
</div>
<script>
async function handleSchoolLogout(event){ event.preventDefault(); try{ const res=await fetch('/api/school/logout',{method:'POST',headers:{'Content-Type':'application/json'}}); if(res.ok){ window.location.replace('/school-auth'); return; } }catch(err){} window.location.replace('/school-auth'); }
async function loadStudents(){
  const res=await fetch('/api/school/students');
  if(res.status===401){ window.location.replace('/school-auth'); return; }
  const data=await res.json();
  const tbody=document.getElementById('studentsTableBody');
  if(!data.success || !data.students.length){ tbody.innerHTML='<tr><td colspan="5" class="muted">Nta banyeshuri banditswe.</td></tr>'; return; }
  tbody.innerHTML=data.students.map(s=>`<tr><td>${s.student_name}</td><td>${s.phone_number}</td><td>${s.assigned_exams}</td><td><span class="pill">${s.status||'ACTIVE'}</span></td><td>${new Date(s.created_at).toLocaleDateString('fr-FR')}</td></tr>`).join('');
}
async function submitStudent(event){ event.preventDefault(); const name=document.getElementById('studentName').value.trim(); const phone=document.getElementById('studentPhone').value.trim(); const examCount=document.getElementById('examCount').value; const message=document.getElementById('formMessage');
  message.textContent='...';
  const res=await fetch('/api/school/register-student',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({studentName:name,phoneNumber:phone,examCount:parseInt(examCount,10)})});
  const data=await res.json();
  message.textContent=data.message || data.error || 'Byakunze.';
  if(data.success){ document.getElementById('studentForm').reset(); document.getElementById('examCount').value='1'; loadStudents(); }
}
document.addEventListener('DOMContentLoaded', loadStudents);
</script>
</body>
</html>
