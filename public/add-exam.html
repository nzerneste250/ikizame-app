<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Question - IKIZAME Local Panel</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        :root {
            --bg-primary: #f8fafc; --bg-secondary: #ffffff; --bg-surface: #f1f5f9;
            --text-main: #0f172a; --text-muted: #64748b; --accent-glow: #0284c7; --border-color: #cbd5e1;
            --sidebar-bg: #131a2c; --sidebar-border: #334155; --sidebar-text-muted: #94a3b8; --sidebar-text-active: #f8fafc;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); height: 100vh; overflow: hidden; }
        .admin-layout-grid { display: flex; height: calc(100vh - 45px); overflow: hidden; }
        .sidebar-panel { width: 260px; background-color: var(--sidebar-bg); border-right: 1px solid var(--sidebar-border); padding: 30px 20px; display: flex; flex-shrink: 0; flex-direction: column; gap: 35px; }
        .sidebar-panel h2 { font-size: 18px; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 10px; text-transform: uppercase; }
        .sidebar-nav { display: flex; flex-direction: column; gap: 8px; }
        .sidebar-nav a { color: var(--sidebar-text-muted); text-decoration: none; padding: 14px 16px; font-size: 14px; font-weight: 600; border-radius: 8px; display: flex; align-items: center; gap: 12px; }
        .sidebar-nav a.active { color: var(--sidebar-text-active); background-color: rgba(255,255,255,0.08); border-left: 4px solid #38bdf8; padding-left: 12px; }
        .workspace-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header-title-bar { padding: 25px 40px; border-bottom: 1px solid var(--border-color); background-color: var(--bg-secondary); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .header-title-bar h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
        .engine-mode-card { background-color: var(--bg-secondary); border: 1px dashed var(--border-color); border-radius: 8px; padding: 10px 20px; display: flex; align-items: center; gap: 15px; }
        .engine-mode-card span { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
        .toggle-switch-btn { position: relative; width: 60px; height: 30px; background-color: var(--bg-surface); border-radius: 20px; border: 2px solid var(--border-color); cursor: pointer; }
        .toggle-switch-btn::after { content: ''; position: absolute; top: 2px; left: 3px; width: 22px; height: 22px; background-color: #64748b; border-radius: 50%; transition: all 0.2s ease; }
        .toggle-switch-btn.active-img-mode { background-color: #0b698b; border-color: var(--accent-glow); }
        .toggle-switch-btn.active-img-mode::after { left: 31px; background-color: white; }
        .form-card-scroller { flex: 1; overflow-y: auto; padding: 30px 40px; }
        .main-inputs-form { background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px; padding: 35px; max-width: 900px; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .form-group-block { display: flex; flex-direction: column; gap: 8px; }
        .form-group-block label { font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }
        .main-inputs-form textarea, .main-inputs-form input[type="text"], .main-inputs-form select { width: 100%; padding: 12px 16px; border: 2px solid var(--border-color); border-radius: 8px; font-size: 14px; font-weight: 500; outline: none; }
        .main-inputs-form textarea:focus, .main-inputs-form input[type="text"]:focus, .main-inputs-form select:focus { border-color: var(--accent-glow); }
        .studio-upload-strip { background-color: #f1f5f9; border: 2px dashed #cbd5e1; border-radius: 8px; padding: 20px; display: grid; grid-template-columns: 100px 1fr; gap: 24px; align-items: center; }
        .studio-preview-box { height: 75px; background-color: #ffffff; border: 1px solid var(--border-color); border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 4px; }
        .studio-preview-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .studio-preview-box .placeholder-ico { color: #94a3b8; font-size: 22px; }
        .dynamic-options-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .option-uploader-card { background-color: #ffffff; border: 2px solid var(--border-color); border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .option-header-row { font-size: 11px; font-weight: 800; color: var(--accent-glow); text-transform: uppercase; }
        .option-thumb-preview { width: 100%; height: 65px; background-color: var(--bg-primary); border: 1px dashed var(--border-color); border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .option-thumb-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .option-thumb-preview span { font-size: 10px; color: #94a3b8; font-style: italic; }
        .execution-actions-bar { display: flex; align-items: center; gap: 20px; border-top: 1px solid var(--border-color); padding-top: 25px; }
        .btn-core-submit { background-color: #0b698b; color: #ffffff; border: none; padding: 12px 28px; font-size: 14px; font-weight: 700; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
        .btn-core-cancel { color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 600; }
        .admin-footer-panel { background-color: #131a2c; color: #64748b; text-align: center; padding: 14px; font-size: 11.5px; height: 45px; }
        .admin-footer-panel strong { color: #38bdf8; }
        .input-split-box { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: center; }
        .reuse-label { font-size: 11px; font-weight: 700; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="admin-layout-grid">
        <aside class="sidebar-panel">
            <h2><i class="fa-solid fa-graduation-cap"></i> IKIZAME</h2>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Questions Board</a>
                <a href="add-exam.html" class="active"><i class="fa-solid fa-square-plus"></i> Add New Question</a>
                <a href="/api/admin/logout"><i class="fa-solid fa-power-off"></i> Sign Out</a>
            </nav>
        </aside>

        <main class="workspace-panel">
            <header class="header-title-bar">
                <div>
                    <h1>Add New Question</h1>
                    <p>Browse a local computer image to auto-copy it, or type an existing filename to reuse an asset.</p>
                </div>
                <div class="engine-mode-card">
                    <span id="labelModeIndicator">Text Options Mode</span>
                    <div class="toggle-switch-btn" id="toggleLayoutEngineBtn"></div>
                </div>
            </header>

            <div class="form-card-scroller">
                <form action="/api/exams/add" method="POST" enctype="multipart/form-data" class="main-inputs-form">
                    <input type="hidden" id="optionsLayoutMode" name="optionsLayoutMode" value="text">

                    <div class="form-group-block">
                        <label for="question">Question Text (Statement)</label>
                        <textarea id="question" name="question" rows="3" required placeholder="Type question wording here..."></textarea>
                    </div>

                    <div class="studio-upload-strip">
                        <div class="studio-preview-box" id="mainQuestionImagePreviewPane">
                            <i class="fa-solid fa-image placeholder-ico"></i>
                        </div>
                        <div class="upload-actions-box">
                            <p>Question Sign Image:</p>
                            <div class="input-split-box">
                                <input type="file" id="imageFile" name="imageFile" accept="image/*">
                                <input type="text" id="imageFileTextFallback" name="imageFileTextFallback" placeholder="OR type existing name (e.g., stop.png)">
                            </div>
                        </div>
                    </div>

                    <div class="dynamic-options-wrapper" id="dynamicOptionsInputGridContainer"></div>

                    <div class="form-group-block" style="max-width: 320px;">
                        <label for="correctOption">Correct Option Answer Key</label>
                        <select id="correctOption" name="correctOption" required>
                            <option value="">-- Select correct answer --</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                        </select>
                    </div>

                    <div class="execution-actions-bar">
                                                <button type="submit" class="btn-core-submit"><i class="fa-solid fa-square-plus"></i> Save New Question</button>
                        <a href="dashboard.html" class="btn-core-cancel">Cancel & Go Back</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <footer class="admin-footer-panel">
        <p>Developed by <strong>izo service quicky</strong></p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('toggleLayoutEngineBtn');
            const modeIndicatorLabel = document.getElementById('labelModeIndicator');
            const layoutModeInput = document.getElementById('optionsLayoutMode');
            const dynamicGridContainer = document.getElementById('dynamicOptionsInputGridContainer');
            
            const mainImgInput = document.getElementById('imageFile');
            const mainImgText = document.getElementById('imageFileTextFallback');
            const mainImgPreview = document.getElementById('mainQuestionImagePreviewPane');

            // Live local preview for browsed file
            mainImgInput.addEventListener('change', function() {
                if (this.files && this.files[0]) {
                    const reader = new FileReader();
                    reader.onload = (e) => { mainImgPreview.innerHTML = `<img src="${e.target.result}">`; }
                    reader.readAsDataURL(this.files[0]);
                    mainImgText.value = ''; // clear text field if file is chosen
                }
            });

            // Live local preview for typed existing filename
            mainImgText.addEventListener('input', function() {
                const val = this.value.trim();
                if (val) {
                    mainImgPreview.innerHTML = `<img src="assets/uploads/${val}" onerror="this.parentElement.innerHTML='<span class=\'reuse-label\'>Asset matched</span>'">`;
                }
            });

            const textLayoutTemplateStr = `
                <div class="form-group-block">
                    <label for="optionA">Option A</label>
                    <input type="text" id="optionA" name="optionA" required placeholder="Enter option sentence A">
                </div>
                <div class="form-group-block">
                    <label for="optionB">Option B</label>
                    <input type="text" id="optionB" name="optionB" required placeholder="Enter option sentence B">
                </div>
                <div class="form-group-block">
                    <label for="optionC">Option C</label>
                    <input type="text" id="optionC" name="optionC" required placeholder="Enter option sentence C">
                </div>
                <div class="form-group-block">
                    <label for="optionD">Option D</label>
                    <input type="text" id="optionD" name="optionD" required placeholder="Enter option sentence D">
                </div>
            `;

            const imageLayoutTemplateStr = `
                <div class="option-uploader-card">
                    <div class="option-header-row">Option Image A</div>
                    <div class="option-thumb-preview" id="previewOptionImage_A"><span>Waiting...</span></div>
                    <input type="file" name="optionA_File" id="input_file_A" accept="image/*">
                    <input type="text" name="optionATextFallback" id="input_text_A" placeholder="OR type existing name" class="fallback-txt">
                </div>
                <div class="option-uploader-card">
                    <div class="option-header-row">Option Image B</div>
                    <div class="option-thumb-preview" id="previewOptionImage_B"><span>Waiting...</span></div>
                    <input type="file" name="optionB_File" id="input_file_B" accept="image/*">
                    <input type="text" name="optionBTextFallback" id="input_text_B" placeholder="OR type existing name" class="fallback-txt">
                </div>
                <div class="option-uploader-card">
                    <div class="option-header-row">Option Image C</div>
                    <div class="option-thumb-preview" id="previewOptionImage_C"><span>Waiting...</span></div>
                    <input type="file" name="optionC_File" id="input_file_C" accept="image/*">
                    <input type="text" name="optionCTextFallback" id="input_text_C" placeholder="OR type existing name" class="fallback-txt">
                </div>
                <div class="option-uploader-card">
                    <div class="option-header-row">Option Image D</div>
                    <div class="option-thumb-preview" id="previewOptionImage_D"><span>Waiting...</span></div>
                    <input type="file" name="optionD_File" id="input_file_D" accept="image/*">
                    <input type="text" name="optionDTextFallback" id="input_text_D" placeholder="OR type existing name" class="fallback-txt">
                </div>
            `;

            dynamicGridContainer.innerHTML = textLayoutTemplateStr;

            toggleBtn.addEventListener('click', () => {
                if (layoutModeInput.value === 'text') {
                    layoutModeInput.value = 'image';
                    toggleBtn.classList.add('active-img-mode');
                    modeIndicatorLabel.innerText = "Four Image Options Mode";
                    dynamicGridContainer.innerHTML = imageLayoutTemplateStr;
                    registerLiveThumbEventListeners(); 
                } else {
                    layoutModeInput.value = 'text';
                    toggleBtn.classList.remove('active-img-mode');
                    modeIndicatorLabel.innerText = "Text Options Mode";
                    dynamicGridContainer.innerHTML = textLayoutTemplateStr;
                }
            });

            function registerLiveThumbEventListeners() {
                const targetKeys = ["A", "B", "C", "D"];
                targetKeys.forEach(key => {
                    const fileIn = document.getElementById(`input_file_${key}`);
                    const textIn = document.getElementById(`input_text_${key}`);
                    const preview = document.getElementById(`previewOptionImage_${key}`);

                    fileIn.addEventListener('change', function() {
                        if (this.files && this.files[0]) {
                            const reader = new FileReader();
                            reader.onload = (e) => { preview.innerHTML = `<img src="${e.target.result}">`; }
                            reader.readAsDataURL(this.files[0]);
                            textIn.value = '';
                        }
                    });

                    textIn.addEventListener('input', function() {
                        const val = this.value.trim();
                        if (val) {
                            preview.innerHTML = `<img src="assets/uploads/${val}" onerror="this.parentElement.innerHTML='<span>Asset matched</span>'">`;
                        }
                    });
                });
            }
        });
    </script>
</body>
</html>
