<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Injiza Ikizame Gishya - IKIZAME Admin</title>
    <!-- Link to the clean admin layout stylesheet -->
    <link rel="stylesheet" href="assets/css/admin.css">
    <!-- Font Awesome icons support library -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* 🎨 Custom User-Friendly Form Styles */
        .form-wrapper {
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 35px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02);
            max-width: 850px;
            margin-top: 10px;
        }

        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-wrapper textarea,
        .form-wrapper input[type="text"],
        .form-wrapper select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            color: #1e293b;
            background-color: #ffffff;
            transition: border-color 0.2s ease;
        }

        .form-wrapper textarea:focus,
        .form-wrapper input[type="text"]:focus,
        .form-wrapper select:focus {
            border-color: #0b698b;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 24px;
        }

        /* 📷 Premium Interactive Image Upload Layout Card */
        .image-upload-card {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 20px;
            align-items: center;
        }

        .preview-pane-box {
            border: 2px dashed #cbd5e1;
            border-radius: 8px;
            padding: 4px;
            background-color: #ffffff;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .preview-pane-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .preview-pane-box .no-img-text {
            font-size: 12px;
            color: #94a3b8;
            font-style: italic;
            text-align: center;
        }

        .upload-action-side p {
            font-size: 13px;
            font-weight: 600;
            color: #475569;
            margin-bottom: 8px;
        }

        .custom-file-input {
            font-size: 13px;
            color: #64748b;
        }

        /* Execution Buttons Bar Styling */
        .form-actions {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-top: 15px;
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
        }

        .save-btn {
            background-color: #0b698b;
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s ease;
        }

        .save-btn:hover { background-color: #08536e; }

        .cancel-btn {
            color: #64748b;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .cancel-btn:hover { color: #0f172a; }

        @media screen and (max-width: 768px) {
            .options-grid { grid-template-columns: 1fr; gap: 0; }
            .image-upload-card { grid-template-columns: 1fr; text-align: center; }
            .preview-pane-box { width: 120px; margin: 0 auto; }
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <!-- Sidebar Navigation Menu Left Panel Workstation -->
        <aside class="sidebar">
            <h2>IKIZAME Admin</h2>
            <nav>
                <a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
                <a href="add-exam.html" class="active"><i class="fa-solid fa-plus"></i> Injiza Ikizame</a>
                <a href="/api/admin/logout"><i class="fa-solid fa-arrow-right-from-bracket"></i> Soka hano</a>
            </nav>
        </aside>

        <!-- Right Side Core Administrative Input Form Panel -->
        <main class="main-content">
            <header class="content-header">
                <h1>Injiza Ikizame Gishya</h1>
                <p>Andika ikibazo gishya hano ubanze ugenzure amahitamo mbere yo kubika mu bubiko bwa database.</p>
            </header>

            <section class="form-wrapper">
                <!-- Points directly to your secure Node server upload pipeline route -->
                <form action="/api/exams/add" method="POST" enctype="multipart/form-data">
                    
                    <div class="form-group">
                        <label for="question">Ikibazo cy'Ikizamini (Question Text)</label>
                        <textarea id="question" name="question" rows="3" required placeholder="Andika imiterere y'ikibazo hano..."></textarea>
                    </div>

                    <!-- 🎥 INTERACTIVE TRAFFIC SIGN IMAGE UPLOAD CARD -->
                    <div class="image-upload-card">
                        <!-- Left pane: Displays live real-time image selection choices -->
                        <div class="preview-pane-box" id="imageLivePreviewPane">
                            <span class="no-img-text"><i class="fa-solid fa-image fa-lg"></i><br>No file chosen</span>
                        </div>
                        
                        <!-- Right pane: File selector interaction triggers -->
                        <div class="upload-action-side">
                            <p>Hitamo Ifoto y'Ikibazo / Ikimenyetso (Niba ihari):</p>
                            <input type="file" id="imageFile" name="imageFile" class="custom-file-input" accept="image/*">
                        </div>
                    </div>

                    <div class="options-grid">
                        <div class="form-group">
                            <label for="optionA">Ihitamo A (Option A)</label>
                            <input type="text" id="optionA" name="optionA" required placeholder="Andika ihitamo rya A">
                        </div>
                        <div class="form-group">
                            <label for="optionB">Ihitamo B (Option B)</label>
                            <input type="text" id="optionB" name="optionB" required placeholder="Andika ihitamo rya B">
                        </div>
                        <div class="form-group">
                            <label for="optionC">Ihitamo C (Option C)</label>
                            <input type="text" id="optionC" name="optionC" required placeholder="Andika ihitamo rya C">
                        </div>
                        <div class="form-group">
                            <label for="optionD">Ihitamo D (Option D)</label>
                            <input type="text" id="optionD" name="optionD" required placeholder="Andika ihitamo rya D">
                        </div>
                    </div>

                    <div class="form-group" style="max-width: 320px;">
                        <label for="correctOption">Igisubizo Cy'ukuri (Correct Option Key)</label>
                        <select id="correctOption" name="correctOption" required>
                            <option value="">-- Hitamo inyandiko y'ukuri --</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                        </select>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="save-btn"><i class="fa-solid fa-floppy-disk"></i> Bika Ikibazo</button>
                        <a href="dashboard.html" class="cancel-btn">Anula / Subira Inyuma</a>
                    </div>
                </form>
            </section>
        </main>
    </div>

    <footer class="admin-footer">
        <p>Developed by <strong>izo service quicky</strong></p>
    </footer>

    <!-- Interactive Client Script Engine -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const previewPane = document.getElementById('imageLivePreviewPane');
            const fileInput = document.getElementById('imageFile');

            // ⚡ HIGH-TECH LIVE PREVIEW MECHANIC: Reads file choice and renders preview instantly on screen
            fileInput.addEventListener('change', function() {
                const chosenFile = this.files[0];
                if (chosenFile) {
                    const readerInstance = new FileReader();
                    readerInstance.onload = function(e) {
                        // Injects image element directly with stylish accent borders
                        previewPane.innerHTML = `<img src="${e.target.result}" alt="New Selection Preview" style="border: 2px solid #0b698b;">`;
                    };
                                        readerInstance.readAsDataURL(chosenFile);
                } else {
                    previewPane.innerHTML = `<span class="no-img-text"><i class="fa-solid fa-image fa-lg"></i><br>No file chosen</span>`;
                }
            });
        });
    </script>
</body>
</html>
