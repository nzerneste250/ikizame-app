<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Injiza Ikibazo - IKIZAME Professional Admin</title>
    <!-- Premium Font Hierarchies -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* 🪐 PREMIUM ADMIN DESIGN SYSTEM VARIABLE BALANCES */
        :root {
            --bg-primary: #f8fafc;        /* Soft off-white backdrop */
            --bg-secondary: #ffffff;      /* Crisp pure white for the main form card */
            --bg-surface: #f1f5f9;        /* Light grey for interior utility elements */
            --text-main: #0f172a;         /* Deep charcoal text for perfect readability */
            --text-muted: #64748b;        /* Professional medium grey for descriptions */
            --accent-glow: #0284c7;       /* Deep premium sky blue for active elements */
            --accent-save: #10b981;       /* Standard emerald green for successful saves */
            --border-color: #cbd5e1;      /* Light border lines for sections separators */
            --input-focus: #0b698b;       /* Dark teal accents for form control button paths */
            
            /* Keep separate tokens for the dark sidebar navigation box panel layout */
            --sidebar-bg: #131a2c;
            --sidebar-border: #334155;
            --sidebar-text-muted: #94a3b8;
            --sidebar-text-active: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        html, body { height: 100vh; background-color: var(--bg-primary); color: var(--text-main); overflow: hidden; }

        .admin-layout-grid { display: flex; height: calc(100vh - 45px); overflow: hidden; }

        /* 🔒 1. FIXED GLASS-EFFECT SIDEBAR PANEL */
        .sidebar-panel {
            width: 260px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--sidebar-border);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 35px;
            flex-shrink: 0;
        }

        .sidebar-panel h2 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--accent-glow);
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-nav { display: flex; flex-direction: column; gap: 8px; }
        .sidebar-nav a {
            color: var(--sidebar-text-muted);
            text-decoration: none;
            padding: 14px 16px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s ease;
        }
        .sidebar-nav a:hover, .sidebar-nav a.active {
            color: var(--sidebar-text-active);
            background-color: var(--bg-surface);
        }
        .sidebar-nav a.active { border-left: 4px solid var(--accent-glow); padding-left: 12px; }

        /* 🔒 2. SCROLLABLE PRO-WORKSPACE WRAPPER PANEL */
        .workspace-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        .header-title-bar {
            padding: 25px 40px;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(180deg, #ffffff 0%, var(--bg-primary) 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-title-bar h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 4px; color: var(--text-main); }
        .header-title-bar p { font-size: 13px; color: var(--text-muted); }

        /* 🎛️ DYNAMIC SWITCHER MODE CONTROLLER CARD */
        .engine-mode-card {
            background-color: var(--bg-secondary);
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .engine-mode-card span { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }
        
        .toggle-switch-btn {
            position: relative; width: 60px; height: 30px; background-color: var(--bg-surface);
            border-radius: 20px; border: 2px solid var(--border-color); cursor: pointer; transition: background 0.2s ease;
        }
        .toggle-switch-btn::after {
            content: ''; position: absolute; top: 2px; left: 3px; width: 22px; height: 22px;
            background-color: #64748b; border-radius: 50%; transition: all 0.2s ease;
        }
        .toggle-switch-btn.active-img-mode { background-color: var(--input-focus); border-color: var(--accent-glow); }
        .toggle-switch-btn.active-img-mode::after { left: 31px; background-color: var(--sidebar-text-active); }

        /* Scroll Box Card Frame */
        .form-card-scroller { flex: 1; overflow-y: auto; padding: 30px 40px; min-height: 0; }
        
        .main-inputs-form {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 35px;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .form-group-block { display: flex; flex-direction: column; gap: 8px; }
        .form-group-block label { font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        .main-inputs-form textarea,
        .main-inputs-form input[type="text"],
        .main-inputs-form select {
            width: 100%; padding: 12px 16px; background-color: #ffffff;
            border: 2px solid var(--border-color); border-radius: 8px; font-size: 14px; font-weight: 500;
            color: var(--text-main); outline: none; transition: border-color 0.15s ease;
        }
        .main-inputs-form textarea:focus,
        .main-inputs-form input[type="text"]:focus,
        .main-inputs-form select:focus {
            border-color: var(--accent-glow);
        }

        /* 📸 QUESTION SIGN PREVIEW LOGIC STRIP CARD */
        .studio-upload-strip {
            background-color: #f1f5f9; border: 2px dashed #cbd5e1; border-radius: 8px;
            padding: 20px; display: grid; grid-template-columns: 100px 1fr; gap: 24px; align-items: center;
        }
        .studio-preview-box {
            height: 75px; background-color: #ffffff; border: 1px solid var(--border-color);
            border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 4px;
        }
        .studio-preview-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .studio-preview-box .placeholder-ico { color: #94a3b8; font-size: 22px; }
        .upload-actions-box p { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-main); }
        .file-input-ghost { font-size: 12px; color: var(--text-muted); }

        /* 🎯 OPTIONS GRID SEPARATORS CONTAINERS */
        .dynamic-options-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .option-uploader-card {
            background-color: #ffffff; border: 2px solid var(--border-color);
            border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 10px;
        }
        .option-header-row { font-size: 11px; font-weight: 800; color: var(--accent-glow); text-transform: uppercase; }
        
        .option-thumb-preview {
            width: 100%; height: 85px; background-color: var(--bg-primary); border: 1px dashed var(--border-color);
            border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 4px;
        }
        .option-thumb-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .option-thumb-preview span { font-size: 11px; color: #94a3b8; font-style: italic; }

        /* Action Buttons Row Panel Layout */
        .execution-actions-bar {
            display: flex; align-items: center; gap: 20px; border-top: 1px solid var(--border-color);
            padding-top: 25px; margin-top: 5px;
        }
        .btn-core-submit {
            background-color: #0b698b; color: #ffffff; border: none; padding: 12px 28px;
            font-size: 14px; font-weight: 700; border-radius: 6px; cursor: pointer; display: inline-flex;
            align-items: center; gap: 8px; transition: background 0.15s ease;
        }
        .btn-core-submit:hover { background-color: #08536e; }
        .btn-core-cancel { color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 600; }
        .btn-core-cancel:hover { color: var(--text-main); }

        /* Footers Baseline Branding Frame */
        .admin-footer-panel {
            background-color: #131a2c; color: #64748b; text-align: center;
            padding: 14px; font-size: 11.5px; border-top: 1px solid #334155; height: 45px; z-index: 100;
        }
        .admin-footer-panel strong { color: #38bdf8; }

        @media screen and (max-width: 992px) {
            .dynamic-options-wrapper { grid-template-columns: 1fr; gap: 15px; }
            .sidebar-panel { display: none; }
            .form-card-scroller { padding: 20px; }
            .main-inputs-form { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="admin-layout-grid">
        <!-- Sidebar Navigation Menu Left Workspace -->
        <aside class="sidebar-panel">
            <h2><i class="fa-solid fa-graduation-cap"></i> IKIZAME</h2>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
                <a href="add-exam.html" class="active"><i class="fa-solid fa-square-plus"></i> Injiza Ikizame</a>
                <a href="/api/admin/logout"><i class="fa-solid fa-power-off"></i> Soka Hano</a>
            </nav>
        </aside>

        <!-- Main Workspace Panel Wrapper Container Frame -->
        <main class="workspace-panel">
            <header class="header-title-bar">
                <div>
                    <h1>Injiza Ikibazo Gishya</h1>
                    <p>Sanura imiterere y'ikibazo ukoresheje amahitamo agezweho ya Text cyangwa Amafoto.</p>
                </div>
                <!-- 🎛️ TEXT MODE VS 4 IMAGES INTERACTIVE ENGINE SWITCH TOGGLE BOX -->
                <div class="engine-mode-card">
                    <span id="labelModeIndicator">Text Options Mode</span>
                    <div class="toggle-switch-btn" id="toggleLayoutEngineBtn" title="Hindura imiterere y'amahitamo"></div>
                </div>
            </header>

            <div class="form-card-scroller">
                <form action="/api/exams/add" method="POST" enctype="multipart/form-data" class="main-inputs-form">
                    
                    <!-- Hidden reference state token reading form selection mapping -->
                    <input type="hidden" id="optionsLayoutMode" name="optionsLayoutMode" value="text">

                    <div class="form-group-block">
                        <label for="question">Ikibazo cy'Ikizamini (Question Wording)</label>
                        <textarea id="question" name="question" rows="3" required placeholder="Andika imiterere y'ikibazo hano..."></textarea>
                    </div>

                    <!-- 📸 CORE TRAFFIC SIGN ICON ROW PREVIEW STRIP CARD -->
                    <div class="studio-upload-strip">
                        <div class="studio-preview-box" id="mainQuestionImagePreviewPane">
                            <i class="fa-solid fa-image placeholder-ico"></i>
                        </div>
                        <div class="upload-actions-box">
                            <p>Ifoto y'Ikibazo / Ikimenyetso (Niba ihari):</p>
                            <input type="file" id="imageFile" name="imageFile" class="file-input-ghost" accept="image/*">
                        </div>
                    </div>

                    <!-- 🎯 INTERACTIVE CONTENT CONTAINER TARGET: Text fields or image upload elements inject here dynamically -->
                    <div class="dynamic-options-wrapper" id="dynamicOptionsInputGridContainer"></div>

                    <div class="form-group-block" style="max-width: 320px;">
                        <label for="correctOption">Igisubizo Cy'ukuri (Correct Option Answer Key)</label>
                        <select id="correctOption" name="correctOption" required>
                            <option value="">-- Hitamo inyandiko y'ukuri --</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                        </select>
                    </div>

                    <div class="execution-actions-bar">
                        <button type="submit" class="btn-core-submit"><i class="fa-solid fa-cloud-arrow-up"></i> Bika Ikibazo Gishya</button>
                        <a href="dashboard.html" class="btn-core-cancel">Anula / Subira Inyuma</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <footer class="admin-footer-panel">
        <p>Developed by <strong>izo service quicky</strong></p>
    </footer>

    <!-- Client Runtime Controller Execution Script Engine Block -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('toggleLayoutEngineBtn');
            const modeIndicatorLabel = document.getElementById('labelModeIndicator');
            const layoutModeInput = document.getElementById('optionsLayoutMode');
            const dynamicGridContainer = document.getElementById('dynamicOptionsInputGridContainer');
            
            const mainImgInput = document.getElementById('imageFile');
            const mainImgPreview = document.getElementById('mainQuestionImagePreviewPane');

            // ⚡ 1. REAL-TIME FILE READER PREVIEW FOR CORE TRAFFIC SIGN SYMBOL IMAGE
            mainImgInput.addEventListener('change', function() {
                const targetFile = this.files[0];
                if (targetFile) {
                    const readerInstance = new FileReader();
                    readerInstance.onload = function(e) {
                        mainImgPreview.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                    }
                    readerInstance.readAsDataURL(targetFile);
                } else {
                    mainImgPreview.innerHTML = `<i class="fa-solid fa-image placeholder-ico"></i>`;
                }
            });

            // 🪐 Structural string template maps for traditional textual fields choice inputs mapping
            const textLayoutTemplateStr = `
                <div class="form-group-block">
                    <label for="optionA">Ihitamo A (Option A)</label>
                    <input type="text" id="optionA" name="optionA" required placeholder="Andika ihitamo rya A">
                </div>
                <div class="form-group-block">
                    <label for="optionB">Ihitamo B (Option B)</label>
                    <input type="text" id="optionB" name="optionB" required placeholder="Andika ihitamo rya B">
                </div>
                <div class="form-group-block">
                    <label for="optionC">Ihitamo C (Option C)</label>
                    <input type="text" id="optionC" name="optionC" required placeholder="Andika ihitamo rya C">
                </div>
                <div class="form-group-block">
                    <label for="optionD">Ihitamo D (Option D)</label>
                    <input type="text" id="optionD" name="optionD" required placeholder="Andika ihitamo rya D">
                </div>
            `;

            // 🪐 🎯 FIX: Matches input "name" elements explicitly with server.js multer attributes (optionA_File, optionB_File, etc.)
            const imageLayoutTemplateStr = `
                <div class="option-uploader-card">
                    <div class="option-header-row">Option Image A</div>
                    <div class="option-thumb-preview" id="previewOptionImage_A"><span>No image chosen</span></div>
                    <input type="file" name="optionA_File" id="input_file_A" accept="image/*" required class="file-input-ghost">
                </div>
                <div class="option-uploader-card">
                    <div class="option-header-row">Option Image B</div>
                    <div class="option-thumb-preview" id="previewOptionImage_B"><span>No image chosen</span></div>
                    <input type="file" name="optionB_File" id="input_file_B" accept="image/*" required class="file-input-ghost">
                </div>
                <div class="option-uploader-card">
                    <div class="option-header-row">Option Image C</div>
                    <div class="option-thumb-preview" id="previewOptionImage_C"><span>No image chosen</span></div>
                    <input type="file" name="optionC_File" id="input_file_C" accept="image/*" required class="file-input-ghost">
                </div>
                <div class="option-uploader-card">
                    <div class="option-header-row">Option Image D</div>
                    <div class="option-thumb-preview" id="previewOptionImage_D"><span>No image chosen</span></div>
                    <input type="file" name="optionD_File" id="input_file_D" accept="image/*" required class="file-input-ghost">
                </div>
            `;

            // Initialize display to handle default text input layout parameters setup
            dynamicGridContainer.innerHTML = textLayoutTemplateStr;

            // ⚡ 2. DYNAMIC LAYOUT ENGINE CONTROLLER SWITCH ROUTINE
            toggleBtn.addEventListener('click', () => {
                if (layoutModeInput.value === 'text') {
                    layoutModeInput.value = 'image';
                    toggleBtn.classList.add('active-img-mode');
                    modeIndicatorLabel.innerText = "Four Image Options Mode";
                    dynamicGridContainer.innerHTML = imageLayoutTemplateStr;
                    registerLiveThumbEventListeners(); // Bind active file reader listeners to new image fields
                } else {
                    layoutModeInput.value = 'text';
                    toggleBtn.classList.remove('active-img-mode');
                    modeIndicatorLabel.innerText = "Text Options Mode";
                    dynamicGridContainer.innerHTML = textLayoutTemplateStr;
                }
            });

            // ⚡ 3. ASYNCHRONOUS TARGET HOOKS LOGIC PACKS: Handles live thumbnails for the 4 option images
            function registerLiveThumbEventListeners() {
                const targetKeys = ["A", "B", "C", "D"];
                targetKeys.forEach(key => {
                    const inputElement = document.getElementById(`input_file_${key}`);
                    const previewElement = document.getElementById(`previewOptionImage_${key}`);

                    if (inputElement && previewElement) {
                        inputElement.addEventListener('change', function() {
                                                        const file = this.files[0];
                            if (file) {
                                const readerInstance = new FileReader();
                                readerInstance.onload = function(e) {
                                    // 🎯 FIXED: Wrapped template string with proper backticks
                                    previewElement.innerHTML = `<img src="${e.target.result}" alt="Option ${key}">`;
                                }
                                readerInstance.readAsDataURL(file);
                            } else {
                                previewElement.innerHTML = `<span>No image chosen</span>`;
                            }
                        });
                    }
                });
            }
        });
    </script>
</body>
</html>
