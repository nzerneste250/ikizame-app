<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="assets/uploads/logo.png">
    <title>Ibyavuye | IKIZAME - Ibisubizo by'Ikizamini</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/design-system.css">
    <style>
        :root {
            --brand: #0b698b;
            --brand-dark: #084f6a;
            --pass: #10b981;
            --fail: #ef4444;
            --warn: #f59e0b;
            --bg: #f4f7fa;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            padding-bottom: 60px;
        }

        /* ── TOP BANNER ── */
        .top-banner {
            width: 100%;
            background: linear-gradient(135deg, #0b698b 0%, #084f6a 60%, #052d40 100%);
            padding: 0 24px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            border-bottom: 3px solid rgba(255,255,255,0.13);
        }
        .banner-logo {
            display: flex; align-items: center; gap: 10px; text-decoration: none;
        }
        .banner-logo img {
            width: 38px; height: 38px; border-radius: 9px; object-fit: contain;
            background: rgba(255,255,255,0.12);
        }
        .banner-logo-text {
            font-size: 1.1rem; font-weight: 900; color: #fff; letter-spacing: -0.5px;
        }
        .banner-logo-sub {
            font-size: 0.58rem; font-weight: 600; color: rgba(255,255,255,0.55);
            text-transform: uppercase; letter-spacing: 0.8px;
        }
        .banner-title {
            font-size: 1rem; font-weight: 800; color: #fff;
            text-transform: uppercase; letter-spacing: 1.5px;
            position: absolute; left: 50%; transform: translateX(-50%);
            white-space: nowrap;
        }
        .banner-spacer { width: 160px; }
        @media (max-width: 640px) {
            .top-banner { height: auto; flex-direction: column; align-items: flex-start; padding: 10px 16px; gap: 4px; }
            .banner-title { position: static; transform: none; font-size: 0.72rem; letter-spacing: 0.5px; align-self: center; white-space: normal; text-align: center; }
            .banner-spacer { display: none; }
            .banner-logo img { width: 28px; height: 28px; }
            .banner-logo-text { font-size: 0.95rem; }
        }

        /* ── MAIN WRAPPER ── */
        .page-wrap {
            max-width: 100%;
            margin: 0;
            padding: 0 24px;
        }

        /* ── INFO CARD ── */
        .info-card {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.09);
            margin-top: 20px;
            overflow: hidden;
            width: 100%;
        }

        /* Score hero, full-width one-line bar */
        .score-hero {
            display: flex;
            align-items: stretch;
            border-bottom: 1px solid #f1f5f9;
        }

        /* Highlighted score block */
        .score-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 10px 28px;
            border-right: 1px solid #f1f5f9;
            min-width: 130px;
            flex-shrink: 0;
        }
        .score-block.pass-bg { background: #f0fdf4; }
        .score-block.fail-bg { background: #fff5f5; }

        .score-fraction { display: flex; align-items: baseline; gap: 3px; }
        .score-value { font-size: 3rem; font-weight: 900; letter-spacing: -3px; line-height: 1; }
        .score-value.pass { color: var(--pass); }
        .score-value.fail { color: var(--fail); }
        .score-denom { font-size: 1.6rem; font-weight: 700; color: #94a3b8; }
        .score-label { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; color: #94a3b8; }

        /* Status + progress */
        .score-meta {
            flex: 1;
            padding: 8px 22px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            justify-content: center;
        }
        .status-pill {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 0.8rem; font-weight: 800; padding: 5px 15px;
            border-radius: 50px; text-transform: uppercase; letter-spacing: 0.5px;
            align-self: flex-start;
        }
        .status-pill.pass { background: #dcfce7; color: #166534; }
        .status-pill.fail { background: #fee2e2; color: #991b1b; }

        .progress-label { display: flex; justify-content: space-between; font-size: 0.67rem; font-weight: 700; color: #94a3b8; margin-bottom: 5px; }
        .progress-bar { height: 8px; background: #f1f5f9; border-radius: 99px; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 99px; transition: width 1.3s cubic-bezier(.4,0,.2,1); }
        .progress-fill.pass { background: linear-gradient(90deg, #34d399, #10b981); }
        .progress-fill.fail { background: linear-gradient(90deg, #f87171, #ef4444); }

        /* Student info grid, single row on desktop */
        .student-info {
            display: flex;
            flex-wrap: nowrap;
            gap: 0;
            border-bottom: 1px solid #f1f5f9;
            overflow-x: auto;
        }
        .info-row {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 18px;
            border-right: 1px solid #f1f5f9;
            flex: 1;
            min-width: 0;
        }
        .info-row:last-child { border-right: none; }
        .info-icon {
            width: 34px; height: 34px; border-radius: 9px;
            background: #e0f2fe; color: var(--brand);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem; flex-shrink: 0;
        }
        .info-icon.score-icon  { background: #fef9c3; color: #b45309; }
        .info-icon.phone-icon  { background: #dcfce7; color: #166534; }
        .info-icon.time-icon   { background: #ede9fe; color: #6d28d9; }
        .info-label { font-size: 0.65rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.4px; }
        .info-value { font-size: 1.25rem; font-weight: 800; color: #0f172a; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Stats row */
        .stats-row {
            display: grid; grid-template-columns: repeat(3, 1fr);
            border-bottom: 1px solid #f1f5f9;
        }
        .stat-cell {
            text-align: center; padding: 8px 8px;
            border-right: 1px solid #f1f5f9;
        }
        .stat-cell:last-child { border-right: none; }
        .stat-num { font-size: 1.7rem; font-weight: 900; line-height: 1; }
        .stat-lbl { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; margin-top: 3px; letter-spacing: 0.3px; }
        .stat-cell.s-correct .stat-num { color: var(--pass); }
        .stat-cell.s-correct .stat-lbl { color: #166534; }
        .stat-cell.s-wrong   .stat-num { color: var(--fail); }
        .stat-cell.s-wrong   .stat-lbl { color: #991b1b; }
        .stat-cell.s-skip    .stat-num { color: var(--warn); }
        .stat-cell.s-skip    .stat-lbl { color: #92400e; }

        /* Card footer */
        .card-footer {
            padding: 10px 20px;
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            flex-wrap: wrap;
        }
        .logo-wrap {
            display: flex; align-items: center; gap: 10px;
        }
        .logo-wrap img {
            width: 36px; height: 36px; border-radius: 8px; object-fit: contain;
        }
        .logo-wrap .logo-text {
            font-size: 1rem; font-weight: 900; color: var(--brand); letter-spacing: -0.5px;
        }
        .logo-wrap .logo-sub {
            font-size: 0.6rem; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .btn-home {
            background: linear-gradient(135deg, var(--brand), var(--brand-dark));
            color: #fff; border: none; padding: 10px 22px;
            font-size: 0.84rem; font-weight: 700; border-radius: 10px;
            cursor: pointer; text-decoration: none;
            display: inline-flex; align-items: center; gap: 7px;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 4px 14px rgba(11,105,139,0.3);
        }
        .btn-home:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(11,105,139,0.4); }

        /* ── QUESTIONS WRAP ── */
        .questions-wrap {
            max-width: 75%;
            margin: 0 auto;
        }

        /* ── SECTION DIVIDER ── */
        .section-divider {
            display: flex; align-items: center; gap: 12px;
            padding: 28px 0 14px;
        }
        .section-divider .line { flex: 1; height: 1.5px; background: #e2e8f0; }
        .section-divider span {
            font-size: 0.72rem; font-weight: 800; color: #64748b;
            text-transform: uppercase; letter-spacing: 1px; white-space: nowrap;
        }

        /* ── QUESTION CARDS ── */
        .question-card {
            background: #fff;
            border-radius: 16px;
            margin-bottom: 12px;
            border: 1.5px solid #e2e8f0;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            animation: fadeUp 0.3s ease both;
        }
        .question-card.correct-card { border-color: #a7f3d0; }
        .question-card.wrong-card   { border-color: #fecaca; }
        .question-card.skipped-card { border-color: #fde68a; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Question header bar */
        .q-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 16px;
            border-bottom: 1px solid #f1f5f9;
        }
        .correct-card .q-bar { background: #f0fdf4; border-bottom-color: #d1fae5; }
        .wrong-card   .q-bar { background: #fff5f5; border-bottom-color: #fee2e2; }
        .skipped-card .q-bar { background: #fffbeb; border-bottom-color: #fef3c7; }

        .q-num {
            font-size: 0.82rem; font-weight: 800; color: var(--brand);
            display: flex; align-items: center; gap: 6px;
        }
        .q-num .num-circle {
            width: 26px; height: 26px; border-radius: 50%;
            background: var(--brand); color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.72rem; font-weight: 900;
        }
        .correct-card .q-num .num-circle { background: var(--pass); }
        .wrong-card   .q-num .num-circle { background: var(--fail); }
        .skipped-card .q-num .num-circle { background: var(--warn); }

        .q-badge {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: 0.68rem; font-weight: 800; padding: 3px 10px;
            border-radius: 50px; text-transform: uppercase;
        }
        .q-badge.correct { background: #dcfce7; color: #166534; }
        .q-badge.wrong   { background: #fee2e2; color: #991b1b; }
        .q-badge.skipped { background: #fef3c7; color: #92400e; }

        /* Question body */
        .q-body { padding: 14px 16px 6px; }

        .q-text {
            font-size: 1.08rem;
            font-weight: 700;
            line-height: 1.55;
            color: #0f172a;
            margin-bottom: 10px;
        }

        .q-image {
            display: block;
            max-width: 100%; max-height: 200px;
            object-fit: contain;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
            margin-bottom: 12px;
            background: #f8fafc;
        }

        /* Options list */
        .options-list { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 7px; }
        .options-list.img-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .options-list.img-grid .option-row { flex-direction: column; align-items: flex-start; padding: 8px; gap: 6px; }
        .options-list.img-grid .option-row img { width: 100%; max-height: 160px; object-fit: contain; border-radius: 8px; margin: 0; border: none; background: transparent; }
        @media (max-width: 640px) {
            .options-list.img-grid { grid-template-columns: 1fr 1fr; }
            .options-list.img-grid .option-row img { max-height: 110px; }
        }

        .option-row {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 13px;
            border: 1.5px solid #e2e8f0;
            border-radius: 10px;
            font-size: 0.92rem; font-weight: 600;
            color: #334155; background: #f8fafc;
            transition: background 0.12s;
        }
        .option-row.user-wrong    { border-color: #fca5a5; background: #fff5f5; color: #991b1b; }
        .option-row.correct-target{ border-color: #6ee7b7 !important; background: #f0fdf4 !important; color: #166534 !important; font-weight: 700; }
        .option-row.user-correct  { border-color: #6ee7b7; background: #f0fdf4; color: #166534; font-weight: 700; }

        .opt-letter {
            width: 28px; height: 28px; border-radius: 8px;
            background: #e2e8f0;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.72rem; font-weight: 900; color: #475569; flex-shrink: 0;
        }
        .option-row.user-wrong .opt-letter    { background: #fee2e2; color: #991b1b; }
        .option-row.correct-target .opt-letter,
        .option-row.user-correct .opt-letter  { background: #dcfce7; color: #166534; }

        .opt-icon { margin-left: auto; font-size: 0.8rem; flex-shrink: 0; }

        /* ── BACK TO TOP BUTTON ── */
        #backToTopBtn {
            position: fixed;
            bottom: 30px;
            right: 25px;
            background: linear-gradient(135deg, var(--brand), var(--brand-dark));
            color: #fff;
            border: none;
            padding: 11px 18px;
            border-radius: 50px;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            display: none;
            align-items: center;
            gap: 7px;
            box-shadow: 0 6px 20px rgba(11,105,139,0.4);
            z-index: 9999;
            transition: opacity 0.3s, transform 0.3s;
        }
        #backToTopBtn.visible { display: flex; }
        #backToTopBtn:hover { transform: translateY(-2px); }
        @media (max-width: 640px) {
            .page-wrap { padding: 0 12px; }
            .questions-wrap { max-width: 100%; }
            .score-block { padding: 14px 18px; min-width: 90px; }
            .score-value { font-size: 2.2rem; }
            .student-info { flex-wrap: wrap; }
            .info-row { flex: 0 0 50%; border-right: none; border-bottom: 1px solid #f1f5f9; }
            .info-row:nth-child(odd) { border-right: 1px solid #f1f5f9; }
            .info-row:last-child { border-bottom: none; }
            .info-value { font-size: 0.78rem; white-space: normal; word-break: break-word; }
            .info-label { font-size: 0.58rem; }
            .info-icon { width: 28px; height: 28px; font-size: 0.75rem; }
            .card-footer { justify-content: center; }
            .q-text { font-size: 0.97rem; }
            .option-row { font-size: 0.85rem; }
        }
    </style>
</head>
<body>

    <!-- TOP BANNER -->
    <div class="top-banner">
        <a href="/" class="banner-logo">
            <img src="assets/uploads/logo.png" alt="IKIZAME Logo" onerror="this.style.display='none'">
            <div>
                <div class="banner-logo-text">IKIZAME</div>
                <div class="banner-logo-sub">Ikizamini cy'Inzira</div>
            </div>
        </a>
        <div class="banner-title">IBYAVUYE MU KIZAMINI CYAWE</div>
        <div class="banner-spacer"></div>
    </div>

    <div class="page-wrap">

        <!-- INFO CARD -->
        <div class="info-card">

            <!-- Score hero: full-width one-line bar -->
            <div class="score-hero">
                <div class="score-block" id="scoreBlock">
                    <div class="score-fraction">
                        <div class="score-value" id="scoreValue">0</div>
                        <div class="score-denom">/20</div>
                    </div>
                    <div class="score-label">Amanota</div>
                </div>
                <div class="score-meta">
                    <div class="status-pill" id="statusPill">---</div>
                    <div class="progress-bar-wrap">
                        <div class="progress-label">
                            <span>Amanota yawe</span>
                            <span id="progressPct">0%</span>
                        </div>
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill" style="width:0%"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Student info, one line on desktop, 2-col on mobile -->
            <div class="student-info">
                <div class="info-row">
                    <div class="info-icon"><i class="fa-solid fa-id-card"></i></div>
                    <div style="min-width:0;">
                        <div class="info-label">Amazina</div>
                        <div class="info-value" id="labelStudentName">---</div>
                    </div>
                </div>
                <div class="info-row">
                    <div class="info-icon score-icon"><i class="fa-solid fa-medal"></i></div>
                    <div style="min-width:0;">
                        <div class="info-label">Amanota</div>
                        <div class="info-value" id="labelScore">---</div>
                    </div>
                </div>
                <div class="info-row">
                    <div class="info-icon phone-icon"><i class="fa-solid fa-mobile-screen"></i></div>
                    <div style="min-width:0;">
                        <div class="info-label">Telefoni</div>
                        <div class="info-value" id="labelPhoneNumber">---</div>
                    </div>
                </div>
                <div class="info-row">
                    <div class="info-icon time-icon"><i class="fa-regular fa-calendar-check"></i></div>
                    <div style="min-width:0;">
                        <div class="info-label">Igihe cyakorewe</div>
                        <div class="info-value" id="labelTime">---</div>
                    </div>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats-row">
                <div class="stat-cell s-correct">
                    <div class="stat-num" id="statCorrect">0</div>
                    <div class="stat-lbl"><i class="fa-solid fa-circle-check" style="margin-right:3px;"></i>WASUBIJE NEZA</div>
                </div>
                <div class="stat-cell s-wrong">
                    <div class="stat-num" id="statWrong">0</div>
                    <div class="stat-lbl"><i class="fa-solid fa-circle-xmark" style="margin-right:3px;"></i>WASUBIJE NABI</div>
                </div>
                <div class="stat-cell s-skip">
                    <div class="stat-num" id="statSkip">0</div>
                    <div class="stat-lbl"><i class="fa-solid fa-circle-minus" style="margin-right:3px;"></i>BIDASUBIWE</div>
                </div>
            </div>

            <!-- Footer: button only -->
            <div class="card-footer">
                <a href="/" class="btn-home">
                    <i class="fa-solid fa-house"></i> Subira Ahabanza
                </a>
            </div>
        </div>

        <!-- QUESTIONS SECTION -->
        <div class="questions-wrap">
            <div class="section-divider">
                <div class="line"></div>
                <span><i class="fa-solid fa-list-check" style="margin-right:5px;color:var(--brand);"></i>Ibibazo Byose n'Ibisubizo Byazo</span>
                <div class="line"></div>
            </div>
            <div id="questionsContainer"></div>
        </div>

    </div><!-- /page-wrap -->

    <!-- BACK TO TOP BUTTON -->
    <button id="backToTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})">
        <i class="fa-solid fa-arrow-up"></i> Subira Hejuru
    </button>

    <script>
        // ── GUARD: redirect to amanota if no valid session data ──
        (function() {
            const phone = sessionStorage.getItem('phoneNumber');
            const questions = sessionStorage.getItem('shuffledQuestionsReview');
            const score = sessionStorage.getItem('latestScore');
            if (!phone || !questions || score === null) {
                window.location.replace('/amanota');
            }
        })();

        document.addEventListener('DOMContentLoaded', () => {
            // Back to top button
            const backToTopBtn = document.getElementById('backToTopBtn');
            window.addEventListener('scroll', () => {
                backToTopBtn.classList.toggle('visible', window.scrollY > 300);
            });

            const latestScore  = parseInt(sessionStorage.getItem('latestScore'), 10) || 0;
            const studentName  = sessionStorage.getItem('studentName')  || 'Umunyeshuri';
            const phoneNumber  = sessionStorage.getItem('phoneNumber')  || '---';

            let studentAnswerMapping = {};
            let snapshotQuestionsArray = [];
            try { studentAnswerMapping  = JSON.parse(sessionStorage.getItem('studentAnswerMapping'))   || {}; } catch(e) {}
            try { snapshotQuestionsArray = JSON.parse(sessionStorage.getItem('shuffledQuestionsReview')) || []; } catch(e) {}

            // Header info
            document.getElementById('labelStudentName').textContent = studentName;
            document.getElementById('labelPhoneNumber').textContent = phoneNumber;
            document.getElementById('labelScore').textContent       = latestScore + ' / 20';
            document.getElementById('labelTime').textContent = new Date().toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });

            const isPassed = latestScore >= 12;
            const pct      = Math.round((latestScore / 20) * 100);

            const scoreVal = document.getElementById('scoreValue');
            scoreVal.textContent = latestScore;
            scoreVal.classList.add(isPassed ? 'pass' : 'fail');
            document.getElementById('scoreBlock').classList.add(isPassed ? 'pass-bg' : 'fail-bg');

            // Pill
            const pill = document.getElementById('statusPill');
            pill.innerHTML = isPassed
                ? '<i class="fa-solid fa-trophy"></i> YATSINZE'
                : '<i class="fa-solid fa-rotate-right"></i> NTIYATSINZE';
            pill.classList.add(isPassed ? 'pass' : 'fail');

            // Progress
            const pf = document.getElementById('progressFill');
            pf.classList.add(isPassed ? 'pass' : 'fail');
            document.getElementById('progressPct').textContent = pct + '%';
            setTimeout(() => { pf.style.width = pct + '%'; }, 150);

            // Stats
            let correct = 0, wrong = 0, skip = 0;
            snapshotQuestionsArray.forEach(q => {
                const ans = (studentAnswerMapping[`question_${q.id}`] || studentAnswerMapping[String(q.id)] || '').toUpperCase().trim();
                const cor = (q.correct_option || q.correct_option_letter || 'A').toUpperCase().trim();
                if (!ans) skip++;
                else if (ans === cor) correct++;
                else wrong++;
            });
            document.getElementById('statCorrect').textContent = correct;
            document.getElementById('statWrong').textContent   = wrong;
            document.getElementById('statSkip').textContent    = skip;

            // Questions
            const container = document.getElementById('questionsContainer');
            if (!snapshotQuestionsArray.length) {
                container.innerHTML = `<div style="text-align:center;padding:40px;color:#94a3b8;font-weight:600;">Nta bibazo byabonetse. Gerageza undi mugera.</div>`;
                return;
            }

            snapshotQuestionsArray.forEach((q, idx) => {
                const ans = (studentAnswerMapping[`question_${q.id}`] || studentAnswerMapping[String(q.id)] || '').toUpperCase().trim();
                const cor = (q.correct_option || q.correct_option_letter || 'A').toUpperCase().trim();
                const isCorrect = ans && ans === cor;
                const isSkipped = !ans;

                const cardClass  = isSkipped ? 'skipped-card' : isCorrect ? 'correct-card' : 'wrong-card';
                const badgeClass = isSkipped ? 'skipped' : isCorrect ? 'correct' : 'wrong';
                const badgeText  = isSkipped
                    ? '<i class="fa-solid fa-minus"></i> WASIMBUTSE'
                    : isCorrect
                        ? '<i class="fa-solid fa-check"></i> WAGIKOZE NEZA'
                        : '<i class="fa-solid fa-xmark"></i> WAGISUBIJE NABI';

                let imgHtml = '';
                const rawImg = (q.image_path || q.image_url || '').trim();
                if (rawImg) {
                    imgHtml = `<img src="assets/uploads/${rawImg}" class="q-image" alt="Ifoto y'ikibazo" onerror="this.style.display='none'">`;
                }

                const opts = ['A','B','C','D'];
                const isImgOpts = opts.every(l => {
                    const v = String(q[`option_${l.toLowerCase()}`] || '').trim();
                    return !!v && (/\.(png|jpg|jpeg|gif|webp)$/i.test(v) || v.includes('_File-'));
                });
                const optHtml = opts.map(l => {
                    const val = q[`option_${l.toLowerCase()}`] || q[`option_${l}`] || '---';
                    const isUserPick = ans === l;
                    const isCor      = cor === l;
                    let cls = '', icon = '';
                    if (isCor && isUserPick) { cls = 'user-correct'; icon = `<i class="fa-solid fa-check opt-icon" style="color:#10b981;"></i>`; }
                    else if (isCor)          { cls = 'correct-target'; icon = `<i class="fa-solid fa-check opt-icon" style="color:#10b981;"></i>`; }
                    else if (isUserPick)     { cls = 'user-wrong'; icon = `<i class="fa-solid fa-xmark opt-icon" style="color:#ef4444;"></i>`; }

                    const stringValue = (val !== null && val !== undefined) ? String(val).trim() : '';
                    const isGraphicAsset = !!stringValue && (/\.(png|jpg|jpeg|gif|webp)$/i.test(stringValue) || stringValue.includes('_File-'));
                    const contentHtml = isGraphicAsset
                        ? `<img src="assets/uploads/${stringValue}" alt="Option ${l}" style="${isImgOpts ? 'width:100%;max-height:160px;object-fit:contain;border-radius:8px;' : 'max-height:140px;margin:0;border:none;background:transparent;'}" onerror="this.style.display='none'">`
                        : `<span>${stringValue || '---'}</span>`;
                    return `<div class="option-row ${cls}"><div class="opt-letter">${l}</div>${contentHtml}${icon}</div>`;
                }).join('');

                container.innerHTML += `
                    <div class="question-card ${cardClass}" style="animation-delay:${idx * 30}ms">
                        <div class="q-bar">
                            <div class="q-num">
                                <div class="num-circle">${idx + 1}</div>
                                Ikibazo cya ${idx + 1}
                            </div>
                            <span class="q-badge ${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="q-body">
                            <div class="q-text">${q.question || q.question_text || 'Nta text ihari'}</div>
                            ${imgHtml}
                        </div>
                        <div class="options-list${isImgOpts ? ' img-grid' : ''}">${optHtml}</div>
                    </div>`;
            });
        });
    </script>
</body>
</html>
