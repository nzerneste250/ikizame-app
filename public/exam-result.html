<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IKIZAME - Ibanga Ry'Amanota</title>
    <!-- Premium Google Fonts Hierarchy Inter -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* 🪐 CLEAN SYSTEM GRAPHICS PERFORMANCE DESIGN SYSTEM */
        :root {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --accent-blue: #0b698b;
            --border-color: #cbd5e1;
            
            --success-bg: #dcfce7;
            --success-text: #15803d;
            --error-bg: #fee2e2;
            --error-text: #b91c1c;
            
            /* Fluid base sizing scales smoothly across device dimensions */
            font-size: clamp(12px, 1.2vw, 16px);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-primary); color: var(--text-dark); padding: 30px 15px; min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

        .result-layout-wrapper { max-width: 840px; margin: 0 auto; display: flex; flex-direction: column; gap: 25px; width: 100%; }

        /* 🏆 METRIC SCOREBOARD SUMMARY HEADER CARD */
        .summary-banner-card {
            background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 35px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
            display: flex; flex-direction: column; align-items: center; gap: 12px; position: relative; overflow: hidden;
        }
        .summary-banner-card h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px; }
        .summary-banner-card p { font-size: 0.95rem; color: var(--text-muted); line-height: 1.45; }
        
        .score-circle-badge {
            width: 110px; height: 110px; border-radius: 50%; background: radial-gradient(#ffffff, #f8fafc);
            border: 4px solid var(--border-color); display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.04); margin: 10px 0;
        }
        .score-num { font-size: 1.8rem; font-weight: 800; color: var(--text-dark); line-height: 1; }
        .score-total-txt { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); margin-top: 2px; }

        .status-ribbon { padding: 8px 24px; font-size: 0.85rem; font-weight: 800; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; }
        .status-ribbon.pass { background-color: var(--success-bg); color: var(--success-text); }
        .status-ribbon.fail { background-color: var(--error-bg); color: var(--error-text); }

        .btn-restart-exam {
            display: inline-flex; align-items: center; gap: 8px; background-color: var(--accent-blue);
            color: #ffffff; text-decoration: none; padding: 12px 24px; font-size: 0.9rem; font-weight: 700;
            border-radius: 8px; transition: background 0.15s ease; box-shadow: 0 4px 6px rgba(11, 105, 139, 0.15); margin-top: 5px;
        }
        .btn-restart-exam:hover { background-color: #08536e; }

        /* 📝 CORRECTIONS REVIEW REPOSITORY CONTAINER SHEET */
        .section-title { font-size: 1.1rem; font-weight: 800; color: var(--text-dark); text-transform: uppercase; letter-spacing: 0.75px; margin-top: 10px; display: flex; align-items: center; gap: 8px; }
        .corrections-master-feed { display: flex; flex-direction: column; gap: 20px; }

        .correction-item-row {
            background-color: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 12px;
            padding: 24px; display: flex; flex-direction: column; gap: 15px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.01);
        }
        
        .row-header-meta { display: flex; justify-content: space-between; align-items: center; gap: 15px; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px; }
        .question-number-index { font-size: 0.85rem; font-weight: 800; color: var(--accent-blue); background-color: #e0f2fe; padding: 4px 10px; border-radius: 4px; }
        
        .verdict-badge { font-size: 0.8rem; font-weight: 800; text-transform: uppercase; padding: 4px 10px; border-radius: 4px; display: inline-flex; align-items: center; gap: 6px; }
        .verdict-badge.correct { background-color: var(--success-bg); color: var(--success-text); }
        .verdict-badge.wrong { background-color: var(--error-bg); color: var(--error-text); }

        .question-wording-txt { font-size: 1.05rem; font-weight: 700; color: #1e293b; line-height: 1.45; }

        .question-media-wrapper { display: flex; flex-direction: column; gap: 15px; }
        .question-sign-preview-box { width: 140px; height: 140px; border: 1px solid var(--border-color); border-radius: 8px; background-color: #fafafa; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 6px; }
        .question-sign-preview-box img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }

        /* 🎛️ DYNAMIC CHOICES PRESENTATION SHIFTER GRID CONTAINER */
        .choices-review-block { display: flex; flex-direction: column; gap: 10px; width: 100%; }
        
        /* 📸 MEDIA SHIFTER ACCENT: Automatically scales into a responsive 2-column image layout grid */
        .choices-review-block.image-options-grid-mode {
            display: grid !important; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)) !important; gap: 14px !important;
        }

        .choice-strip-item {
            display: flex; align-items: center; gap: 14px; padding: 12px 18px; border: 2px solid #e2e8f0;
            border-radius: 8px; font-size: 0.95rem; font-weight: 600; color: #334155; background-color: #ffffff; width: 100%; box-sizing: border-box;
        }
        .choice-strip-item.student-selected { border-color: #fca5a5; background-color: #fef2f2; color: #991b1b; }
        .choice-strip-item.system-correct { border-color: #86efac; background-color: #f0fdf4; color: #166534; font-weight: 700; }
        .choice-strip-item.both-matched { border-color: #22c55e; background-color: #f0fdf4; color: #166534; font-weight: 700; box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15); }

        .letter-marker { font-weight: 800; text-transform: uppercase; margin-right: 2px; }

        /* Embedded Thumbnails inside image options review cards */
        .choice-embedded-thumb-box {
            height: 75px; max-width: 120px; flex: 1; border: 1px solid var(--border-color);
            border-radius: 6px; padding: 4px; background: #f8fafc; display: inline-flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .choice-embedded-thumb-box img { max-width: 100%; max-height: 100%; object-fit: contain; }

        /* Footer Frame */
        .brand-attribution-footer { text-align: center; color: #94a3b8; font-size: 0.8rem; margin-top: auto; padding-top: 30px; }
        .brand-attribution-footer strong { color: #38bdf8; }

        @media screen and (max-width: 991px) {
            .choices-review-block.image-options-grid-mode { grid-template-columns: 1fr 1fr !important; gap: 10px !important; }
            .choice-embedded-thumb-box { height: 65px; }
        }

        @media screen and (max-width: 480px) {
            body { padding: 15px 8px; }
            .choices-review-block.image-options-grid-mode { grid-template-columns: 1fr !important; }
            .summary-banner-card { padding: 25px 15px; }
            .correction-item-row { padding: 16px; }
        }
    </style>
</head>
<body>

    <main class="result-layout-wrapper">
        <!-- Summary Scorecard Overview Panel Component -->
        <section class="summary-banner-card">
            <h1>Ibyavuye mu Kizame</h1>
            <p id="studentGreetingLabel">Urakoze cyane gukora isuzuma ry'ubumenyi.</p>
            
            <div class="score-circle-badge">
                <div class="score-num" id="displayScoreNum">0</div>
                <div class="score-total-txt" id="displayTotalCount">/ 20</div>
            </div>

            <div class="status-ribbon" id="verdictStatusRibbon">---</div>
            
            <a href="index.html" class="btn-restart-exam"><i class="fa-solid fa-rotate-left"></i> Subira Inyuma / Ongera Ukore</a>
        </section>

        <h2 class="section-title"><i class="fa-solid fa-list-check"></i> Isuzuma rya buri Kibazo (Detailed Correction)</h2>

        <!-- Interactive Sheet feed where row iterations append -->
        <section class="corrections-master-feed" id="correctionsMasterContainerFeed"></section>

        <footer class="brand-attribution-footer">
            <p>&copy; 2026 IKIZAME Web Portal. Developed by <strong>izo service quicky</strong></p>
        </footer>
    </main>

    <!-- Async Controller Data Mapping Logic Core Engine Script Block -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const studentName = sessionStorage.getItem('studentName') || "Umunyeshuri";
            const score = parseInt(sessionStorage.getItem('latestScore'), 10) || 0;
            const total = parseInt(sessionStorage.getItem('latestTotal'), 10) || 20;
            
            const rawAnswersMapping = sessionStorage.getItem('studentAnswerMapping');
            const rawQuestionsReviewPool = sessionStorage.getItem('shuffledQuestionsReview');
                        // Formulate greetings banner attributes configurations
            document.getElementById('studentGreetingLabel').innerText = `Urakoze cyane ${studentName}, ngaha ibyavuye mu isuzuma ryawe:`;
            document.getElementById('displayScoreNum').innerText = score;
            document.getElementById('displayTotalCount').innerText = `/ ${total}`;
            
            const ribbon = document.getElementById('verdictStatusRibbon');
            // Pass mark grading assessment condition parameters set at standard 12/20 boundaries
            if (score >= 12) {
                ribbon.innerText = "YATSINZE (PASSED)";
                ribbon.className = "status-ribbon pass";
            } else {
                ribbon.innerText = "YATSINZWE (FAILED)";
                ribbon.className = "status-ribbon fail";
            }

            const feedContainer = document.getElementById('correctionsMasterContainerFeed');

            if (!rawAnswersMapping || !rawQuestionsReviewPool) {
                feedContainer.innerHTML = `<p style="text-align:center; padding:30px; font-style:italic; color:#64748b;">Nta makuru y'isuzuma agaragara mu bubiko muryo bw'akanya kanyengetera.</p>`;
                return;
            }

            const studentAnswers = JSON.parse(rawAnswersMapping);
            const questionsList = JSON.parse(rawQuestionsReviewPool);

            // ⚡ MAIN RUNTIME FEED REPOSITORY MATRIX GENERATOR LOOP
            feedContainer.innerHTML = questionsList.map((exam, index) => {
                const questionNumber = index + 1;
                const studentSelectionKey = studentAnswers[exam.id] || "Nta gihari";
                const systemCorrectKey = exam.correct_option;
                const isUserCorrect = studentSelectionKey === systemCorrectKey;

                // Utility element compiler to structure clean option items profiles dynamically
                function compileOptionCardMarkup(letterKey, textValue) {
                    if (!textValue) return "";
                    
                    let customStyleClass = "choice-strip-item";
                    if (letterKey === studentSelectionKey) customStyleClass += " student-selected";
                    if (letterKey === systemCorrectKey) customStyleClass += " system-correct";
                    if (letterKey === studentSelectionKey && letterKey === systemCorrectKey) customStyleClass = "choice-strip-item both-matched";

                    // 📸 OPTIONS INTERCEPT ENGINE: Evaluates string formats to find file expansions or prefixes
                    const isChoiceGraphicImage = /\.(png|jpg|jpeg|gif|webp)$/i.test(textValue) || 
                                                 textValue.startsWith('optionA_File-') || 
                                                 textValue.startsWith('optionB_File-') || 
                                                 textValue.startsWith('optionC_File-') || 
                                                 textValue.startsWith('optionD_File-');

                    if (isChoiceGraphicImage) {
                        return `
                            <div class="${customStyleClass}">
                                <span class="letter-marker">${letterKey.toLowerCase()})</span>
                                <div class="choice-embedded-thumb-box">
                                    <img src="assets/uploads/${textValue}" alt="Choice Thumbnail" loading="lazy" onerror="this.style.display='none'; this.parentElement.innerText='${textValue}'">
                                </div>
                            </div>
                        `;
                    }

                    return `
                        <div class="${customStyleClass}">
                            <span class="letter-marker">${letterKey.toLowerCase()})</span> <span>${textValue}</span>
                        </div>
                    `;
                }

                // Verify if full multi-choice items collection is image-based to shift the container wrapper grid
                const isOptionCollectionImageBased = /\.(png|jpg|jpeg|gif|webp)$/i.test(exam.option_a) || (exam.option_a && exam.option_a.includes('optionA_File-'));

                return `
                    <div class="correction-item-row">
                        <div class="row-header-meta">
                            <span class="question-number-index">Ikibazo cya ${questionNumber}</span>
                            <span class="verdict-badge ${isUserCorrect ? 'correct' : 'wrong'}">
                                ${isUserCorrect ? '<i class="fa-solid fa-circle-check"></i> Mucyenye' : '<i class="fa-solid fa-circle-xmark"></i> Mwazize'}
                            </span>
                        </div>

                        <div class="question-media-wrapper">
                            <div class="question-wording-txt">${exam.question}</div>
                            ${exam.image_path ? `
                                <div class="question-sign-preview-box">
                                    <img src="assets/uploads/${exam.image_path}" alt="Sign Symbol" loading="lazy">
                                </div>
                            ` : ''}
                        </div>

                        <!-- 🎯 MULTI-CHOICE VIEWPORT CORRECTION SHEET LAYOUT GRID -->
                        <div class="choices-review-block ${isOptionCollectionImageBased ? 'image-options-grid-mode' : ''}">
                            ${compileOptionCardMarkup("A", exam.option_a)}
                            ${compileOptionCardMarkup("B", exam.option_b)}
                            ${compileOptionCardMarkup("C", exam.option_c)}
                            ${compileOptionCardMarkup("D", exam.option_d)}
                        </div>
                    </div>
                `;
            }).join('');
        });
    </script>
</body>
</html>
