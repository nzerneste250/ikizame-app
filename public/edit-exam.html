<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Question - IKIZAME Professional Admin</title>
    <!-- Premium Google Fonts Hierarchy Inter -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        /* 🪐 CLEAN PROFESSIONAL LIGHT-CARD THEME FOR THE MAIN FORM */
        :root {
            --bg-primary: #f8fafc;        /* Soft off-white backdrop */
            --bg-secondary: #ffffff;      /* Crisp pure white for the main form card */
            --bg-surface: #f1f5f9;        /* Light grey for interior utility elements */
            --text-main: #0f172a;         /* Deep charcoal text for perfect readability */
            --text-muted: #64748b;        /* Professional medium grey for descriptions */
            --accent-glow: #0284c7;       /* Deep premium sky blue for active elements */
            --accent-save: #10b981;       /* Standard emerald green for successful saves */
            --border-color: #cbd5e1;      /* Light border lines for sections separators */
            --input-focus: #0b698b;       /* Dark teal accents for form control button paths */
            
            /* Keep separate tokens for the dark sidebar navigation box panel layout */
            --sidebar-bg: #131a2c;
            --sidebar-border: #334155;
            --sidebar-text-muted: #94a3b8;
            --sidebar-text-active: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        html, body { height: 100vh; background-color: var(--bg-primary); color: var(--text-main); overflow: hidden; }

        .admin-layout-grid { display: flex; height: calc(100vh - 45px); overflow: hidden; }

        /* 🔒 1. FIXED SIDEBAR NAVIGATION PANEL */
        .sidebar-panel {
            width: 260px; background-color: var(--sidebar-bg); border-right: 1px solid var(--sidebar-border);
            padding: 30px 20px; display: flex; flex-direction: column; gap: 35px; flex-shrink: 0;
        }
        .sidebar-panel h2 {
            font-size: 18px; font-weight: 800; letter-spacing: 1.5px; color: #38bdf8;
            text-transform: uppercase; display: flex; align-items: center; gap: 10px;
        }
        .sidebar-nav { display: flex; flex-direction: column; gap: 8px; }
        .sidebar-nav a {
            color: var(--sidebar-text-muted); text-decoration: none; padding: 14px 16px;
            font-size: 14px; font-weight: 600; border-radius: 8px; display: flex; align-items: center; gap: 12px; transition: all 0.2s ease;
        }
        .sidebar-nav a:hover, .sidebar-nav a.active { color: var(--sidebar-text-active); background-color: rgba(255,255,255,0.08); }
        .sidebar-nav a.active { border-left: 4px solid #38bdf8; padding-left: 12px; font-weight: 700; }

        /* 🔒 2. SCROLLABLE PRO-WORKSPACE WRAPPER PANEL */
        .workspace-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        .header-title-bar {
            padding: 25px 40px; border-bottom: 1px solid var(--border-color);
            background: linear-gradient(180deg, #ffffff 0%, var(--bg-primary) 100%);
            display: flex; justify-content: space-between; align-items: center; flex-shrink: 0;
        }
        .header-title-bar h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; color: var(--text-main); }
        .header-title-bar p { font-size: 13px; color: var(--text-muted); }

        /* 🎛️ AUTOMATED VISUAL LAYOUT INDICATOR ENGINE BADGE */
        .layout-badge-card {
            background-color: var(--bg-secondary); border: 1px dashed var(--border-color);
            border-radius: 8px; padding: 10px 20px; display: flex; align-items: center; gap: 10px;
        }
        .layout-badge-card i { color: var(--accent-glow); }
        .layout-badge-card span { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted); }

        /* Scroll Box Card Frame */
        .form-card-scroller { flex: 1; overflow-y: auto; padding: 30px 40px; min-height: 0; }
        
        .main-inputs-form {
            background-color: var(--bg-secondary); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 35px; max-width: 900px; display: flex; flex-direction: column; gap: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .form-group-block { display: flex; flex-direction: column; gap: 8px; }
        .form-group-block label { font-size: 12px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }

        .main-inputs-form textarea,
        .main-inputs-form input[type="text"],
        .main-inputs-form select {
            width: 100%; padding: 12px 16px; background-color: #ffffff;
            border: 2px solid var(--border-color); border-radius: 8px; font-size: 14px; font-weight: 500;
            color: var(--text-main); outline: none; transition: border-color 0.15s ease;
        }
        .main-inputs-form textarea:focus,
        .main-inputs-form input[type="text"]:focus,
        .main-inputs-form select:focus { border-color: var(--accent-glow); }

        /* 📸 QUESTION SIGN PREVIEW LOGIC STRIP CARD */
        .studio-upload-strip {
            background-color: #f1f5f9; border: 2px dashed #cbd5e1; border-radius: 8px;
            padding: 20px; display: grid; grid-template-columns: 100px 1fr; gap: 24px; align-items: center;
        }
        .studio-preview-box {
            height: 75px; background-color: #ffffff; border: 1px solid var(--border-color);
            border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 4px;
        }
        .studio-preview-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .studio-preview-box .placeholder-ico { color: #94a3b8; font-size: 22px; }
        .upload-actions-box p { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-main); }
        .file-input-ghost { font-size: 12px; color: var(--text-muted); }

        /* 🎯 OPTIONS GRID SEPARATORS CONTAINERS */
        .dynamic-options-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        .option-uploader-card {
            background-color: #ffffff; border: 2px solid var(--border-color);
            border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 10px;
        }
        .option-header-row { font-size: 11px; font-weight: 800; color: var(--accent-glow); text-transform: uppercase; }
        
        .option-thumb-preview {
            width: 100%; height: 85px; background-color: var(--bg-primary); border: 1px dashed var(--border-color);
            border-radius: 6px; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 4px;
        }
        .option-thumb-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .option-thumb-preview span { font-size: 11px; color: #94a3b8; font-style: italic; }

        /* Action Buttons Row Panel Layout */
        .execution-actions-bar {
            display: flex; align-items: center; gap: 20px; border-top: 1px solid var(--border-color);
            padding-top: 25px; margin-top: 5px;
        }
        .btn-core-submit {
            background-color: #0b698b; color: #ffffff; border: none; padding: 12px 28px;
            font-size: 14px; font-weight: 700; border-radius: 6px; cursor: pointer; display: inline-flex;
            align-items: center; gap: 8px; transition: background 0.15s ease;
        }
        .btn-core-submit:hover { background-color: #08536e; }
        .btn-core-cancel { color: var(--text-muted); text-decoration: none; font-size: 14px; font-weight: 600; }
        .btn-core-cancel:hover { color: var(--text-main); }

        /* Footers Baseline Branding Frame */
        .admin-footer-panel {
            background-color: #131a2c; color: #64748b; text-align: center;
            padding: 14px; font-size: 11.5px; border-top: 1px solid #334155; height: 45px; z-index: 100;
        }
        .admin-footer-panel strong { color: #38bdf8; }

        @media screen and (max-width: 992px) {
            .dynamic-options-wrapper { grid-template-columns: 1fr; gap: 15px; }
            .sidebar-panel { display: none; }
            .form-card-scroller { padding: 20px; }
            .main-inputs-form { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="admin-layout-grid">
        <!-- Sidebar Navigation Menu Left Workspace -->
        <aside class="sidebar-panel">
            <h2><i class="fa-solid fa-graduation-cap"></i> IKIZAME</h2>
            <nav class="sidebar-nav">
                <a href="dashboard.html"><i class="fa-solid fa-chart-pie"></i> Questions Board</a>
                <a href="add-exam.html"><i class="fa-solid fa-square-plus"></i> Add New Question</a>
                <a href="/api/admin/logout"><i class="fa-solid fa-power-off"></i> Sign Out</a>
            </nav>
        </aside>

        <!-- Main Workspace Panel Wrapper Container Frame -->
        <main class="workspace-panel">
            <header class="header-title-bar">
                <div>
                    <h1>Modify Question Parameters</h1>
                    <p>Overwrite core database text columns, update selection mappings, or upload replacement files.</p>
                </div>
                <!-- 🎛️ AUTOMATED VISUAL DETECTION ENGINE BADGE -->
                <div class="layout-badge-card">
                    <i class="fa-solid fa-microchip"></i>
                                        <span id="activeLayoutModeBadge">Detecting Mode...</span>
                </div>
            </header>

            <div class="form-card-scroller">
                <!-- Redirect maps straight to the hybrid edit handler endpoint -->
                <form action="/api/exams/edit" method="POST" enctype="multipart/form-data" class="main-inputs-form">
                    
                    <!-- Hidden targeting reference parameter keys -->
                    <input type="hidden" id="targetRecordId" name="id">
                    <input type="hidden" id="optionsLayoutMode" name="optionsLayoutMode" value="text">
                    <input type="hidden" id="existingImagePath" name="existingImagePath">

                    <!-- Fallback placeholders used to keep old filenames if unreplaced by new uploads -->
                    <input type="hidden" id="existingOptA" name="existingOptA">
                    <input type="hidden" id="existingOptB" name="existingOptB">
                    <input type="hidden" id="existingOptC" name="existingOptC">
                    <input type="hidden" id="existingOptD" name="existingOptD">

                    <div class="form-group-block">
                        <label for="question">Question Text (Statement)</label>
                        <textarea id="question" name="question" rows="3" required></textarea>
                    </div>

                    <!-- 📸 MAIN ROAD SIGN ENVELOPE STRIP CARD -->
                    <div class="studio-upload-strip">
                        <div class="studio-preview-box" id="mainQuestionImagePreviewPane">
                            <i class="fa-solid fa-image placeholder-ico"></i>
                        </div>
                        <div class="upload-actions-box">
                            <p>Current Road Sign Image (Click Browse to Replace):</p>
                            <input type="file" id="imageFile" name="imageFile" class="file-input-ghost" accept="image/*">
                        </div>
                    </div>

                    <!-- 🎯 INTERACTIVE CONFIG HOUSING CONTAINER: Script injects text fields OR image fields automatically -->
                    <div class="dynamic-options-wrapper" id="dynamicOptionsInputGridContainer"></div>

                    <div class="form-group-block" style="max-width: 320px;">
                        <label for="correctOption">Correct Option Answer Key</label>
                        <select id="correctOption" name="correctOption" required>
                            <option value="">-- Choose correct letter --</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                        </select>
                    </div>

                    <div class="execution-actions-bar">
                        <button type="submit" class="btn-core-submit"><i class="fa-solid fa-square-check"></i> Save Updated Parameters</button>
                        <a href="dashboard.html" class="btn-core-cancel">Cancel & Go Back</a>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <footer class="admin-footer-panel">
        <p>Developed by <strong>izo service quicky</strong></p>
    </footer>

    <!-- Client Runtime Core Execution Script Engine Block -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Extract the query parameter ID from the browser window's URL line
            const queryParamsString = window.location.search;
            const urlParametersParser = new URLSearchParams(queryParamsString);
            const questionTargetId = urlParametersParser.get('id');

            if (!questionTargetId) {
                alert('Broken reference key context! Redirecting back to management table view.');
                window.location.replace('dashboard.html');
                return;
            }

            const modeBadge = document.getElementById('activeLayoutModeBadge');
            const layoutModeInput = document.getElementById('optionsLayoutMode');
            const dynamicGridContainer = document.getElementById('dynamicOptionsInputGridContainer');
            
            const mainImgInput = document.getElementById('imageFile');
            const mainImgPreview = document.getElementById('mainQuestionImagePreviewPane');

            // ⚡ 1. REAL-TIME FILE READER PREVIEW FOR CORE TRAFFIC SIGN SYMBOL IMAGE
            mainImgInput.addEventListener('change', function() {
                const targetFile = this.files;
                if (targetFile && targetFile[0]) {
                    const readerInstance = new FileReader();
                    readerInstance.onload = function(e) {
                        mainImgPreview.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                    }
                    readerInstance.readAsDataURL(targetFile[0]);
                }
            });

            // ⚡ 2. FETCH THE ACTIVE RECORD VALUES TO POPULATE THE COMPANION FIELD CONTAINER
            fetch(`/api/exams/${questionTargetId}`)
                .then(res => res.json())
                .then(questionPayloadBox => {
                    // Extract row dictionary data cleanly out of index array box if packed
                    const exam = Array.isArray(questionPayloadBox) ? questionPayloadBox[0] : questionPayloadBox;
                    
                    if (!exam) {
                        alert('Question parameters row entity context object not found.');
                        window.location.replace('dashboard.html');
                        return;
                    }

                    // Bind basic tracking properties straight into hidden attributes
                    document.getElementById('targetRecordId').value = exam.id;
                    document.getElementById('question').value = exam.question;
                    document.getElementById('correctOption').value = exam.correct_option;
                    document.getElementById('existingImagePath').value = exam.image_path || '';

                    document.getElementById('existingOptA').value = exam.option_a || '';
                    document.getElementById('existingOptB').value = exam.option_b || '';
                    document.getElementById('existingOptC').value = exam.option_c || '';
                    document.getElementById('existingOptD').value = exam.option_d || '';

                    // Load main question sign graphic image relative path safely (no leading /)
                    if (exam.image_path) {
                        mainImgPreview.innerHTML = `<img src="assets/uploads/${exam.image_path}" alt="Main Sign">`;
                    }

                    // 🎯 MEDIA SNIFFER ENGINE: Looks for image suffix formats inside columns string values
                    const isImageOptionsLayout = /\.(png|jpg|jpeg|gif|webp)$/i.test(exam.option_a) || (exam.option_a && exam.option_a.includes('optionA_File-'));

                    if (isImageOptionsLayout) {
                        // 📸 CHOOSE MULTI-IMAGE INPUT LAYOUT
                        layoutModeInput.value = 'image';
                        modeBadge.innerText = "Four Image Options Mode";
                        modeBadge.parentElement.style.borderColor = "#0284c7";

                        dynamicGridContainer.innerHTML = `
                            <div class="option-uploader-card">
                                <div class="option-header-row">Option Image A</div>
                                <div class="option-thumb-preview" id="previewOptionImage_A">
                                    <img src="assets/uploads/${exam.option_a}" alt="Option A">
                                </div>
                                <input type="file" name="optionA_File" id="input_file_A" accept="image/*" class="file-input-ghost">
                            </div>
                            <div class="option-uploader-card">
                                <div class="option-header-row">Option Image B</div>
                                <div class="option-thumb-preview" id="previewOptionImage_B">
                                    <img src="assets/uploads/${exam.option_b}" alt="Option B">
                                </div>
                                <input type="file" name="optionB_File" id="input_file_B" accept="image/*" class="file-input-ghost">
                            </div>
                            <div class="option-uploader-card">
                                <div class="option-header-row">Option Image C</div>
                                <div class="option-thumb-preview" id="previewOptionImage_C">
                                    <img src="assets/uploads/${exam.option_c}" alt="Option C">
                                </div>
                                <input type="file" name="optionC_File" id="input_file_C" accept="image/*" class="file-input-ghost">
                            </div>
                            <div class="option-uploader-card">
                                <div class="option-header-row">Option Image D</div>
                                <div class="option-thumb-preview" id="previewOptionImage_D">
                                    <img src="assets/uploads/${exam.option_d}" alt="Option D">
                                </div>
                                <input type="file" name="optionD_File" id="input_file_D" accept="image/*" class="file-input-ghost">
                            </div>
                        `;
                        registerLiveThumbEventListeners();
                    } else {
                        // 📝 CHOOSE TRADITIONAL IN-LINE STRINGS TEXT FIELD LAYOUT
                                                layoutModeInput.value = 'text';
                        modeBadge.innerText = "Text Options Mode";

                        dynamicGridContainer.innerHTML = `
                            <div class="form-group-block">
                                <label for="optionA">Option A</label>
                                <input type="text" id="optionA" name="optionA" required value="${exam.option_a}">
                            </div>
                            <div class="form-group-block">
                                <label for="optionB">Option B</label>
                                <input type="text" id="optionB" name="optionB" required value="${exam.option_b}">
                            </div>
                            <div class="form-group-block">
                                <label for="optionC">Option C</label>
                                <input type="text" id="optionC" name="optionC" required value="${exam.option_c}">
                            </div>
                            <div class="form-group-block">
                                <label for="optionD">Option D</label>
                                <input type="text" id="optionD" name="optionD" required value="${exam.option_d}">
                            </div>
                        `;
                    }
                })
                .catch(err => console.error('Data pull compilation exception error:', err));

            // ⚡ 3. ASYNCHRONOUS FILE READER PREVIEW FOR THE 4 DYNAMIC OPTION IMAGES
            function registerLiveThumbEventListeners() {
                const targetKeys = ["A", "B", "C", "D"];
                targetKeys.forEach(key => {
                    const inputElement = document.getElementById(`input_file_${key}`);
                    const previewElement = document.getElementById(`previewOptionImage_${key}`);

                    if (inputElement && previewElement) {
                        inputElement.addEventListener('change', function() {
                            const file = this.files;
                            if (file && file) {
                                const readerInstance = new FileReader();
                                readerInstance.onload = function(e) {
                                    previewElement.innerHTML = `<img src="${e.target.result}" alt="Option ${key}">`;
                                }
                                readerInstance.readAsDataURL(file);
                            }
                        });
                    }
                });
            }
        });
    </script>
</body>
</html>
