    <link rel="stylesheet" href="assets/css/design-system.css">
    <style>
        :root {
            --exam-navy: #0F1F33;
            --exam-blue: #0066FF;
            --exam-blue-dark: #0B4F9C;
            --exam-blue-soft: #EAF4FF;
            --exam-border: #D7E3F1;
            --exam-bg: #F4F8FC;
            --exam-text: #132238;
            --exam-muted: #63758A;
            --exam-success: #16A34A;
            --exam-danger: #EF4444;
            --border: var(--exam-border);
            --text: var(--exam-text);
            --muted: var(--exam-muted);
            --green: var(--exam-success);
            --bg: var(--exam-bg);
            --primary-soft: var(--exam-blue-soft);
            --blue: var(--exam-blue);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        /* ══════════════════════════════
           DESKTOP: fully contained, no page scroll
        ══════════════════════════════ */
        html, body {
            height: 100vh;
            height: -webkit-fill-available;
            background: linear-gradient(135deg, #f8fbff 0%, #eef6ff 100%);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .page {
            flex: 1; min-height: 0;
            display: flex; flex-direction: column; align-items: center;
            padding: 14px 20px 8px; gap: 12px; overflow: hidden;
        }

        /* ── TIMER ── */
        .timer-card {
            background: rgba(255,255,255,0.96); border: 1px solid var(--border); border-radius: 18px;
            padding: 12px 24px; text-align: center;
            width: 100%; max-width: 960px; flex-shrink: 0;
            box-shadow: 0 12px 30px rgba(15,23,42,0.06);
        }
        .timer-label { font-size: 0.72rem; font-weight: 700; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
        .timer-val   { font-size: 1.75rem; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1.2; }

        /* ── QUESTION CARD ── */
        .question-card {
            background: rgba(255,255,255,0.98); border: 1px solid var(--border); border-radius: 22px;
            padding: 22px 28px 16px;
            width: 100%; max-width: 960px;
            flex: 1; min-height: 0;
            display: flex; flex-direction: column; gap: 18px;
            overflow: hidden;
            box-shadow: 0 18px 40px rgba(15,23,42,0.06);
        }

        /* ── PROGRESS ── */
        .prog-desktop {
            flex-shrink: 0;
            display: flex; flex-direction: column; gap: 10px;
        }
        .prog-desktop .prog-row {
            display: flex; flex-wrap: nowrap;
            justify-content: center; align-items: center; gap: 8px;
        }
        .prog-line {
            width: 100%; height: 3px;
            background: #e5e7eb; border-radius: 2px; position: relative;
        }
        .prog-line-fill {
            height: 100%; background: linear-gradient(90deg, var(--exam-blue-dark), var(--exam-blue)); border-radius: 2px;
            position: absolute; left: 0; top: 0; transition: width 0.25s;
        }
        .prog-dot {
            width: 36px; height: 36px; border-radius: 50%;
            border: 2px solid #d1d5db; background: #fff;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; cursor: default; pointer-events: none;
            transition: border-color 0.12s, background 0.12s;
        }
        .prog-dot svg { display: none; }
        .prog-dot.answered { background: var(--blue); border-color: var(--blue); }
        .prog-dot.answered svg { display: block; }
        .prog-dot.current:not(.answered) { border-color: var(--blue); border-width: 3px; }

        .prog-mobile { display: none; flex-shrink: 0; flex-direction: column; gap: 5px; align-items: center; }
        .prog-mobile .prog-row { display: flex; flex-direction: row; justify-content: center; align-items: center; gap: 5px; }
        .prog-mobile .prog-dot { width: 30px; height: 30px; }

        /* ── QUESTION TEXT ── */
        .q-text {
            font-size: 1.12rem; font-weight: 600; color: var(--exam-text); line-height: 1.6;
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--exam-blue-soft) 0%, #f9fbff 100%); border: 1px solid var(--exam-border); border-radius: 12px; padding: 14px 16px;
        }

        /* ── BODY (DESKTOP) ── */
        .q-body {
            flex: 1; min-height: 0;
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px; overflow: hidden;
        }
        .q-body.no-image { grid-template-columns: 1fr; }

        .img-frame {
            border: 1px solid var(--border); border-radius: 10px; background: #fff;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; padding: 10px; min-height: 0;
        }
        .img-frame img { width: 100%; height: 100%; object-fit: contain; display: block; }

        /* ── OPTIONS (DESKTOP) ── */
        .options-list {
            display: flex; flex-direction: column;
            overflow-y: auto; height: 100%;
        }
        .opt-row {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 12px;
            border-bottom: 1px solid #f3f4f6;
            border-radius: 12px;
            cursor: pointer; background: transparent;
            transition: background 0.12s, border-color 0.12s; flex-shrink: 0;
            border: 1px solid transparent;
        }
        .opt-row:last-child { border-bottom: none; }
        .opt-row:hover { background: #f8fbff; border-color: #bfd7f3; }
        .opt-row.selected, .opt-row:has(input:checked) { background: var(--exam-blue-soft); border-color: var(--exam-blue); box-shadow: 0 0 0 3px rgba(0,102,255,0.10); }
        .opt-radio { width: 20px; height: 20px; accent-color: var(--exam-blue); flex-shrink: 0; cursor: pointer; }
        .opt-label { font-size: 1.02rem; font-weight: 500; color: var(--exam-text); line-height: 1.5; }
        .opt-label strong { font-weight: 700; }

        /* ── IMAGE OPTIONS 2×2 (DESKTOP) ── */
        .options-list.img-grid {
            display: grid !important;
            grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
            gap: 10px; overflow: hidden; height: 100%;
        }
        .options-list.img-grid .opt-row {
            flex-direction: column; align-items: stretch;
            padding: 8px; gap: 6px; height: 100%; overflow: hidden;
            border-bottom: none;
        }
        .img-opt-head { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
        .img-opt-head input { width: 15px; height: 15px; accent-color: var(--blue); }
        .img-opt-box { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 5px; background: #fff; }
        .img-opt-box img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }

        /* ── NAV BAR ── */
        .nav-bar {
            display: flex; align-items: center; justify-content: space-between;
            border-top: 1px solid var(--border); padding-top: 14px; flex-shrink: 0;
        }
        .q-counter { font-size: 0.9rem; font-weight: 700; color: var(--muted); }
        .nav-btns { display: flex; gap: 10px; }
        .btn { border: none; padding: 12px 28px; font-size: 0.95rem; font-weight: 700; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background 0.15s, transform 0.15s; }
        .btn:hover { transform: translateY(-1px); }
        .btn-back   { background: #f1f5f9; color: #475569; border: 1px solid var(--border); }
        .btn-back:hover { background: #e2e8f0; }
        .btn-next   { background: linear-gradient(135deg, var(--exam-blue), var(--exam-blue-dark)); color: #fff; box-shadow: 0 10px 24px rgba(0,102,255,0.18); }
        .btn-next:hover { background: linear-gradient(135deg, var(--exam-blue-dark), #0A3F8C); }
        .btn-submit { background: linear-gradient(135deg, var(--exam-success), #22C55E); color: #fff; box-shadow: 0 10px 24px rgba(22,163,74,0.18); }
        .btn-submit:hover { background: linear-gradient(135deg, #15803D, #16A34A); }

        /* ── FOOTER ── */
        .footer {
            width: 100%; background: #0f172a;
            display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
            gap: 6px; padding: 7px 16px; flex-shrink: 0;
            font-size: 0.7rem; color: #64748b;
        }
        .footer strong { color: #dfeeff; }
        .footer a { color: #a78bfa; text-decoration: none; font-weight: 700; }
        .footer a:hover { opacity: 0.9; }
        @media (max-width: 640px) {
            .footer { font-size: 0.65rem; padding: 8px 12px; gap: 4px; }
        }

        .options-list::-webkit-scrollbar { width: 3px; }
        .options-list::-webkit-scrollbar-track { background: transparent; }
        .options-list::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 2px; }

        /* ══════════════════════════════
           MOBILE ≤ 640px
           Key change: page scrolls naturally, no overflow:hidden traps
        ══════════════════════════════ */
        @media (max-width: 640px) {
            /* Let the whole page scroll */
            html, body {
                height: auto !important;
                overflow: auto !important;
            }

            .page {
                overflow: visible !important;
                height: auto !important;
                padding: 10px 10px 16px;
                gap: 10px;
            }

            /* Question card: no fixed height, grows with content */
            .question-card {
                flex: none !important;
                height: auto !important;
                min-height: 0 !important;
                overflow: visible !important;
                padding: 12px 14px 14px;
                gap: 12px;
            }

            /* Progress: show mobile dots */
            .prog-desktop { display: none !important; }
            .prog-mobile  { display: flex !important; }

            /* Question text */
            .q-text { font-size: 0.95rem; padding: 10px 12px; }

            /* Body: stack vertically, no fixed height */
            .q-body {
                grid-template-columns: 1fr !important;
                gap: 10px;
                overflow: visible !important;
                height: auto !important;
                min-height: 0 !important;
                flex: none !important;
            }

            /* Image: only shown when question has one, compact height */
            .img-frame {
                height: 200px !important;
                max-height: 200px !important;
                padding: 6px;
                align-items: stretch !important;
            }
            .img-frame img {
                width: 100% !important;
                height: 100% !important;
                object-fit: contain !important;
                max-width: 100% !important;
                max-height: 100% !important;
            }
            /* When no image: collapse gap so options sit tight under question text */
            .q-body.no-image {
                gap: 0 !important;
            }
            .q-body.no-image .img-frame {
                display: none !important;
            }

            /* Options: natural height, no scroll trap */
            .options-list {
                overflow: visible !important;
                height: auto !important;
                display: flex !important;
                flex-direction: column !important;
            }

            /* Image-grid options: 2x2 but fixed reasonable height */
            .options-list.img-grid {
                display: grid !important;
                grid-template-columns: 1fr 1fr !important;
                grid-template-rows: 130px 130px !important;
                height: auto !important;
                overflow: visible !important;
            }
            .options-list.img-grid .opt-row {
                height: 130px !important;
                overflow: hidden !important;
            }

            .opt-row { padding: 11px 10px; gap: 10px; }
            .opt-label { font-size: 0.93rem; }
            .timer-val { font-size: 1.45rem; }

            /* Nav bar: always visible at bottom of content */
            .nav-bar {
                padding-top: 14px;
                margin-top: 4px;
            }
            .btn { padding: 11px 18px; font-size: 0.88rem; }
        }

        @media (max-width: 360px) {
            .prog-mobile .prog-dot { width: 26px; height: 26px; }
            .prog-mobile .prog-row { gap: 3px; }
            .btn { padding: 10px 14px; font-size: 0.82rem; }
        }

        :root {
            --brand: #0F1F33;
            --brand-2: #0066FF;
            --surface: #f4f8fc;
            --surface-2: #ffffff;
            --border: #d7e3f1;
            --text: #132238;
            --muted: #63758a;
        }

        html, body {
            background: radial-gradient(circle at top left, #edf5ff 0%, #f7fbff 38%, #f3f5f8 100%);
            color: var(--text);
        }

        .page {
            padding: 18px 20px 10px;
            gap: 14px;
        }

        .timer-card {
            background: linear-gradient(135deg, #0F1F33 0%, #123A67 42%, #0066FF 100%);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 18px;
            padding: 12px 24px;
            box-shadow: 0 16px 30px rgba(15, 31, 51, 0.18);
        }

        .timer-label {
            color: rgba(255,255,255,0.88);
            letter-spacing: 0.15em;
        }

        .timer-val {
            color: #ffffff;
            font-size: 2rem;
            letter-spacing: 0.04em;
        }

            background: rgba(255,255,255,0.96);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 22px 24px 18px;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.06);
        }

        .prog-dot {
            border-color: #cddbe5;
            background: #ffffff;
            box-shadow: inset 0 1px 2px rgba(15,23,42,0.03);
        }

        .prog-dot.answered {
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
            border-color: var(--brand);
            color: #ffffff;
        }

        .prog-dot.current:not(.answered) {
            border-color: var(--brand);

        }

        .q-text {
            background: linear-gradient(135deg, #f8fbff 0%, #f2f7ff 100%);

            line-height: 1.65;
        }

            border-radius: 14px;

            box-shadow: inset 0 1px 3px rgba(15,23,42,0.04);
        }

        .opt-row {
            border: 1px solid #e6edf4;

        }

        .opt-row:hover {
            transform: translateY(-1px);

        }

        .opt-row.selected, .opt-row:has(input:checked) {
            background: linear-gradient(135deg, #eef9ff 0%, #f8fbff 100%);
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(11, 105, 139, 0.1);
        }

        .nav-bar {
            border-top: 1px solid #e8eef4;
            padding-top: 12px;
        }

        .btn {
            border-radius: 10px;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.06);
        }

        .btn-back {
            background: #f1f5f9;

        }

        .btn-next, .btn-submit {
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
        }

@media (max-width: 640px) {
            .page {
                padding: 12px 10px 16px;
            }

            .question-card {
                padding: 14px 14px 16px;
            }

            .q-text {
                font-size: 0.97rem;
            }
        }

        /* Responsive exam layout: keep every control inside the viewport. */
        @media (max-width: 900px) {
            html, body {
                width: 100%;
                min-height: 100%;
                height: auto;
                overflow-x: hidden;
                overflow-y: auto;
            }

            .page {
                width: 100%;
                min-height: 100vh;
                min-height: 100svh;
                height: auto;
                overflow: visible;
                padding: max(12px, env(safe-area-inset-top)) 12px calc(78px + env(safe-area-inset-bottom));
                gap: 12px;
            }

            .timer-card {
                width: 100%;
                padding: 10px 14px;
                border-radius: 15px;
            }

            .timer-label { font-size: 0.68rem; }
            .timer-val { font-size: clamp(1.45rem, 7vw, 1.8rem); }

            .prog-desktop { display: none !important; }
            .prog-mobile { display: flex !important; }

            .question-card {
                width: 100%;
                flex: none;
                height: auto;
                min-height: 0;
                overflow: visible;
                padding: 14px 13px 15px;
                gap: 12px;
                border-radius: 17px;
            }

            .prog-mobile {
                width: 100%;
                gap: 5px;
            }

            .prog-mobile .prog-row {
                width: 100%;
                display: grid;
                grid-template-columns: repeat(10, minmax(0, 1fr));
                gap: clamp(2px, 1vw, 5px);
            }

            .prog-mobile .prog-dot {
                width: clamp(20px, 6.5vw, 28px);
                height: clamp(20px, 6.5vw, 28px);
                justify-self: center;
            }

            .prog-mobile .prog-line { max-width: 100%; }

            .q-text {
                padding: 11px 12px;
                font-size: 0.98rem;
                line-height: 1.55;
                overflow-wrap: anywhere;
            }

            .q-body {
                width: 100%;
                min-width: 0;
                min-height: 0;
                height: auto;
                flex: none;
                grid-template-columns: minmax(0, 1fr);
                gap: 10px;
                overflow: visible;
            }

            .img-frame {
                width: 100%;
                height: auto !important;
                min-height: clamp(160px, 40vw, 220px) !important;
                max-height: none !important;
                padding: 8px;
                align-items: center !important;
                overflow: visible !important;
            }

            .img-frame img {
                width: auto !important;
                height: auto !important;
                max-width: 100% !important;
                max-height: 55svh !important;
                object-fit: contain !important;
                object-position: center;
            }

            .options-list {
                width: 100%;
                min-width: 0;
                height: auto;
                overflow: visible;
                gap: 7px;
            }

            .opt-row {
                min-width: 0;
                margin-bottom: 0;
                padding: 11px 10px;
                gap: 10px;
            }

            .opt-label {
                min-width: 0;
                font-size: 0.94rem;
                line-height: 1.45;
                overflow-wrap: anywhere;
            }

            .options-list.img-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                grid-template-rows: repeat(2, minmax(120px, 38vw)) !important;
                gap: 8px;
                height: auto;
                overflow: visible;
            }

            .options-list.img-grid .opt-row {
                width: 100%;
                height: 100% !important;
                min-width: 0;
                padding: 7px;
                margin: 0;
                overflow: visible !important;
            }

            .img-opt-box {
                min-width: 0;
                width: 100%;
                overflow: visible;
            }

            .img-opt-box img {
                width: 100%;
                height: auto;
                max-width: 100%;
                max-height: 100%;
                object-fit: contain !important;
                object-position: center;
            }

            .nav-bar {
                width: 100%;
                gap: 8px;
                padding-top: 12px;
                margin-top: 0;
            }

            .q-counter { flex-shrink: 0; font-size: 0.8rem; }
            .nav-btns { min-width: 0; gap: 7px; }
            .btn { justify-content: center; padding: 11px clamp(11px, 3.5vw, 17px); font-size: 0.84rem; }

            .footer {
                position: fixed;
                z-index: 20;
                right: 0;
                bottom: 0;
                left: 0;
                min-height: 48px;
                padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
                line-height: 1.45;
                text-align: center;
                box-shadow: 0 -6px 18px rgba(15, 23, 42, 0.12);

            .footer > div { column-gap: 6px !important; }
        }

        @media (max-width: 360px) {
            .page { padding-right: 9px; padding-left: 9px; }
            .question-card { padding-right: 10px; padding-left: 10px; }
            .q-counter { font-size: 0.74rem; }
            .nav-btns { gap: 5px; }
            .btn { padding-right: 10px; padding-left: 10px; font-size: 0.8rem; }
            .options-list.img-grid { grid-template-rows: repeat(2, minmax(112px, 36vw)) !important; }
        }

        /* Final visual system for desktop, tablet, and phone layouts. */
        :root {
            --brand: #0F1F33;
            --brand-2: #0066FF;
            --surface: #ffffff;
            --surface-soft: #f4f8fc;
            --border: #d7e3f1;
            --text: #132238;
            --muted: #63758a;
            --primary-soft: #eaf4ff;
        }

        html, body {
            min-height: 100%;
            height: 100dvh;
            background: radial-gradient(ellipse at top, #eaf6fb 0%, #f4f8fb 48%, #edf2f6 100%);
            color: var(--text);
        }

        .page {
            width: 100%;
            padding: clamp(14px, 2.5vh, 26px) clamp(16px, 3vw, 38px) 10px;
            gap: 15px;
        }

        .timer-card, .question-card { max-width: 1100px; }

        .timer-card {
            padding: 12px 22px;
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 18px;
            background: linear-gradient(130deg, #0F1F33 0%, #123A67 38%, #0066FF 100%);
            box-shadow: 0 12px 28px rgba(15,31,51,0.18);
        }

        .timer-label { color: rgba(255,255,255,0.82); letter-spacing: 0.15em; }
        .timer-val { color: #fff; font-size: clamp(1.65rem, 3vw, 2rem); letter-spacing: 0.03em; }

        .question-card {
            padding: clamp(18px, 2.4vw, 28px);
            gap: clamp(14px, 2vh, 20px);
            border: 1px solid rgba(209,222,233,0.9);
            border-radius: 22px;
            background: rgba(255,255,255,0.97);
            box-shadow: 0 20px 50px rgba(30,58,82,0.09), 0 2px 8px rgba(30,58,82,0.04);
        }

        .prog-desktop .prog-row { gap: clamp(5px, 0.8vw, 9px); }
        .prog-dot {
            width: 34px;
            height: 34px;
            border: 2px solid #d3e0e9;
            box-shadow: 0 2px 5px rgba(15,45,68,0.05);
        }
        .prog-dot.answered { background: linear-gradient(135deg, var(--brand-2), var(--brand)); border-color: var(--brand-2); }
        .prog-dot.current:not(.answered) { border-color: var(--brand-2); box-shadow: 0 0 0 4px rgba(0,102,255,0.12); }
        .prog-line { height: 4px; background: #e5edf6; }
        .prog-line-fill { background: linear-gradient(90deg, var(--brand), var(--brand-2)); }

        .q-text {
            padding: 15px 17px;
            border: 1px solid #dfeaf7;
            border-radius: 14px;
            background: linear-gradient(135deg, #f5faff, #edf5ff);
            color: #132238;
            line-height: 1.6;
        }

        .q-body { grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr); gap: 18px; }
        .img-frame {
            border: 1px solid #dce7ef;
            border-radius: 16px;
            background: linear-gradient(145deg, #f9fcfe, #fff);
            box-shadow: inset 0 1px 3px rgba(15,45,68,0.04);
        }
        .img-frame img, .img-opt-box img { object-fit: contain; object-position: center; }

        .options-list { gap: 8px; padding: 1px 3px 1px 1px; }
        .opt-row {
            padding: 13px 14px;
            border: 1px solid #dfeaf7;
            border-radius: 13px;
            background: #fff;
            transition: border-color 160ms ease, background 160ms ease, box-shadow 160ms ease, transform 160ms ease;
        }
        .opt-row:hover { border-color: #bdd6f3; background: #f8fbff; box-shadow: 0 5px 14px rgba(15,31,51,0.05); transform: translateY(-1px); }
        .opt-row.selected, .opt-row:has(input:checked) {
            border-color: var(--brand-2);
            background: linear-gradient(135deg, #edf5ff, #f7fbff);
            box-shadow: 0 0 0 3px rgba(0,102,255,0.10);
        }
        .opt-radio, .img-opt-head input { accent-color: var(--brand-2); }
        .opt-label { color: #1d2e44; }

        .options-list.img-grid { gap: 12px; }
        .options-list.img-grid .opt-row { border: 1px solid #e2ebf1; border-radius: 14px; background: #fff; }
        .img-opt-head { color: #536a7d; }
        .img-opt-box { border-radius: 9px; background: #f9fbfc; }

        .nav-bar { border-color: #e5edf2; padding-top: 16px; }
        .q-counter { color: #64788b; font-variant-numeric: tabular-nums; }
        .nav-btns { gap: 9px; }
        .btn {
            min-height: 44px;
            justify-content: center;
            padding: 12px 22px;
            border-radius: 12px;
            transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
        }
        .btn:focus-visible, .opt-row:focus-within { outline: 3px solid rgba(14,122,160,0.25); outline-offset: 2px; }
        .btn-back { border: 1px solid #dbe7f3; background: #f5f8fc; color: #2d4057; box-shadow: none; }
        .btn-back:hover { background: #ebf3fb; }
        .btn-next { background: linear-gradient(135deg, #0066FF, #0B4F9C); box-shadow: 0 7px 17px rgba(0,102,255,0.2); }
        .btn-next:hover { background: linear-gradient(135deg, #0059db, #0b4388); }
        .btn-submit { background: linear-gradient(135deg, #16845d, #21a675); box-shadow: 0 7px 17px rgba(22,132,93,0.2); }
        .btn-submit:hover { background: linear-gradient(135deg, #126f4f, #198e64); }

        .footer {
            min-height: 38px;
            background: #14283a;
            color: #b7c8d5;
            letter-spacing: 0.01em;
        }
        .footer strong { color: #75d4df; }

        @media (max-width: 900px) {
            html, body { height: auto !important; min-height: 100%; overflow-y: auto !important; }
            .page { min-height: 100vh; min-height: 100svh; padding-bottom: calc(82px + env(safe-area-inset-bottom)); }
            .timer-card, .question-card { max-width: 100%; }
            .question-card { gap: 14px; }
            .q-body { grid-template-columns: minmax(0, 1fr); gap: 12px; }
            .options-list { padding: 0; }
            .opt-row { padding: 13px 14px; }
            .footer {
                position: fixed;
                z-index: 20;
                right: 0;
                bottom: 0;
                left: 0;
                padding: 9px 14px calc(9px + env(safe-area-inset-bottom));
                box-shadow: 0 -6px 20px rgba(20,40,58,0.13);
            }
        }

        @media (max-width: 600px) {
            .page { padding-right: 12px; padding-left: 12px; gap: 11px; }
            .timer-card { padding: 9px 13px; border-radius: 15px; }
            .timer-label { font-size: 0.64rem; }
            .timer-val { font-size: 1.55rem; }
            .question-card { padding: 13px 12px 14px; border-radius: 17px; }
            .prog-mobile { gap: 6px; }
            .prog-mobile .prog-row { gap: 3px; }
            .prog-mobile .prog-dot { width: clamp(20px, 6vw, 26px); height: clamp(20px, 6vw, 26px); }
            .q-text { padding: 12px 13px; font-size: 0.96rem; }
            .img-frame { border-radius: 13px; }
            .options-list.img-grid { gap: 8px; }
            .options-list.img-grid .opt-row { padding: 6px; border-radius: 11px; }
            .nav-bar { align-items: center; padding-top: 12px; }
            .q-counter { font-size: 0.76rem; }
            .nav-btns { gap: 6px; }
            .btn { min-height: 42px; padding: 10px 13px; font-size: 0.82rem; }
            .footer { font-size: 0.64rem; }
            .footer > div { gap: 5px !important; }
        }

        @media (max-width: 360px) {
            .page { padding-right: 9px; padding-left: 9px; }
            .question-card { padding-right: 10px; padding-left: 10px; }
            .prog-mobile .prog-dot { width: 20px; height: 20px; }
            .q-counter { font-size: 0.7rem; }
            .btn { padding-right: 10px; padding-left: 10px; }
        }

        @media (min-width: 901px) and (max-height: 760px) {
            html, body { height: auto; min-height: 100dvh; overflow-y: auto; }
            .page { height: auto; min-height: 100dvh; flex: none; overflow: visible; }
            .question-card { flex: none; min-height: 500px; }
            .q-body { min-height: 330px; flex: none; }
        }

        /* Let long questions and answers extend the page instead of creating a nested scrollbox. */
        html, body { height: auto; min-height: 100dvh; overflow-x: hidden; overflow-y: auto; }
        .page { min-height: 100dvh; overflow: visible; }
        .question-card { flex: 1 0 auto; min-height: 0; overflow: visible; }
        .q-body { flex: 0 0 auto; min-height: 0; overflow: visible; align-items: start; }
        .q-body.no-image { grid-template-columns: minmax(0, 1fr); }
        .img-frame { width: 100%; min-height: 0; aspect-ratio: 4 / 3; max-height: 420px; padding: 6px; overflow: hidden; }
        .img-frame img { width: 100%; height: 100%; object-fit: contain; object-position: center; }
        .options-list { height: auto; overflow: visible; gap: 9px; padding: 0; }
        .opt-row { min-height: 44px; margin-bottom: 0; padding: 11px 13px; gap: 11px; }
        .opt-label { line-height: 1.45; overflow-wrap: anywhere; }
        .options-list.img-grid { height: auto; grid-template-rows: repeat(2, minmax(150px, 18vw)); overflow: visible; }
        .options-list.img-grid .opt-row { height: auto; min-height: 0; overflow: hidden; }
        .q-text { padding: 12px 15px; line-height: 1.5; overflow-wrap: anywhere; }
        .timer-card { padding: 10px 20px; }
        .nav-bar { gap: 10px; }
        .nav-btns { margin-left: auto; }
        .btn:disabled { cursor: wait; opacity: .78; transform: none; }
        .prog-dot.current { outline: 2px solid rgba(0,102,255,.28); outline-offset: 2px; }
        #ik-confirm-overlay .ik-confirm-card { max-width: 390px; }
        #ik-confirm-overlay .ik-confirm-msg { white-space: pre-line; color: #42576a; }
        #ik-confirm-overlay .ik-confirm-icon.success::before { content: '\2713'; font-size: 1.75rem; font-weight: 800; }
        #ik-confirm-overlay .ik-confirm-icon.success i { display: none; }
        #ik-confirm-overlay .ik-confirm-btn { min-height: 44px; }

        @media (max-width: 900px) {
            .page { min-height: 100svh; }
            .question-card { flex: none; }
            .q-body { display: grid; grid-template-columns: minmax(0, 1fr); }
            .img-frame { aspect-ratio: auto; height: auto !important; min-height: 0 !important; max-height: none !important; }
            .img-frame img { width: 100% !important; height: auto !important; max-height: min(45svh, 360px) !important; }
            .options-list.img-grid { grid-template-rows: repeat(2, minmax(125px, 34vw)) !important; }
        }
        @media (max-width: 600px) {
            .options-list.img-grid { grid-template-rows: repeat(2, minmax(105px, 34vw)) !important; }
            .opt-row { padding: 11px 12px; }
            .nav-btns { flex-wrap: wrap; justify-content: flex-end; }
            #ik-confirm-overlay { padding: 12px; }
            #ik-confirm-overlay .ik-confirm-header { padding: 22px 18px 0; }
            #ik-confirm-overlay .ik-confirm-msg { padding: 10px 18px 0; }
            #ik-confirm-overlay .ik-confirm-footer { padding: 18px; gap: 8px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>

<div class="page">

    <!-- Timer -->
    <div class="timer-card">
        <div class="timer-label">Igihe gisigaye</div>
        <div class="timer-val" id="examCountdown">20:00</div>
    </div>

    <!-- Question Card -->
    <div class="question-card">

        <!-- DESKTOP progress -->
        <div class="prog-desktop" id="progDesktop">
            <div class="prog-row" id="progDesktopRow"></div>
            <div class="prog-line"><div class="prog-line-fill" id="progFillD"></div></div>
        </div>

        <!-- MOBILE progress: 2 rows of 10 -->
        <div class="prog-mobile" id="progMobile">
            <div class="prog-row" id="progMobileRow1"></div>
            <div class="prog-row" id="progMobileRow2"></div>
            <div class="prog-line" style="width:85%;margin-top:3px;"><div class="prog-line-fill" id="progFillM"></div></div>
        </div>

        <!-- Question text -->
        <div class="q-text" id="qText">Uraza kubona ikibazo hano...</div>

        <!-- Body -->
        <div class="q-body no-image" id="qBody">
            <div class="img-frame" id="imgFrame" style="display:none;"></div>
            <div class="options-list" id="optsList"></div>
        </div>

        <!-- Nav -->
        <div class="nav-bar">
            <div class="q-counter" id="qCounter">Ikibazo 1 kuri 20</div>
            <div class="nav-btns">
                <button class="btn btn-back" id="prevBtn">&#8592; Inyuma</button>
                <button class="btn btn-next" id="nextBtn">Komeza &#8594;</button>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;text-align:center;">
            <span>© 2026 IKIZAME · DOTADO STATIONERY STORE LTD</span>
        </div>
    </footer>
</div>



<script src="/assets/js/ikizame-ui.js"></script>
<script src="/assets/js/exam-image-utils.js?v=20260718"></script>
<script>
// Detect reload using PerformanceNavigationTiming (modern) with fallback
const navEntry = performance.getEntriesByType('navigation')[0];
const isReloaded = navEntry ? navEntry.type === 'reload' : (performance.navigation && performance.navigation.type === 1);
if (isReloaded) {
    sessionStorage.removeItem('isExamAlreadyStarted');
    ikAlert('Ntabwo wemerewe gukora Refresh/Reload mu gihe cy\'ikizamini kigikomeza!', 'warning', 'Ikizamini Cyahagaritswe').then(() => window.location.replace('/'));
}
if (!sessionStorage.getItem('studentName') || !sessionStorage.getItem('phoneNumber')) {
    sessionStorage.clear(); window.location.replace('/');
}
if (sessionStorage.getItem('isExamAlreadyStarted') === 'true' && !isReloaded) {
    // already running, fine, continue
} else if (!isReloaded) {
    sessionStorage.setItem('isExamAlreadyStarted', 'true');
}

// Block F5, Ctrl+R, Cmd+R refresh
document.addEventListener('keydown', function(e) {
    if (e.key === 'F5' || ((e.ctrlKey || e.metaKey) && e.key === 'r') || ((e.ctrlKey || e.metaKey) && e.key === 'R')) {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }
}, true);

// Block browser refresh/close while exam is running
window.addEventListener('beforeunload', function(e) {
    if (sessionStorage.getItem('isExamAlreadyStarted') === 'true') {
        e.preventDefault();
        e.returnValue = '';
        return '';
    }
});

document.addEventListener('DOMContentLoaded', () => {
    window.history.pushState(null, "", window.location.href);
    window.onpopstate = () => {
        window.history.pushState(null, "", window.location.href);
        ikToast('Ntabwo wemerewe gusubira inyuma ikizamini kigikomeza!', 'warning');
    };

    let questions = [], idx = 0;
    const answers = {};
    const prefetchedImages = new Set();
    let submitInFlight = false;
    let submitDialogOpen = false;

    const countdownEl    = document.getElementById('examCountdown');
    const qTextEl        = document.getElementById('qText');
    const qBodyEl        = document.getElementById('qBody');
    const imgFrameEl     = document.getElementById('imgFrame');
    const optsEl         = document.getElementById('optsList');
    const qCounterEl     = document.getElementById('qCounter');
    const prevBtn        = document.getElementById('prevBtn');
    const nextBtn        = document.getElementById('nextBtn');
    const progDesktopRow = document.getElementById('progDesktopRow');
    const progMobileRow1 = document.getElementById('progMobileRow1');
    const progMobileRow2 = document.getElementById('progMobileRow2');
    const progFillD      = document.getElementById('progFillD');
    const progFillM      = document.getElementById('progFillM');

    // Timer, deadline-based so it works even when tab is in background
    const examDeadline = Date.now() + 20 * 60 * 1000;
    function tickTimer() {
        const remaining = Math.max(0, Math.round((examDeadline - Date.now()) / 1000));
        const m = Math.floor(remaining / 60), s = remaining % 60;
        countdownEl.textContent = `${m<10?'0'+m:m}:${s<10?'0'+s:s}`;
        if (remaining <= 60) { countdownEl.style.color = '#dc2626'; }
        if (remaining <= 0) { sessionStorage.removeItem('isExamAlreadyStarted'); submit(); return; }
        setTimeout(tickTimer, 500);
    }
    tickTimer();

    function makeDot(i) {
        const q = questions[i];
        const dot = document.createElement('div');
        const isAns = !!answers[String(q.id)];
        const isCur = i === idx;
        dot.className = 'prog-dot' + (isAns ? ' answered' : '') + (isCur ? ' current' : '');
        if (isAns) {
            dot.innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M2 7l3.5 3.5L12 3" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>`;
        }
        return dot;
    }

    function updateLine(fillEl, total) {
        const answered = Object.keys(answers).length;
        const pct = total > 0 ? (answered / total) * 100 : 0;
        fillEl.style.width = pct + '%';
    }

    function buildProgress() {
        const total = questions.length;
        progDesktopRow.innerHTML = '';
        for (let i = 0; i < total; i++) progDesktopRow.appendChild(makeDot(i));
        updateLine(progFillD, total);

        progMobileRow1.innerHTML = '';
        progMobileRow2.innerHTML = '';
        for (let i = 0; i < Math.min(10, total); i++) progMobileRow1.appendChild(makeDot(i));
        for (let i = 10; i < total; i++)               progMobileRow2.appendChild(makeDot(i));
        updateLine(progFillM, total);
    }

    function prefetchNearbyImages() {
        [idx, idx + 1].forEach(i => {
            const q = questions[i];
            if (!q) return;
            const sources = [q.image_path || q.image_url || '', q.option_a, q.option_b, q.option_c, q.option_d];
            sources.forEach((value, optionIndex) => {
                if (optionIndex > 0 && !(/\.(png|jpg|jpeg|gif|webp)$/i.test(value || '') || /^option[A-D]_File-/i.test(value || ''))) return;
                const src = normalizeQuestionImageAssetPath(value || '');
                if (!src || prefetchedImages.has(src)) return;
                prefetchedImages.add(src);
                const image = new Image();
                image.src = src;
            });
        });
    }

    function render() {
        const q = questions[idx];
        qCounterEl.textContent = `Ikibazo ${idx + 1} kuri ${questions.length}`;

        const txt = q.question.replace(/\r?\n|\r/g, ' ');
        qTextEl.textContent = txt;
        qTextEl.style.fontSize = txt.length > 280 ? '0.92rem' : txt.length > 180 ? '1.0rem' : '1.12rem';

        buildProgress();

        // Scroll to top on mobile when navigating
        if (window.innerWidth <= 900) {
            window.scrollTo({ top: 0, behavior: 'auto' });
        }

        // Image
        const normalizedMainImage = normalizeQuestionImageAssetPath(q.image_path || q.image_url || '');
        if (normalizedMainImage) {
            imgFrameEl.style.display = 'flex';
            qBodyEl.classList.remove('no-image');
            imgFrameEl.innerHTML = `<img src="${normalizedMainImage}" alt="Ishusho ijyanye n’ikibazo" decoding="async" fetchpriority="high" loading="eager">`;
        } else {
            imgFrameEl.style.display = 'none';
            imgFrameEl.replaceChildren();
            qBodyEl.classList.add('no-image');
        }

        const saved = answers[String(q.id)] || '';
        const opts = [
            { key: 'A', val: q.option_a },
            { key: 'B', val: q.option_b },
            { key: 'C', val: q.option_c },
            { key: 'D', val: q.option_d }
        ];

        const isImgOpts = /\.(png|jpg|jpeg|gif|webp)$/i.test(q.option_a)
                       || q.option_a.startsWith('optionA_File-')
                       || q.option_b.startsWith('optionB_File-');

        if (isImgOpts) {
            optsEl.className = 'options-list img-grid';
            optsEl.innerHTML = opts.map(o => {
                const normalizedValue = normalizeQuestionImageAssetPath(o.val || '');
                return `
                <label class="opt-row${saved===o.key?' selected':''}">
                    <div class="img-opt-head">
                        <input type="radio" name="choice" value="${o.key}" ${saved===o.key?'checked':''}
                            onchange="pick('${o.key}',${q.id},this)">
                        <strong>${o.key.toLowerCase()})</strong>
                    </div>
                    <div class="img-opt-box">
                        <img src="${normalizedValue}" alt="Ishusho y’ihitamo ${o.key}" decoding="async">
                    </div>
                </label>`;
            }).join('');
        } else {
            optsEl.className = 'options-list';
            optsEl.innerHTML = opts.map(o => `
                <label class="opt-row${saved===o.key?' selected':''}">
                    <input class="opt-radio" type="radio" name="choice" value="${o.key}" ${saved===o.key?'checked':''}
                        onchange="pick('${o.key}',${q.id},this)">
                    <span class="opt-label"><strong>${o.key.toLowerCase()})</strong> ${o.val}</span>
                </label>`).join('');
        }

        prevBtn.style.visibility = idx === 0 ? 'hidden' : 'visible';
        if (idx === questions.length - 1) {
            nextBtn.innerHTML = 'Soza Ikizamini &#10003;';
            nextBtn.className = 'btn btn-submit';
        } else {
            nextBtn.innerHTML = 'Komeza &#8594;';
            nextBtn.className = 'btn btn-next';
        }
        prefetchNearbyImages();
    }

    window.pick = function(key, id, el) {
        answers[String(id)] = key;
        el.closest('.options-list').querySelectorAll('.opt-row').forEach(r => r.classList.remove('selected'));
        el.closest('.opt-row').classList.add('selected');
        buildProgress();
    };

    function showSubmitModal() {
        if (submitInFlight || submitDialogOpen) return;
        submitDialogOpen = true;
        const answered = Object.keys(answers).length;
        const total = questions.length;
        const unanswered = total - answered;
        const msg = unanswered > 0
            ? `Wasubije ibibazo ${answered} kuri ${total}.\nHasigaye ibibazo ${unanswered} bitarasubizwa.\nUrashaka gusoza ikizamini ubu?`
            : 'Wasubije ibibazo byose.\nUrashaka gusoza ikizamini ubu?';
        ikConfirm(msg, 'success', 'Soza ikizamini?', 'Soza Ikizamini', 'Subira').then(confirmed => {
            submitDialogOpen = false;
            if (!confirmed) return;
            submit();
        });
    }

    prevBtn.addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
    nextBtn.addEventListener('click', () => {
        if (idx < questions.length - 1) { idx++; render(); }
        else { showSubmitModal(); }
    });

    function submit() {
        if (submitInFlight) return;
        submitInFlight = true;
        nextBtn.disabled = true;
        nextBtn.textContent = 'Turimo gusoza...';
        let analyticsSubmitSucceeded = false;
        const payload = {};
        for (const id in answers) payload[`question_${id}`] = answers[id];
        fetch('/api/exams/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(r => { analyticsSubmitSucceeded = r.ok; if (!r.ok) throw new Error('Exam submission failed'); return r.json(); })
        .then(res => {
            if (analyticsSubmitSucceeded && typeof res.score === 'number' && Number.isFinite(res.score) && Number(res.total) > 0) {
                window.IkizameAnalytics?.examCompleted(Number(res.total));
            }
            sessionStorage.setItem('latestScore', res.score);
            sessionStorage.setItem('latestTotal', res.total);
            sessionStorage.setItem('studentAnswerMapping', JSON.stringify(answers));
            sessionStorage.setItem('shuffledQuestionsReview', JSON.stringify(questions));
            questions = [];
            sessionStorage.removeItem('isExamAlreadyStarted');
            window.location.replace('/exam-score');
        })
        .catch(e => {
            console.error('Submit error:', e);
            submitInFlight = false;
            nextBtn.disabled = false;
            nextBtn.innerHTML = idx === questions.length - 1 ? 'Soza Ikizamini &#10003;' : 'Komeza &#8594;';
            ikToast('Ikizamini nticyabashije koherezwa. Ongera ugerageze.', 'error');
        });
    }

    let analyticsQuestionsSucceeded = false;
    fetch('/api/exams')
        .then(r => { analyticsQuestionsSucceeded = r.ok; return r.json(); })
        .then(data => {
            questions = data;
            if (!questions.length) {
                document.querySelector('.question-card').innerHTML = '<p style="text-align:center;padding:40px;font-weight:700;">Nta bibazo biri mu bubiko.</p>';
                return;
            }
            // Render first question immediately; render() prefetches only the current and next images.
            if (analyticsQuestionsSucceeded) window.IkizameAnalytics?.examStarted(questions.length);
            render();
        });
});
</script>
