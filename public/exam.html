<!DOCTYPE html>
<html lang="rw">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <!-- 🎯 BRANDING HEADER: LINKS DIRECTLY TO YOUR LOGO IN THE UPLOADS FOLDER -->
    <link rel="icon" type="image/png" href="assets/uploads/logo.png">
    <title>Ikizamini | IKIZAME - Kora Ikizamini</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/design-system.css">
    <style>
        :root {
            --blue: #0066FF;
            --border: #E2E8F0;
            --text: #0F172A;
            --muted: #64748B;
            --green: #16A34A;
            --bg: #F8FAFC;
            --primary-soft: #EBF3FF;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

        /* ══════════════════════════════
           DESKTOP: fully contained, no page scroll
        ══════════════════════════════ */
        html, body {
            height: 100vh;
            height: -webkit-fill-available;
            background: linear-gradient(135deg, #f8fbff 0%, #eef6ff 100%);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .page {
            flex: 1; min-height: 0;
            display: flex; flex-direction: column; align-items: center;
            padding: 14px 20px 8px; gap: 12px; overflow: hidden;
        }

        /* ── TIMER ── */
        .timer-card {
            background: rgba(255,255,255,0.96); border: 1px solid var(--border); border-radius: 18px;
            padding: 12px 24px; text-align: center;
            width: 100%; max-width: 960px; flex-shrink: 0;
            box-shadow: 0 12px 30px rgba(15,23,42,0.06);
        }
        .timer-label { font-size: 0.72rem; font-weight: 700; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
        .timer-val   { font-size: 1.75rem; font-weight: 800; color: var(--text); font-variant-numeric: tabular-nums; line-height: 1.2; }

        /* ── QUESTION CARD ── */
        .question-card {
            background: rgba(255,255,255,0.98); border: 1px solid var(--border); border-radius: 22px;
            padding: 22px 28px 16px;
            width: 100%; max-width: 960px;
            flex: 1; min-height: 0;
            display: flex; flex-direction: column; gap: 18px;
            overflow: hidden;
            box-shadow: 0 18px 40px rgba(15,23,42,0.06);
        }

        /* ── PROGRESS ── */
        .prog-desktop {
            flex-shrink: 0;
            display: flex; flex-direction: column; gap: 10px;
        }
        .prog-desktop .prog-row {
            display: flex; flex-wrap: nowrap;
            justify-content: center; align-items: center; gap: 8px;
        }
        .prog-line {
            width: 100%; height: 3px;
            background: #e5e7eb; border-radius: 2px; position: relative;
        }
        .prog-line-fill {
            height: 100%; background: linear-gradient(90deg, var(--blue), #00B8D9); border-radius: 2px;
            position: absolute; left: 0; top: 0; transition: width 0.25s;
        }
        .prog-dot {
            width: 36px; height: 36px; border-radius: 50%;
            border: 2px solid #d1d5db; background: #fff;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; cursor: default; pointer-events: none;
            transition: border-color 0.12s, background 0.12s;
        }
        .prog-dot svg { display: none; }
        .prog-dot.answered { background: var(--blue); border-color: var(--blue); }
        .prog-dot.answered svg { display: block; }
        .prog-dot.current:not(.answered) { border-color: var(--blue); border-width: 3px; }

        .prog-mobile { display: none; flex-shrink: 0; flex-direction: column; gap: 5px; align-items: center; }
        .prog-mobile .prog-row { display: flex; flex-direction: row; justify-content: center; align-items: center; gap: 5px; }
        .prog-mobile .prog-dot { width: 30px; height: 30px; }

        /* ── QUESTION TEXT ── */
        .q-text {
            font-size: 1.12rem; font-weight: 600; color: var(--text); line-height: 1.6;
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--primary-soft) 0%, #f8fbff 100%); border-radius: 12px; padding: 14px 16px;
        }

        /* ── BODY (DESKTOP) ── */
        .q-body {
            flex: 1; min-height: 0;
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px; overflow: hidden;
        }
        .q-body.no-image { grid-template-columns: 1fr; }

        .img-frame {
            border: 1px solid var(--border); border-radius: 10px; background: #fff;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; padding: 10px; min-height: 0;
        }
        .img-frame img { width: 100%; height: 100%; object-fit: contain; display: block; }

        /* ── OPTIONS (DESKTOP) ── */
        .options-list {
            display: flex; flex-direction: column;
            overflow-y: auto; height: 100%;
        }
        .opt-row {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 12px;
            border-bottom: 1px solid #f3f4f6;
            border-radius: 12px;
            cursor: pointer; background: transparent;
            transition: background 0.12s, border-color 0.12s; flex-shrink: 0;
            border: 1px solid transparent;
        }
        .opt-row:last-child { border-bottom: none; }
        .opt-row:hover { background: #f9fafb; border-color: #dbeafe; }
        .opt-row.selected { background: var(--primary-soft); border-color: #bfdbfe; }
        .opt-radio { width: 20px; height: 20px; accent-color: var(--blue); flex-shrink: 0; cursor: pointer; }
        .opt-label { font-size: 1.02rem; font-weight: 500; color: var(--text); line-height: 1.5; }
        .opt-label strong { font-weight: 700; }

        /* ── IMAGE OPTIONS 2×2 (DESKTOP) ── */
        .options-list.img-grid {
            display: grid !important;
            grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
            gap: 10px; overflow: hidden; height: 100%;
        }
        .options-list.img-grid .opt-row {
            flex-direction: column; align-items: stretch;
            padding: 8px; gap: 6px; height: 100%; overflow: hidden;
            border-bottom: none;
        }
        .img-opt-head { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; font-weight: 700; color: var(--muted); flex-shrink: 0; }
        .img-opt-head input { width: 15px; height: 15px; accent-color: var(--blue); }
        .img-opt-box { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; border-radius: 5px; background: #fff; }
        .img-opt-box img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }

        /* ── NAV BAR ── */
        .nav-bar {
            display: flex; align-items: center; justify-content: space-between;
            border-top: 1px solid var(--border); padding-top: 14px; flex-shrink: 0;
        }
        .q-counter { font-size: 0.9rem; font-weight: 700; color: var(--muted); }
        .nav-btns { display: flex; gap: 10px; }
        .btn { border: none; padding: 12px 28px; font-size: 0.95rem; font-weight: 700; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: background 0.15s, transform 0.15s; }
        .btn:hover { transform: translateY(-1px); }
        .btn-back   { background: #f1f5f9; color: #475569; border: 1px solid var(--border); }
        .btn-back:hover { background: #e2e8f0; }
        .btn-next   { background: linear-gradient(135deg, var(--blue), #00B8D9); color: #fff; box-shadow: 0 10px 24px rgba(0,102,255,0.16); }
        .btn-next:hover { background: linear-gradient(135deg, #0052CC, #0E7490); }
        .btn-submit { background: linear-gradient(135deg, var(--green), #22C55E); color: #fff; box-shadow: 0 10px 24px rgba(22,163,74,0.16); }
        .btn-submit:hover { background: linear-gradient(135deg, #15803D, #16A34A); }

        /* ── FOOTER ── */
        .footer { text-align: center; font-size: 0.7rem; color: #9ca3af; padding-bottom: 4px; flex-shrink: 0; }
        .footer strong { color: #6b7280; }

        .options-list::-webkit-scrollbar { width: 3px; }
        .options-list::-webkit-scrollbar-track { background: transparent; }
        .options-list::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 2px; }

        /* ══════════════════════════════
           MOBILE ≤ 640px
           Key change: page scrolls naturally, no overflow:hidden traps
        ══════════════════════════════ */
        @media (max-width: 640px) {
            /* Let the whole page scroll */
            html, body {
                height: auto !important;
                overflow: auto !important;
            }

            .page {
                overflow: visible !important;
                height: auto !important;
                padding: 10px 10px 16px;
                gap: 10px;
            }

            /* Question card: no fixed height, grows with content */
            .question-card {
                flex: none !important;
                height: auto !important;
                min-height: 0 !important;
                overflow: visible !important;
                padding: 12px 14px 14px;
                gap: 12px;
            }

            /* Progress: show mobile dots */
            .prog-desktop { display: none !important; }
            .prog-mobile  { display: flex !important; }

            /* Question text */
            .q-text { font-size: 0.95rem; padding: 10px 12px; }

            /* Body: stack vertically, no fixed height */
            .q-body {
                grid-template-columns: 1fr !important;
                gap: 10px;
                overflow: visible !important;
                height: auto !important;
                min-height: 0 !important;
                flex: none !important;
            }

            /* Image: only shown when question has one, compact height */
            .img-frame {
                height: 200px !important;
                max-height: 200px !important;
                padding: 6px;
                align-items: stretch !important;
            }
            .img-frame img {
                width: 100% !important;
                height: 100% !important;
                object-fit: contain !important;
                max-width: 100% !important;
                max-height: 100% !important;
            }
            /* When no image: collapse gap so options sit tight under question text */
            .q-body.no-image {
                gap: 0 !important;
            }
            .q-body.no-image .img-frame {
                display: none !important;
            }

            /* Options: natural height, no scroll trap */
            .options-list {
                overflow: visible !important;
                height: auto !important;
                display: flex !important;
                flex-direction: column !important;
            }

            /* Image-grid options: 2x2 but fixed reasonable height */
            .options-list.img-grid {
                display: grid !important;
                grid-template-columns: 1fr 1fr !important;
                grid-template-rows: 130px 130px !important;
                height: auto !important;
                overflow: visible !important;
            }
            .options-list.img-grid .opt-row {
                height: 130px !important;
                overflow: hidden !important;
            }

            .opt-row { padding: 11px 10px; gap: 10px; }
            .opt-label { font-size: 0.93rem; }
            .timer-val { font-size: 1.45rem; }

            /* Nav bar: always visible at bottom of content */
            .nav-bar {
                padding-top: 14px;
                margin-top: 4px;
            }
            .btn { padding: 11px 18px; font-size: 0.88rem; }
        }

        @media (max-width: 360px) {
            .prog-mobile .prog-dot { width: 26px; height: 26px; }
            .prog-mobile .prog-row { gap: 3px; }
            .btn { padding: 10px 14px; font-size: 0.82rem; }
        }

        }

        html, body {

        .page {

            letter-spacing: 0.15em;
        }

        .timer-val {
            color: #ffffff;
            font-size: 2rem;
            letter-spacing: 0.04em;
        }

        .question-card {
            background: rgba(255,255,255,0.96);
            border: 1px solid var(--border);

            padding: 22px 24px 18px;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.06);
        }

        .prog-dot {
            border-color: #cddbe5;
            background: #ffffff;
            box-shadow: inset 0 1px 2px rgba(15,23,42,0.03);
        }

        .prog-dot.answered {
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
            border-color: var(--brand);
            color: #ffffff;
        }

        .prog-dot.current:not(.answered) {
            border-color: var(--brand);

            box-shadow: 0 0 0 3px rgba(11, 105, 139, 0.12);
        }

        .q-text {
            background: linear-gradient(135deg, #f8fbff 0%, #f2f7ff 100%);

            padding: 14px 16px;
            font-size: 1.05rem;
            line-height: 1.65;
        }

        .img-frame {
            border-radius: 14px;
            border: 1px solid var(--border);
            box-shadow: inset 0 1px 3px rgba(15,23,42,0.04);
        }

        .opt-row {
            border: 1px solid #e6edf4;
            border-radius: 12px;
            padding: 13px 14px;
            margin-bottom: 8px;
            background: #ffffff;
            transition: all 0.2s ease;
        }

        .opt-row:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.06);
        }

        .opt-row.selected {
            background: linear-gradient(135deg, #eef9ff 0%, #f8fbff 100%);
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(11, 105, 139, 0.1);
        }

        .nav-bar {
            border-top: 1px solid #e8eef4;
            padding-top: 12px;
        }

        .btn {
            border-radius: 10px;
            box-shadow: 0 8px 18px rgba(15, 23, 42, 0.06);
        }

        .btn-back {
            background: #f1f5f9;
            color: #334155;
        }

        .btn-next, .btn-submit {
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-2) 100%);
        }

        .footer {
            color: #64748b;
            padding-bottom: 6px;
        }

        @media (max-width: 640px) {
            .page {
                padding: 12px 10px 16px;
            }

            .question-card {
                padding: 14px 14px 16px;
            }

            .q-text {
                font-size: 0.97rem;
            }
        }
    </style>
</head>

<div class="page">

    <!-- Timer -->
    <div class="timer-card">

    <div class="footer">

<script src="/assets/js/exam-image-utils.js?v=20260718"></script>
<script>
// Detect reload using PerformanceNavigationTiming (modern) with fallback
const navEntry = performance.getEntriesByType('navigation')[0];
const isReloaded = navEntry ? navEntry.type === 'reload' : (performance.navigation && performance.navigation.type === 1);
if (isReloaded) {
    sessionStorage.removeItem('isExamAlreadyStarted');
    alert("IKIZAME CYAHAGARIKWA! Ntabwo wemerewe gukora Refresh/Reload.");
    window.location.replace('/');
}
if (!sessionStorage.getItem('studentName') || !sessionStorage.getItem('phoneNumber')) {
    sessionStorage.clear(); window.location.replace('/');
}
if (sessionStorage.getItem('isExamAlreadyStarted') === 'true' && !isReloaded) {
    // already running, fine, continue
} else if (!isReloaded) {
    sessionStorage.setItem('isExamAlreadyStarted', 'true');
}

// Block F5, Ctrl+R, Cmd+R refresh
document.addEventListener('keydown', function(e) {
    if (e.key === 'F5' || ((e.ctrlKey || e.metaKey) && e.key === 'r') || ((e.ctrlKey || e.metaKey) && e.key === 'R')) {
        e.preventDefault();
        e.stopPropagation();
        return false;
    }
}, true);

// Block browser refresh/close while exam is running
window.addEventListener('beforeunload', function(e) {
    if (sessionStorage.getItem('isExamAlreadyStarted') === 'true') {
        e.preventDefault();
        e.returnValue = '';
        return '';
    }
});

document.addEventListener('DOMContentLoaded', () => {
    window.history.pushState(null, "", window.location.href);
    window.onpopstate = () => {
        window.history.pushState(null, "", window.location.href);
        alert("Ntabwo wemerewe gusubira inyuma ikizamini kigikomeza!");
    };

    let questions = [], idx = 0;
    const answers = {};

    const countdownEl    = document.getElementById('examCountdown');
    const qTextEl        = document.getElementById('qText');
    const qBodyEl        = document.getElementById('qBody');
    const imgFrameEl     = document.getElementById('imgFrame');
    const optsEl         = document.getElementById('optsList');
    const qCounterEl     = document.getElementById('qCounter');
    const prevBtn        = document.getElementById('prevBtn');
    const nextBtn        = document.getElementById('nextBtn');
    const progDesktopRow = document.getElementById('progDesktopRow');
    const progMobileRow1 = document.getElementById('progMobileRow1');
    const progMobileRow2 = document.getElementById('progMobileRow2');
    const progFillD      = document.getElementById('progFillD');
    const progFillM      = document.getElementById('progFillM');

    // Timer, deadline-based so it works even when tab is in background
    const examDeadline = Date.now() + 20 * 60 * 1000;
    function tickTimer() {
        const remaining = Math.max(0, Math.round((examDeadline - Date.now()) / 1000));
        const m = Math.floor(remaining / 60), s = remaining % 60;
        countdownEl.textContent = `${m<10?'0'+m:m}:${s<10?'0'+s:s}`;
        if (remaining <= 60) { countdownEl.style.color = '#dc2626'; }
        if (remaining <= 0) { sessionStorage.removeItem('isExamAlreadyStarted'); submit(); return; }
        setTimeout(tickTimer, 500);
    }
    tickTimer();

    function makeDot(i) {
        const q = questions[i];
        const dot = document.createElement('div');
        const isAns = !!answers[String(q.id)];
        const isCur = i === idx;
        dot.className = 'prog-dot' + (isAns ? ' answered' : '') + (isCur ? ' current' : '');
        if (isAns) {
            dot.innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M2 7l3.5 3.5L12 3" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>`;
        }
        return dot;
    }

    function updateLine(fillEl, total) {
        const answered = Object.keys(answers).length;
        const pct = total > 0 ? (answered / total) * 100 : 0;
        fillEl.style.width = pct + '%';
    }

    function buildProgress() {
        const total = questions.length;
        progDesktopRow.innerHTML = '';
        for (let i = 0; i < total; i++) progDesktopRow.appendChild(makeDot(i));
        updateLine(progFillD, total);

        progMobileRow1.innerHTML = '';
        progMobileRow2.innerHTML = '';
        for (let i = 0; i < Math.min(10, total); i++) progMobileRow1.appendChild(makeDot(i));
        for (let i = 10; i < total; i++)               progMobileRow2.appendChild(makeDot(i));
        updateLine(progFillM, total);
    }

    function render() {
        const q = questions[idx];
        qCounterEl.textContent = `< ${idx+1} / ${questions.length} >`;

        const txt = q.question.replace(/\r?\n|\r/g, ' ');
        qTextEl.textContent = txt;
        qTextEl.style.fontSize = txt.length > 280 ? '0.92rem' : txt.length > 180 ? '1.0rem' : '1.12rem';

        buildProgress();

        // Scroll to top on mobile when navigating
        if (window.innerWidth <= 640) {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Image
        const normalizedMainImage = normalizeQuestionImageAssetPath(q.image_path || q.image_url || '');
        if (normalizedMainImage) {
            imgFrameEl.style.display = 'flex';
            qBodyEl.classList.remove('no-image');
            imgFrameEl.innerHTML = `<img src="${normalizedMainImage}" alt="Ikimenyetso" decoding="async" fetchpriority="high" loading="eager">`;
        } else {
            imgFrameEl.style.display = 'none';
            qBodyEl.classList.add('no-image');
        }

        const saved = answers[String(q.id)] || '';
        const opts = [
            { key: 'A', val: q.option_a },
            { key: 'B', val: q.option_b },
            { key: 'C', val: q.option_c },
            { key: 'D', val: q.option_d }
        ];

        const isImgOpts = /\.(png|jpg|jpeg|gif|webp)$/i.test(q.option_a)
                       || q.option_a.startsWith('optionA_File-')
                       || q.option_b.startsWith('optionB_File-');

        if (isImgOpts) {
            optsEl.className = 'options-list img-grid';
            optsEl.innerHTML = opts.map(o => {
                const normalizedValue = normalizeQuestionImageAssetPath(o.val || '');
                return `
                <label class="opt-row${saved===o.key?' selected':''}">
                    <div class="img-opt-head">
                        <input type="radio" name="choice" value="${o.key}" ${saved===o.key?'checked':''}
                            onchange="pick('${o.key}',${q.id},this)">
                        <strong>${o.key.toLowerCase()})</strong>
                    </div>
                    <div class="img-opt-box">
                        <img src="${normalizedValue}" alt="Option ${o.key}" decoding="async">
                    </div>
                </label>`;
            }).join('');
        } else {
            optsEl.className = 'options-list';
            optsEl.innerHTML = opts.map(o => `
                <label class="opt-row${saved===o.key?' selected':''}">
                    <input class="opt-radio" type="radio" name="choice" value="${o.key}" ${saved===o.key?'checked':''}
                        onchange="pick('${o.key}',${q.id},this)">
                    <span class="opt-label"><strong>${o.key.toLowerCase()})</strong> ${o.val}</span>
                </label>`).join('');
        }

        prevBtn.style.visibility = idx === 0 ? 'hidden' : 'visible';
        if (idx === questions.length - 1) {
            nextBtn.innerHTML = 'Soza Ikizamini &#10003;';
            nextBtn.className = 'btn btn-submit';
        } else {
            nextBtn.innerHTML = 'Komeza &#8594;';
            nextBtn.className = 'btn btn-next';
        }
    }

    window.pick = function(key, id, el) {
        answers[String(id)] = key;
        el.closest('.options-list').querySelectorAll('.opt-row').forEach(r => r.classList.remove('selected'));
        el.closest('.opt-row').classList.add('selected');
        buildProgress();
    };

    const submitModal   = document.getElementById('submitModal');
    const modalCancel   = document.getElementById('modalCancel');
    const modalConfirm  = document.getElementById('modalConfirm');

    function showSubmitModal() {
        submitModal.style.display = 'flex';
    }
    modalCancel.addEventListener('click', () => {
        submitModal.style.display = 'none';
    });
    modalConfirm.addEventListener('click', () => {
        submitModal.style.display = 'none';
        sessionStorage.removeItem('isExamAlreadyStarted');
        submit();
    });

    prevBtn.addEventListener('click', () => { if (idx > 0) { idx--; render(); } });
    nextBtn.addEventListener('click', () => {
        if (idx < questions.length - 1) { idx++; render(); }
        else { showSubmitModal(); }
    });

    function submit() {
        const payload = {};
        for (const id in answers) payload[`question_${id}`] = answers[id];
        fetch('/api/exams/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        })
        .then(r => r.json())
        .then(res => {
            sessionStorage.setItem('latestScore', res.score);
            sessionStorage.setItem('latestTotal', res.total);
            sessionStorage.setItem('studentAnswerMapping', JSON.stringify(answers));
            sessionStorage.setItem('shuffledQuestionsReview', JSON.stringify(questions));
            questions = [];
            window.location.replace('/exam-score');
        })
        .catch(e => console.error('Submit error:', e));
    }

    fetch('/api/exams')
        .then(r => r.json())
        .then(data => {
            questions = data;
            if (!questions.length) {
                document.querySelector('.question-card').innerHTML = '<p style="text-align:center;padding:40px;font-weight:700;">Nta bibazo biri mu bubiko.</p>';
                clearInterval(timer); return;
            }
            // Render first question immediately, then preload all images in background
            render();
            setTimeout(() => {
                questions.forEach(q => {
                    const mainSrc = normalizeQuestionImageAssetPath(q.image_path || q.image_url || '');
                    if (mainSrc) { const i = new Image(); i.src = mainSrc; }
                    ['option_a','option_b','option_c','option_d'].forEach(k => {
                        const optValue = q[k];
                        const normalizedOpt = normalizeQuestionImageAssetPath(optValue || '');
                        if (optValue && /\.(png|jpg|jpeg|gif|webp)$/i.test(optValue)) { const i = new Image(); i.src = normalizedOpt; }
                    });
                });
            }, 100);
        });
});
</script>
</body>
</html>
