name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - feat/ga4-search-console-validation

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PAYPACK_CLIENT_ID: test-client-id
      PAYPACK_CLIENT_SECRET: test-client-secret
      PAYPACK_WEBHOOK_SECRET: test-webhook-secret
      PAYPACK_MERCHANT_CODE: test-merchant
      SESSION_SECRET: test-session-secret
      GA4_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
